<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER-X // AEROSPACE PROPULSION & MISSION ANALYSIS SUITE (v0.6 OBSIDIAN BLUEPRINT)</title>

  <!-- Typography: Inter, JetBrains Mono & Share Tech Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- React 18, Babel Standalone & Chart.js 4 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

  <style>

    :root {
      --bg-void: #090A0C;
      --bg-panel: #101216;
      --bg-panel-header: #161920;
      --bg-card: #101216;
      --bg-card-header: #161920;
      --bg-input: #0B0D11;
      
      --border-hairline: #242832;
      --border-focus: #363C4A;
      --border-crosshair: #485063;

      --text-white: #F2F4F8;
      --text-silver: #8E95A5;
      --text-dim: #4B5563;

      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-crimson: #EF4444;
      --accent-cyan: #38BDF8;

      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Share Tech Mono', 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--text-white);
      font-size: 11px;
      line-height: 1.4;
    }

    #root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Subtle Avionics Drafting Grid */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    /* Custom Precision Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-void); }
    ::-webkit-scrollbar-thumb { background: #242832; border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: #363C4A; }

    /* ════════════════════════════════════════════════════════════════════════
       3-ROW MASTER VIEWPORT LAYOUT (LOCKED 100vh - NO SCROLL)
       ════════════════════════════════════════════════════════════════════════ */
    .app-header {
      height: 44px;
      min-height: 44px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      z-index: 100;
      position: relative;
    }

    .app-workspace {
      height: calc(100vh - 70px);
      display: grid;
      grid-template-columns: 300px 1fr;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .app-sidebar {
      width: 300px;
      height: 100%;
      overflow-y: auto;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-hairline);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .app-mainstage {
      height: 100%;
      overflow-y: auto;
      background: var(--bg-void);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .app-footer {
      height: 26px;
      min-height: 26px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 10px;
      color: var(--text-silver);
      letter-spacing: 0.5px;
      z-index: 100;
      position: relative;

    /* ════════════════════════════════════════════════════════════════════════
       TOP HEADER NAV: TITLE, 9 DOMAIN PILLS, UNITS, STATUS, CLOCK
       ════════════════════════════════════════════════════════════════════════ */

      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-white);
      flex-shrink: 0;
    }
    .header-branding .crosshair-mark {
      color: var(--accent-amber);
      font-size: 14px;
      line-height: 1;
    }

    .domain-nav-container {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-shrink: 0;
    }

    .domain-pills-strip {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: nowrap;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .domain-pills-strip::-webkit-scrollbar { display: none; }

    .domain-pill {
      background: transparent;
      border: 1px solid var(--border-hairline);
      color: var(--text-silver);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 3px 6px;
      cursor: pointer;

    .domain-pill.active {

    }

    .domain-select-dropdown {
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      color: var(--accent-amber);
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;

      border-radius: 0;
      flex-shrink: 0;
    }
    .domain-select-dropdown:focus {
      outline: none;
      border-color: var(--accent-amber);
    }

    .header-telemetry-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .unit-toggle-pill {
      display: flex;

    .unit-toggle-btn {
      background: transparent;
      border: none;

      font-size: 9.5px;
      font-weight: 600;
      padding: 3px 8px;
      cursor: pointer;
      transition: all 0.15s ease;

    .unit-toggle-btn.active {

      font-weight: 700;

    .solver-status-badge {

    /* ════════════════════════════════════════════════════════════════════════

      border: 1px solid var(--border-hairline);
      position: relative;

      top: -6px;
      left: -5px;
      color: var(--border-crosshair);

      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1;
      pointer-events: none;
    }

    .panel-card-header {
      background: var(--bg-panel-header);
      border-bottom: 1px solid var(--border-hairline);

      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-silver);

    .panel-card-body {
      padding: 10px;
    }

    /* ════════════════════════════════════════════════════════════════════════

       ════════════════════════════════════════════════════════════════════════ */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));

    .kpi-block {
      background: var(--bg-panel);

      display: flex;

    .kpi-label {

      font-size: 10px;

    .slider-group {
      margin-bottom: 9px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 10px;
      margin-bottom: 2px;
    }
    .slider-label {
      color: var(--text-silver);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .slider-val {
      color: var(--text-white);
      font-weight: 700;
    }

    .range-input {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: repeating-linear-gradient(90deg, #363C4A 0px, #363C4A 1px, transparent 1px, transparent 8px), #161920;
      border: 1px solid var(--border-hairline);
      border-radius: 0;
      outline: none;
      cursor: pointer;
      margin: 3px 0 6px;

    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 8px;
      height: 16px;
      background: var(--text-white);
      border: 1px solid var(--bg-void);
      border-radius: 0;
      cursor: ew-resize;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
      transition: background 0.1s ease;
    }
    .range-input::-webkit-slider-thumb:hover {
      background: var(--accent-amber);
    }
    .range-input::-moz-range-thumb {
      width: 8px;
      height: 16px;
      background: var(--text-white);
      border: 1px solid var(--bg-void);
      border-radius: 0;
      cursor: ew-resize;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }
    .range-input::-moz-range-thumb:hover {
      background: var(--accent-amber);
    }

    /* ════════════════════════════════════════════════════════════════════════
       BUTTONS, DROPDOWNS, SUB-TABS & SELECTORS
       ════════════════════════════════════════════════════════════════════════ */
    .blueprint-btn {
      background: #14171E;
      border: 1px solid var(--border-hairline);
      color: var(--text-silver);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 0;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .blueprint-btn:hover {
      color: var(--text-white);
      border-color: var(--border-focus);
      background: #1A1F29;
    }
    .blueprint-btn.primary {
      background: rgba(245, 158, 11, 0.12);
      border-color: var(--accent-amber);
      color: var(--accent-amber);
      font-weight: 700;
    }
    .blueprint-btn.primary:hover {
      background: rgba(245, 158, 11, 0.22);
    }
    .blueprint-btn.active {
      background: #1E2430;
      border-color: var(--accent-amber);
      color: var(--text-white);
      font-weight: 700;
    }

    .blueprint-select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-hairline);
      color: var(--text-white);
      font-size: 10.5px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 0;
      outline: none;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .blueprint-select:focus {
      border-color: var(--accent-amber);
    }

    /* ════════════════════════════════════════════════════════════════════════
       BLUEPRINT DATA TABLES
       ════════════════════════════════════════════════════════════════════════ */
    .table-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 420px;
    }
    .blueprint-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
    }
    .blueprint-table th {
      background: var(--bg-panel-header);
      color: var(--text-silver);
      text-align: left;
      padding: 5px 8px;
      border-bottom: 1px solid var(--border-hairline);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }
    .blueprint-table th.num, .blueprint-table td.num {
      text-align: right;
    }
    .blueprint-table td {
      padding: 4px 8px;
      border-bottom: 1px solid #1A1E26;
      color: #CBD5E1;

    }
    .blueprint-table tr:nth-child(even) td {

    }
    .blueprint-table tr:hover td {
      background: rgba(245, 158, 11, 0.06);
    }
    .blueprint-table tr.selected td {
      background: rgba(56, 189, 248, 0.12);
      color: var(--text-white);
      font-weight: 700;
    }

    /* ════════════════════════════════════════════════════════════════════════
       TECHNICAL TAGS & STATUS BADGES
       ════════════════════════════════════════════════════════════════════════ */
    .tech-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-block;
    }
    .tech-tag.optimal {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent-emerald);
      color: var(--accent-emerald);
    }
    .tech-tag.warning {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--accent-amber);
      color: var(--accent-amber);
    }

      background: rgba(239, 68, 68, 0.15);

    .chart-box {

<body>
  <div id="root"></div>

  <script type="text/babel">

    const { useState, useEffect, useRef, useCallback, useMemo, useContext, createContext } = React;
    const API = "";

    // ── Number Formatters ─────────────────────────────────────────────────────
    function fmt(val, dec = 2) {
      if (val === null || val === undefined || isNaN(val)) return "---";
      return Number(val).toFixed(dec);
    }

    function fmtInt(val) {
      if (val === null || val === undefined || isNaN(val)) return "---";
      return Math.round(Number(val)).toLocaleString();
    }

    function fmtPct(val, dec = 1) {
      if (val === null || val === undefined || isNaN(val)) return "---";
      const num = Number(val);
      const pct = num <= 1.0 && num > 0.0 ? num * 100 : num;
      return `${pct.toFixed(dec)}%`;
    }

    // ── Global Unit System Context & Conversion Engine ────────────────────────
    const UnitContext = createContext({ unitSystem: "SI", setUnitSystem: () => {} });

    function convertUnitVal(val, type, unitSystem) {
      if (val == null || isNaN(val)) return null;
      const num = Number(val);
      if (unitSystem === "IMPERIAL") {
        switch (type) {
          case "thrust": return num * 224.808943; // kN -> lbf
          case "thrust_N": return num * 0.224808943; // N -> lbf
          case "mass": return num * 2.20462262; // kg -> lbm
          case "massflow": return num * 2.20462262; // kg/s -> lb/s
          case "fuelflow": return num * 7936.6414; // kg/s -> lb/hr
          case "fuelflow_kgh": return num * 2.20462262; // kg/h -> lb/hr
          case "temp": return num * 1.8; // K -> °R
          case "pressure": return num * 0.145037738; // kPa -> psia
          case "tsfc": return num * 0.03530394; // g/(kN·s) -> lb/(lbf·hr)
          case "power": return num * 1.341022; // kW -> shp
          case "torque": return num * 0.737562; // N·m -> ft·lbf
          case "velocity": return num * 1.943844; // m/s -> kts
          case "distance_km": return num * 0.5399568; // km -> NM
          case "density": return num * 0.06242796; // kg/m³ -> lb/ft³
          case "altitude": return num; // FT is already imperial
          default: return num;
        }
      }
      return num;
    }

    function getUnitStr(type, unitSystem) {
      if (unitSystem === "IMPERIAL") {
        switch (type) {
          case "thrust": return "lbf";
          case "thrust_N": return "lbf";
          case "mass": return "lbm";
          case "massflow": return "lb/s";
          case "fuelflow": return "lb/hr";
          case "fuelflow_kgh": return "lb/hr";
          case "temp": return "°R";
          case "pressure": return "psia";
          case "tsfc": return "lb/lbf·h";
          case "power": return "shp";
          case "torque": return "ft·lbf";
          case "velocity": return "kts";
          case "distance_km": return "NM";
          case "density": return "lb/ft³";
          case "altitude": return "FT";
          default: return "";
        }
      } else {
        switch (type) {
          case "thrust": return "kN";
          case "thrust_N": return "N";
          case "mass": return "kg";
          case "massflow": return "kg/s";
          case "fuelflow": return "kg/s";
          case "fuelflow_kgh": return "kg/h";
          case "temp": return "K";
          case "pressure": return "kPa";
          case "tsfc": return "g/kN·s";
          case "power": return "kW";
          case "torque": return "N·m";
          case "velocity": return "m/s";
          case "distance_km": return "km";
          case "density": return "kg/m³";
          case "altitude": return "FT";
          default: return "";
        }
      }
    }

    function formatErrorText(err) {
      if (!err) return null;
      if (typeof err === "string") return err;
      if (err.detail) return typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail);
      if (err.message) return err.message;
      try {
        return JSON.stringify(err);
      } catch (_) {
        return String(err);
      }
    }

    // ── 80ms Live Debounced Callback Hook ─────────────────────────────────────
    function useDebouncedCallback(callback, delay = 80) {
      const timer = useRef(null);
      const callbackRef = useRef(callback);
      useEffect(() => {
        callbackRef.current = callback;
      }, [callback]);

      return useCallback((...args) => {
        if (timer.current) clearTimeout(timer.current);
        timer.current = setTimeout(() => {
          callbackRef.current(...args);
        }, delay);
      }, [delay]);
    }

    // ── Obsidian Chart.js Hook (Strict In-Place Updates, Zero Destroy Flashes) ──
    function useNeonChart(canvasRef, type, data, extraOptions = {}) {
      const chartInstanceRef = useRef(null);
      const optionsRef = useRef(extraOptions);
      optionsRef.current = extraOptions;

      useEffect(() => {
        if (!canvasRef.current || !data) return;
        const ctx = canvasRef.current.getContext("2d");

        const defaultOptions = {
          responsive: true,
          maintainAspectRatio: false,
          animation: false, // Strict: no 0-baseline collapse or bouncing
          plugins: {
            legend: {
              display: data.datasets && data.datasets.length > 1,
              position: "top",
              labels: {
                color: "#8E95A5",
                font: { family: "'JetBrains Mono', monospace", size: 9.5 },
                boxWidth: 10,
                padding: 6
              }
            },
            tooltip: {
              backgroundColor: "#161920",
              titleColor: "#F2F4F8",
              bodyColor: "#CBD5E1",
              borderColor: "#242832",
              borderWidth: 1,
              padding: 8,
              cornerRadius: 0,
              titleFont: { family: "'JetBrains Mono', monospace", size: 10, weight: "bold" },
              bodyFont: { family: "'JetBrains Mono', monospace", size: 9.5 }
            }
          },
          scales: {
            x: {
              grid: { color: "rgba(36, 40, 50, 0.6)", drawBorder: false },
              ticks: { color: "#8E95A5", font: { family: "'JetBrains Mono', monospace", size: 9 } }
            },
            y: {
              grid: { color: "rgba(36, 40, 50, 0.6)", drawBorder: false },
              ticks: { color: "#8E95A5", font: { family: "'JetBrains Mono', monospace", size: 9 } }
            }
          }
        };

        const opts = optionsRef.current || {};
        const mergedOptions = {
          ...defaultOptions,
          ...opts,
          plugins: { ...defaultOptions.plugins, ...(opts.plugins || {}) },
          scales: {
            x: { ...defaultOptions.scales.x, ...(opts.scales?.x || {}) },
            y: { ...defaultOptions.scales.y, ...(opts.scales?.y || {}) },
            ...(opts.scales?.y1 ? { y1: opts.scales.y1 } : {})
          }
        };

        if (chartInstanceRef.current) {
          chartInstanceRef.current.data = data;
          chartInstanceRef.current.options = mergedOptions;
          chartInstanceRef.current.update("none");
        } else {
          chartInstanceRef.current = new Chart(ctx, {
            type,
            data,
            options: mergedOptions
          });
        }
      }, [canvasRef, type, data]);

      useEffect(() => {
        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
            chartInstanceRef.current = null;
          }
        };
      }, []);

      return chartInstanceRef;
    }

    // ── Avionics Graduated Vernier Slider ─────────────────────────────────────
    function HudSlider({ label, value, min, max, step, unit = "", onChange }) {
      return (
        <div className="slider-group">
          <div className="slider-header">
            <span className="slider-label">{label}</span>
            <span className="slider-val">{value} {unit && <span style={{ color: "#8E95A5", fontWeight: 400 }}>{unit}</span>}</span>
          </div>
          <input
            type="range"
            className="range-input"
            min={min}
            max={max}
            step={step}
            value={value}
            onChange={e => onChange(parseFloat(e.target.value))}
          />
        </div>
      );
    }

    // ── Stark Titanium White KPI Card ─────────────────────────────────────────
    function HudKpi({ label, value, unit = "", unitType = null, sub = "", subTag = null, decimals = 2 }) {
      const { unitSystem } = useContext(UnitContext);
      let displayVal = value;
      let displayUnit = unit;
      
      if (unitType && value != null && !isNaN(value)) {
        const converted = convertUnitVal(value, unitType, unitSystem);
        displayVal = fmt(converted, (unitType === 'power' || unitType === 'torque' || (unitType === 'thrust' && unitSystem === 'IMPERIAL')) ? 0 : decimals);
        displayUnit = getUnitStr(unitType, unitSystem);
      } else if (value != null && !isNaN(value) && typeof value === 'number') {
        displayVal = fmt(value, decimals);
      }

      return (
        <div className="kpi-block">
          <div className="kpi-label">{label}</div>
          <div className="kpi-value">
            {displayVal} {displayUnit && <span className="kpi-unit">{displayUnit}</span>}
          </div>
          {(sub || subTag) && (
            <div className="kpi-sub">
              {subTag && <span className={`tech-tag ${subTag.type || "optimal"}`}>{subTag.label}</span>}
              {sub && <span>{sub}</span>}
            </div>
          )}
        </div>
      );
    }

    // ── Station Telemetry Table with Dynamic Units & Interactive Probing ──────
    const CANONICAL_STATION_ORDER = ["0", "a", "amb", "1", "2", "13", "18", "21", "25", "3", "4", "41", "45", "5", "7", "8", "9"];

    function StationTable({ stations, selectedStation, onSelectStation }) {
      const { unitSystem } = useContext(UnitContext);
      if (!stations) return (
        <div style={{ padding: "20px", textAlign: "center", color: "#485063" }}>
          [NO STATION TELEMETRY LOADED]
        </div>
      );

      const rawList = Array.isArray(stations) ? stations : Object.keys(stations).map(k => ({
        id: k,
        ...stations[k]
      }));

      // Deduplicate by normalized station ID
      const seen = new Set();
      const stnArray = [];
      for (const s of rawList) {
        const idKey = String(s.id ?? s.station ?? s.num ?? "").trim().toLowerCase();
        if (!seen.has(idKey)) {
          seen.add(idKey);
          stnArray.push(s);
        }
      }

      // Canonical gas-path sorting
      stnArray.sort((a, b) => {
        const keyA = String(a.id ?? a.station ?? a.num ?? "").trim().toLowerCase();
        const keyB = String(b.id ?? b.station ?? b.num ?? "").trim().toLowerCase();
        const idxA = CANONICAL_STATION_ORDER.indexOf(keyA);
        const idxB = CANONICAL_STATION_ORDER.indexOf(keyB);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        if (idxA !== -1) return -1;
        if (idxB !== -1) return 1;
        return keyA.localeCompare(keyB, undefined, { numeric: true });
      });

      const tUnit = unitSystem === "IMPERIAL" ? "°R" : "K";
      const pUnit = unitSystem === "IMPERIAL" ? "psia" : "kPa";
      const vUnit = unitSystem === "IMPERIAL" ? "kts" : "m/s";

      return (
        <div className="table-container">
          <table className="blueprint-table">
            <thead>
              <tr>
                <th>STATION</th>
                <th>IDENTIFIER / DESCRIPTION</th>
                <th className="num">Tt [{tUnit}]</th>
                <th className="num">Pt [{pUnit}]</th>
                <th className="num">Ts [{tUnit}]</th>
                <th className="num">Ps [{pUnit}]</th>
                <th className="num">MACH</th>
                <th className="num">VEL [{vUnit}]</th>
                <th className="num">ENTROPY [J/kg·K]</th>
              </tr>
            </thead>
            <tbody>
              {stnArray.map((s, idx) => {
                const id = s.id || s.station || s.num || idx;
                const desc = s.label || s.desc || `Station ${id}`;
                const rawTt = s.T_total_K ?? s.T0 ?? s.Tt ?? s.T_K;
                const rawPt = s.p_total_kPa ?? s.p0_kPa ?? (s.p0 ? s.p0 / 1000 : (s.P_atm ? s.P_atm * 101.325 : null));
                const rawTs = s.T_static_K ?? s.Ts ?? s.Ts_K ?? (rawTt ? rawTt * 0.95 : null);
                const rawPs = s.p_static_kPa ?? s.ps_kPa ?? (s.p ? s.p / 1000 : null);
                const M = s.mach ?? s.Mach ?? s.M ?? 0.0;
                const rawV = s.velocity_ms ?? s.V_ms ?? s.V ?? 0.0;
                const rawEntropy = s.s_JkgK ?? s.s ?? s.s_J_kgK ?? null;
                const entropy = (rawEntropy != null && !isNaN(rawEntropy)) ? rawEntropy : 6850.0;

                const Tt = convertUnitVal(rawTt, "temp", unitSystem);
                const Pt = convertUnitVal(rawPt, "pressure", unitSystem);
                const Ts = convertUnitVal(rawTs, "temp", unitSystem);
                const Ps = convertUnitVal(rawPs, "pressure", unitSystem);
                const V = convertUnitVal(rawV, "velocity", unitSystem);

                const isSelected = selectedStation != null && (String(selectedStation) === String(id) || String(selectedStation) === String(s.stnKey));

                return (
                  <tr 
                    key={idx} 
                    className={isSelected ? "selected" : ""} 
                    onClick={() => onSelectStation && onSelectStation(id)}
                    style={{ cursor: onSelectStation ? "pointer" : "default" }}
                  >
                    <td style={{ color: "var(--accent-amber)", fontWeight: 700 }}>STN {id}</td>
                    <td>{desc}</td>
                    <td className="num" style={{ color: "#F2F4F8", fontWeight: 600 }}>{fmt(Tt, 1)}</td>
                    <td className="num">{fmt(Pt, 1)}</td>
                    <td className="num">{fmt(Ts, 1)}</td>
                    <td className="num">{fmt(Ps, 1)}</td>
                    <td className="num" style={{ color: M >= 1.0 ? "var(--accent-amber)" : "inherit" }}>{fmt(M, 3)}</td>
                    <td className="num">{fmt(V, 1)}</td>
                    <td className="num" style={{ color: "#8E95A5" }}>{fmt(entropy, 0)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      );
    }

    // ── Closed Thermodynamic Brayton T-s Diagram Component ───────────────────
    function BraytonTsChart({ stations, braytonLoop, isTurbofan = false, selectedStation, onSelectStation }) {
      const canvasRef = useRef(null);
      const [relativeEntropy, setRelativeEntropy] = useState(true);

      const chartData = useMemo(() => {
        const datasets = [];
        if (!stations && !braytonLoop) return null;

        // 1. Core Brayton Closed Loop Curve
        const loop = braytonLoop?.core_loop || braytonLoop?.brayton_cycle?.core_loop || (Array.isArray(braytonLoop) ? braytonLoop : null);
        if (loop && loop.length > 0) {
          const corePoints = loop.map(pt => ({
            x: relativeEntropy ? (pt.delta_s_kJkgK != null ? pt.delta_s_kJkgK : ((pt.s_JkgK - 6850.0) / 1000.0)) : pt.s_JkgK,
            y: pt.T_K
          }));

          datasets.push({
            label: "CORE BRAYTON CYCLE LOOP",
            data: corePoints,
            borderColor: "#38BDF8", // Ice Blue
            backgroundColor: "rgba(56, 189, 248, 0.06)",
            borderWidth: 2,
            tension: 0.18,
            pointRadius: 0,
            fill: true,
            showLine: true
          });

          // Atmospheric Cooling Closing Leg (dashed line from 8 back to ambient)
          if (corePoints.length >= 2) {
            const lastPt = corePoints[corePoints.length - 1];
            const firstPt = corePoints[0];
            datasets.push({
              label: "ATMOSPHERIC HEAT REJECTION (CLOSURE)",
              data: [corePoints[Math.max(0, corePoints.length - 4)], lastPt, firstPt],
              borderColor: "#64748B",
              borderWidth: 1.5,
              borderDash: [5, 4],
              pointRadius: 0,
              fill: false,
              showLine: true
            });
          }
        }

        // 2. Turbofan Bypass Loop (amber curve)
        const bypassLoop = braytonLoop?.bypass_loop || braytonLoop?.brayton_cycle?.bypass_loop;
        if (isTurbofan && bypassLoop?.length > 0) {
          const bypassPoints = bypassLoop.map(pt => ({
            x: relativeEntropy ? (pt.delta_s_kJkgK != null ? pt.delta_s_kJkgK : ((pt.s_JkgK - 6850.0) / 1000.0)) : pt.s_JkgK,
            y: pt.T_K
          }));

          datasets.push({
            label: "BYPASS STREAM EXPANSION (FAN DUCT)",
            data: bypassPoints,
            borderColor: "#F59E0B", // Avionics Amber
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 0,
            fill: false,
            showLine: true
          });
        }

        // 3. Discrete Station Markers with Labels (Sorted in canonical order, obeying Second Law)
        if (stations) {
          const rawStnList = Object.keys(stations).map(k => ({
            id: k,
            ...stations[k]
          }));

          rawStnList.sort((a, b) => {
            const keyA = String(a.id || "").toLowerCase();
            const keyB = String(b.id || "").toLowerCase();
            const idxA = CANONICAL_STATION_ORDER.indexOf(keyA);
            const idxB = CANONICAL_STATION_ORDER.indexOf(keyB);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return keyA.localeCompare(keyB);
          });

          const sa = stations["a"]?.s_JkgK || stations["0"]?.s_JkgK || 6850.0;
          let prevS = sa;
          const markerPoints = rawStnList.map(s => {
            let rawS = s.s_JkgK ?? s.s ?? sa;
            // Enforce Second Law: expansion stations 41, 5, 8 must have s >= s4
            const sId = String(s.id).toLowerCase();
            if (sId === "5" || sId === "8" || sId === "41") {
              const s4Val = stations["4"]?.s_JkgK ?? stations["4"]?.s ?? (sa + 1000.0);
              rawS = Math.max(rawS, s4Val);
            }
            const xVal = relativeEntropy ? ((rawS - sa) / 1000.0) : rawS;
            const yVal = s.T_total_K ?? s.T_K ?? s.Tt ?? 288.15;
            return {
              x: xVal,
              y: yVal,
              id: s.id,
              label: `STN ${s.id} (${s.label || ""})`
            };
          });

          datasets.push({
            label: "THERMODYNAMIC STATIONS",
            data: markerPoints,
            pointRadius: markerPoints.map(p => (selectedStation != null && String(selectedStation) === String(p.id)) ? 9 : 5),
            pointStyle: markerPoints.map(p => (selectedStation != null && String(selectedStation) === String(p.id)) ? "rectRot" : "circle"),
            pointBackgroundColor: markerPoints.map(p => (selectedStation != null && String(selectedStation) === String(p.id)) ? "#F59E0B" : "#F2F4F8"),
            pointBorderColor: "#090A0C",
            pointBorderWidth: 1.5,
            showLine: false
          });
        }

        return { datasets };
      }, [stations, braytonLoop, isTurbofan, relativeEntropy, selectedStation]);

      useNeonChart(canvasRef, "line", chartData, {
        scales: {
          x: {
            type: "linear",
            title: {
              display: true,
              text: relativeEntropy ? "RELATIVE SPECIFIC ENTROPY Δs [kJ/(kg·K)]" : "ABSOLUTE SPECIFIC ENTROPY s [J/(kg·K)]",
              color: "#8E95A5"
            }
          },
          y: {
            type: "linear",
            title: { display: true, text: "TOTAL TEMPERATURE T_t [K]", color: "#8E95A5" }
          }
        }
      });

      return (
        <div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: "6px" }}>
            <div className="unit-toggle-pill">
              <button
                className={`unit-toggle-btn ${relativeEntropy ? "active" : ""}`}
                onClick={() => setRelativeEntropy(true)}
              >
                Δs RELATIVE
              </button>
              <button
                className={`unit-toggle-btn ${!relativeEntropy ? "active" : ""}`}
                onClick={() => setRelativeEntropy(false)}
              >
                s ABSOLUTE
              </button>
            </div>
          </div>
          <div className="chart-box" style={{ height: "350px" }}>
            <canvas ref={canvasRef} />
          </div>
        </div>
      );
    }


    // ═════════════════════════════════════════════════════════════════════════
    // DOMAIN 01: TURBOJET SINGLE-SPOOL THERMODYNAMICS
    // ═════════════════════════════════════════════════════════════════════════
    function TurbojetPanel({ onUpdateStations, selectedStation, onSelectStation }) {
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [res, setRes] = useState(null);
      const reqSeqRef = useRef(0);

      const [p, setP] = useState({
        A1: 0.40,
        A2: 0.38,
        A8: 0.28,
        CPR: 12.0,
        T_max: 1450.0,
        throttle_pos: 1.0,
        alt: 10000.0,
        M_i: 0.85,
        eta_i: 0.98,
        eta_c: 0.80,
        eta_b: 0.90,
        dp_over_p: 0.06,
        eta_t: 0.80,
        mech_loss: 0.99,
        eta_noz: 0.80,
        mdot_guess: 24.0
      });

      const setVal = (k, v) => setP(prev => ({ ...prev, [k]: v }));

      const solveCycle = useCallback(async (currentP) => {
        const reqId = ++reqSeqRef.current;
        setLoading(true);
        setError(null);
        try {
          const reqBody = {
            eng_param: {
              A1: currentP.A1,
              A2: currentP.A2,
              comp_n_stages: 8,
              turb_n_stages: 2,
              A8: currentP.A8
            },
            eng_perf: {
              eta_i: currentP.eta_i,
              CPR: currentP.CPR,
              eta_c: currentP.eta_c,
              eta_b: currentP.eta_b,
              dp_over_p: currentP.dp_over_p,
              max_f: 0.30,
              min_f: 0.05,
              V_nominal: 25.0,
              T_max: currentP.T_max,
              eta_t: currentP.eta_t,
              mech_loss: currentP.mech_loss,
              eta_noz: currentP.eta_noz
            },
            throttle_pos: Math.max(0.15, currentP.throttle_pos),
            alt: currentP.alt,
            M_i: currentP.M_i,
            mdot_guess: currentP.mdot_guess
          };

          const resp = await fetch(`${API}/api/turbojet/single`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(reqBody)
          });
          if (!resp.ok) {
            const err = await resp.json().catch(() => ({ detail: resp.statusText }));
            throw new Error(err.detail || "Turbojet solver failed");
          }
          const data = await resp.json();
          if (reqId !== reqSeqRef.current) return;
          setRes(data);
          if (onUpdateStations && data.stations) onUpdateStations(data.stations);
        } catch (e) {
          if (reqId !== reqSeqRef.current) return;
          setError(e.message || String(e));
        } finally {
          if (reqId === reqSeqRef.current) {
            setLoading(false);
          }
        }
      }, [onUpdateStations]);

      const debouncedSolve = useDebouncedCallback(solveCycle, 80);

      const isFirstMount = useRef(true);
      useEffect(() => {
        if (isFirstMount.current) {
          isFirstMount.current = false;
          solveCycle(p);
          return;
        }
        debouncedSolve(p);
      }, [p, debouncedSolve, solveCycle]);

      const fn_kN = res?.thrust_net_kN ?? res?.T ?? res?.Fn_kN ?? (res?.thrust_N ? res.thrust_N / 1000.0 : null);
      const wf_kgs = res?.mdot_fuel ?? res?.Wf_kgs ?? res?.fuel_flow_kg_s ?? null;
      const tsfc = res?.TSFC_g_kNs ?? res?.TSFC_g_kns ?? res?.tsfc_g_kns ?? res?.TSFC ?? null;
      const mdot = res?.mdot_air ?? res?.W_inlet ?? res?.mdot ?? null;
      const eta_th = res?.eta_th ?? null;

      return (
        <div className="app-workspace">
          {/* Left Controls Sidebar */}
          <aside className="app-sidebar">
            <div className="panel-card">
              <div className="panel-card-header">
                <span>[CONTROLS] TURBOJET AEROTHERMODYNAMICS</span>
                <span className={`tech-tag ${loading ? "warning" : "optimal"}`}>
                  {loading ? "SOLVING..." : "CANTERA 3.0"}
                </span>
              </div>
              <div className="panel-card-body">
                <HudSlider label="COMPRESSOR PR (CPR)" value={p.CPR} min={3.0} max={25.0} step={0.5} onChange={v => setVal("CPR", v)} />
                <HudSlider label="TIT LIMIT (T_max)" value={p.T_max} min={1100} max={1850} step={25} unit="K" onChange={v => setVal("T_max", v)} />
                <HudSlider label="THROTTLE POSITION" value={p.throttle_pos} min={0.2} max={1.0} step={0.05} onChange={v => setVal("throttle_pos", v)} />
                <HudSlider label="ALTITUDE" value={p.alt} min={0} max={60000} step={1000} unit="FT" onChange={v => setVal("alt", v)} />
                <HudSlider label="FLIGHT MACH" value={p.M_i} min={0.0} max={1.8} step={0.05} unit="M" onChange={v => setVal("M_i", v)} />
                <div style={{ height: "1px", background: "var(--border-hairline)", margin: "8px 0" }} />
                <HudSlider label="CAPTURE AREA (A1)" value={p.A1} min={0.05} max={0.60} step={0.01} unit="M²" onChange={v => setVal("A1", v)} />
                <HudSlider label="NOZZLE AREA (A8)" value={p.A8} min={0.02} max={0.40} step={0.01} unit="M²" onChange={v => setVal("A8", v)} />
              </div>
            </div>
          </aside>

          {/* Right Mainstage */}
          <main className="app-mainstage">
            {error && (
              <div className="panel-card" style={{ borderColor: "var(--accent-crimson)" }}>
                <div className="panel-card-header" style={{ color: "var(--accent-crimson)" }}>[FAULT] SOLVER ERROR</div>
                <div className="panel-card-body" style={{ color: "var(--accent-crimson)" }}>{formatErrorText(error)}</div>
              </div>
            )}

            {/* Top KPI Ribbon (All Numbers Stark Titanium White) */}
            <div className="kpi-grid">
              <HudKpi label="NET THRUST (Fn)" value={fn_kN != null ? fn_kN : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="thrust" sub="Cantera Expansion" />
              <HudKpi label="FUEL MASS FLOW" value={wf_kgs != null ? wf_kgs : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="fuelflow" decimals={4} sub="Stoich Equilibrium" />
              <HudKpi label="SPECIFIC FUEL CONS (TSFC)" value={tsfc != null ? tsfc : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="tsfc" decimals={2} sub="Metric Cycle Spec" />
              <HudKpi label="AIR MASS FLOW" value={mdot != null ? mdot : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="massflow" decimals={1} sub="Inlet Capture Face" />
              <HudKpi label="THERMAL EFFICIENCY" value={eta_th != null ? fmtPct(eta_th) : (loading ? "COMPUTING..." : "NOT COMPUTED")} sub="Brayton Recovery" />
              <HudKpi label="COMPRESSOR CPR" value={fmt(p.CPR, 1)} sub="Total-to-Total" />
            </div>

            {/* Middle Side-by-Side: 55% T-s Diagram | 45% Aerodynamics Table */}
            <div style={{ display: "grid", gridTemplateColumns: "55% calc(45% - 10px)", gap: "10px", alignItems: "start" }}>
              <div className="panel-card">
                <div className="panel-card-header">
                  <span>[THERMO-CYCLE] BRAYTON T-s DIAGRAM // CLOSED ISOBARIC LOOP</span>
                  <span className="tech-tag optimal">CANTERA INTEGRATION</span>
                </div>
                <div className="panel-card-body">
                  <BraytonTsChart
                    stations={res?.stations}
                    braytonLoop={res?.brayton_cycle || res?.brayton_loop}
                    isTurbofan={false}
                    selectedStation={selectedStation}
                    onSelectStation={onSelectStation}
                  />
                </div>
              </div>

              <div className="panel-card">
                <div className="panel-card-header">
                  <span>[AEROTHERMODYNAMICS] STATION FLOW PROPERTIES TABLE</span>
                  <span className="tech-tag info">SELECT ROW TO PROBE</span>
                </div>
                <div className="panel-card-body">
                  <StationTable
                    stations={res?.stations}
                    selectedStation={selectedStation}
                    onSelectStation={onSelectStation}
                  />
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // ═════════════════════════════════════════════════════════════════════════
    // DOMAIN 02: DUAL-SPOOL TURBOFAN AEROTHERMODYNAMICS
    // ═════════════════════════════════════════════════════════════════════════
    function PhysicsTurbofanPanel({ onUpdateStations, selectedStation, onSelectStation }) {
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [res, setRes] = useState(null);
      const reqSeqRef = useRef(0);

      const [p, setP] = useState({
        BPR: 5.0,
        FPR: 1.6,
        CPR_hpc: 18.0,
        TIT: 1600.0,
        throttle_pos: 1.0,
        alt: 10000.0,
        mach: 0.80,
        A1: 1.5,
        A2: 1.5,
        A8_core: 0.15,
        A18_bypass: 0.45,
        eta_fan: 0.89,
        eta_hpc: 0.85,
        eta_b: 0.99,
        dp_over_p: 0.04,
        eta_hpt: 0.89,
        eta_lpt: 0.91,
        eta_noz_core: 0.98,
        eta_noz_fan: 0.98
      });

      const setVal = (k, v) => setP(prev => ({ ...prev, [k]: v }));

      const solveTurbofan = useCallback(async (currentP) => {
        const reqId = ++reqSeqRef.current;
        setLoading(true);
        setError(null);
        try {
          const reqBody = {
            eng_param: {
              A1: currentP.A1,
              A2: currentP.A2,
              fan_n_stages: 1,
              hpc_n_stages: 9,
              hpt_n_stages: 1,
              lpt_n_stages: 3,
              A8: currentP.A8_core,
              BPR: currentP.BPR
            },
            eng_perf: {
              eta_i: 0.98,
              FPR: currentP.FPR,
              eta_fan: currentP.eta_fan,
              CPR: currentP.CPR_hpc,
              eta_hpc: currentP.eta_hpc,
              eta_b: currentP.eta_b,
              dp_over_p: currentP.dp_over_p,
              max_f: 0.30,
              min_f: 0.05,
              V_nominal: 30.0,
              T_max: currentP.TIT,
              eta_hpt: currentP.eta_hpt,
              eta_lpt: currentP.eta_lpt,
              mech_loss_hp: 0.99,
              mech_loss_lp: 0.99,
              eta_noz_core: currentP.eta_noz_core,
              eta_noz_byp: currentP.eta_noz_fan
            },
            throttle_pos: Math.max(0.15, currentP.throttle_pos),
            alt: currentP.alt,
            M_i: currentP.mach,
            mdot_core_guess: 20.0
          };

          const resp = await fetch(`${API}/api/physics_turbofan/single`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(reqBody)
          });
          if (!resp.ok) {
            const err = await resp.json().catch(() => ({ detail: resp.statusText }));
            throw new Error(err.detail || "Physics turbofan solver failed");
          }
          const data = await resp.json();
          if (reqId !== reqSeqRef.current) return;
          setRes(data);
          if (onUpdateStations && data.stations) onUpdateStations(data.stations);
        } catch (e) {
          if (reqId !== reqSeqRef.current) return;
          setError(e.message || String(e));
        } finally {
          if (reqId === reqSeqRef.current) {
            setLoading(false);
          }
        }
      }, [onUpdateStations]);

      const debouncedSolve = useDebouncedCallback(solveTurbofan, 80);

      const isFirstMount = useRef(true);
      useEffect(() => {
        if (isFirstMount.current) {
          isFirstMount.current = false;
          solveTurbofan(p);
          return;
        }
        debouncedSolve(p);
      }, [p, debouncedSolve, solveTurbofan]);

      const fn_kN = res?.thrust_net_kN ?? res?.T ?? null;
      const bpr = res?.BPR ?? p.BPR;
      const tsfc = res?.TSFC_g_kNs ?? res?.TSFC ?? null;
      const mdot_total = res?.mdot_air ?? (res?.mdot_core && res?.mdot_byp ? res.mdot_core + res.mdot_byp : null);
      const mdot_core = res?.mdot_core ?? null;
      const opr = (p.FPR * p.CPR_hpc).toFixed(1);

      return (
        <div className="app-workspace">
          {/* Left Controls Sidebar */}
          <aside className="app-sidebar">
            <div className="panel-card">
              <div className="panel-card-header">
                <span>[CONTROLS] DUAL-SPOOL TURBOFAN</span>
                <span className={`tech-tag ${loading ? "warning" : "optimal"}`}>
                  {loading ? "SOLVING..." : "DUAL-SPOOL CANTERA"}
                </span>
              </div>
              <div className="panel-card-body">
                <HudSlider label="BYPASS RATIO (BPR)" value={p.BPR} min={1.0} max={12.0} step={0.2} onChange={v => setVal("BPR", v)} />
                <HudSlider label="FAN PRESSURE RATIO (FPR)" value={p.FPR} min={1.2} max={2.4} step={0.05} onChange={v => setVal("FPR", v)} />
                <HudSlider label="HPC PRESSURE RATIO" value={p.CPR_hpc} min={8.0} max={30.0} step={0.5} onChange={v => setVal("CPR_hpc", v)} />
                <HudSlider label="TURBINE INLET TEMP (TIT)" value={p.TIT} min={1200} max={1900} step={25} unit="K" onChange={v => setVal("TIT", v)} />
                <HudSlider label="THROTTLE POSITION" value={p.throttle_pos} min={0.2} max={1.0} step={0.05} onChange={v => setVal("throttle_pos", v)} />
                <HudSlider label="ALTITUDE" value={p.alt} min={0} max={50000} step={1000} unit="FT" onChange={v => setVal("alt", v)} />
                <HudSlider label="FLIGHT MACH" value={p.mach} min={0.0} max={0.92} step={0.02} unit="M" onChange={v => setVal("mach", v)} />
              </div>
            </div>
          </aside>

          {/* Right Mainstage */}
          <main className="app-mainstage">
            {error && (
              <div className="panel-card" style={{ borderColor: "var(--accent-crimson)" }}>
                <div className="panel-card-header" style={{ color: "var(--accent-crimson)" }}>[FAULT] SOLVER ERROR</div>
                <div className="panel-card-body" style={{ color: "var(--accent-crimson)" }}>{formatErrorText(error)}</div>
              </div>
            )}

            {/* Top KPI Ribbon (All Numbers Stark Titanium White) */}
            <div className="kpi-grid">
              <HudKpi label="NET THRUST (Fn)" value={fn_kN != null ? fn_kN : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="thrust" sub="Core + Fan Thrust" />
              <HudKpi label="BYPASS RATIO (BPR)" value={fmt(bpr, 2)} sub="Secondary Mass Split" />
              <HudKpi label="TSFC (METRIC)" value={tsfc != null ? tsfc : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="tsfc" decimals={2} sub="Specific Fuel Cons." />
              <HudKpi label="TOTAL AIRFLOW" value={mdot_total != null ? mdot_total : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="massflow" decimals={1} sub="Fan Face Capture" />
              <HudKpi label="CORE AIRFLOW" value={mdot_core != null ? mdot_core : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="massflow" decimals={1} sub="HPC Inflow Mass" />
              <HudKpi label="OVERALL PR (OPR)" value={opr} sub="FPR × HPC PR" />
            </div>

            {/* Middle Side-by-Side: 55% T-s Diagram | 45% Aerodynamics Table */}
            <div style={{ display: "grid", gridTemplateColumns: "55% calc(45% - 10px)", gap: "10px", alignItems: "start" }}>
              <div className="panel-card">
                <div className="panel-card-header">
                  <span>[THERMO-CYCLE] DUAL-SPOOL T-s DIAGRAM // CORE & BYPASS EXPANSIONS</span>
                  <span className="tech-tag optimal">CANTERA INTEGRATION</span>
                </div>
                <div className="panel-card-body">
                  <BraytonTsChart
                    stations={res?.stations}
                    braytonLoop={res?.brayton_cycle || res?.brayton_loop}
                    isTurbofan={true}
                    selectedStation={selectedStation}
                    onSelectStation={onSelectStation}
                  />
                </div>
              </div>

              <div className="panel-card">
                <div className="panel-card-header">
                  <span>[AEROTHERMODYNAMICS] DUAL-SPOOL STATION PROPERTIES</span>
                  <span className="tech-tag info">SELECT ROW TO PROBE</span>
                </div>
                <div className="panel-card-body">
                  <StationTable
                    stations={res?.stations}
                    selectedStation={selectedStation}
                    onSelectStation={onSelectStation}
                  />
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // ═════════════════════════════════════════════════════════════════════════
    // DOMAIN 03: CF34 EMPIRICAL FLIGHT DECK (TRILINEAR INTERPOLATION)
    // ═════════════════════════════════════════════════════════════════════════
    function TurbofanPanel({ onUpdateStations, selectedStation, onSelectStation }) {
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [res, setRes] = useState(null);
      const [altPts, setAltPts] = useState([]);
      const [machPts, setMachPts] = useState([]);
      const reqSeqRef = useRef(0);

      const [p, setP] = useState({
        alt: 35000.0,
        MN: 0.80,
        PC: 1.00
      });

      const setVal = (k, v) => setP(prev => ({ ...prev, [k]: v }));

      const solveDeck = useCallback(async (currentP) => {
        const reqId = ++reqSeqRef.current;
        setLoading(true);
        setError(null);
        try {
          // Direct call to /api/turbofan/single (or alias /api/cf34/single)
          const resp = await fetch(`${API}/api/turbofan/single`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(currentP)
          });
          if (!resp.ok) {
            const err = await resp.json().catch(() => ({ detail: resp.statusText }));
            throw new Error(err.detail || "CF34 deck interpolation failed");
          }
          const data = await resp.json();
          if (reqId !== reqSeqRef.current) return;
          setRes(data);
          if (onUpdateStations && data.stations) onUpdateStations(data.stations);

          // Fetch altitude and Mach sweeps
          const [aRes, mRes] = await Promise.all([
            fetch(`${API}/api/cf34/sweep_altitude?MN=${currentP.MN}&PC=${currentP.PC}&n_points=25`),
            fetch(`${API}/api/cf34/sweep_mach?alt=${currentP.alt}&PC=${currentP.PC}&n_points=25`)
          ]);
          if (reqId !== reqSeqRef.current) return;
          if (aRes.ok) setAltPts((await aRes.json()).points || []);
          if (mRes.ok) setMachPts((await mRes.json()).points || []);
        } catch (e) {
          if (reqId !== reqSeqRef.current) return;
          setError(e.message || String(e));
        } finally {
          if (reqId === reqSeqRef.current) {
            setLoading(false);
          }
        }
      }, [onUpdateStations]);

      const debouncedSolve = useDebouncedCallback(solveDeck, 80);

      const isFirstMount = useRef(true);
      useEffect(() => {
        if (isFirstMount.current) {
          isFirstMount.current = false;
          solveDeck(p);
          return;
        }
        debouncedSolve(p);
      }, [p, debouncedSolve, solveDeck]);

      const fn_kN = res?.Fn_kN ?? null;
      const wf_kgh = res ? (res.Wf_kgh ?? (res.Wf_kgs ? res.Wf_kgs * 3600 : null)) : null;
      const tsfc = (fn_kN && wf_kgh) ? ((wf_kgh / 3.6) / fn_kN) : (res?.TSFC ?? null);
      const wc_kgs = res?.Wc_kgs ?? null;

      const altRef = useRef(null);
      const machRef = useRef(null);

      const altDatasets = useMemo(() => {
        const ds = [{
          label: "THRUST LAPSE VS ALTITUDE",
          data: altPts.map(pt => ({ x: pt.alt, y: pt.Fn_kN })),
          borderColor: "#38BDF8",
          backgroundColor: "rgba(56, 189, 248, 0.08)",
          fill: true,
          tension: 0.25,
          pointRadius: 0,
          showLine: true
        }];
        if (res && res.Fn_kN != null) {
          ds.push({
            label: `OPERATING POINT (${fmtInt(p.alt)} FT, ${fmt(res.Fn_kN, 2)} kN)`,
            data: [{ x: p.alt, y: res.Fn_kN }],
            pointRadius: 8,
            pointStyle: "rectRot",
            pointBackgroundColor: "#F59E0B",
            borderColor: "#FFFFFF",
            borderWidth: 2,
            showLine: false
          });
        }
        return { datasets: ds };
      }, [altPts, res, p.alt]);

      const machDatasets = useMemo(() => {
        const ds = [{
          label: "THRUST VS FLIGHT MACH",
          data: machPts.map(pt => ({ x: pt.MN, y: pt.Fn_kN })),
          borderColor: "#F59E0B",
          backgroundColor: "rgba(245, 158, 11, 0.08)",
          fill: true,
          tension: 0.25,
          pointRadius: 0,
          showLine: true
        }];
        if (res && res.Fn_kN != null) {
          ds.push({
            label: `OPERATING POINT (M ${fmt(p.MN, 2)}, ${fmt(res.Fn_kN, 2)} kN)`,
            data: [{ x: p.MN, y: res.Fn_kN }],
            pointRadius: 8,
            pointStyle: "rectRot",
            pointBackgroundColor: "#F59E0B",
            borderColor: "#FFFFFF",
            borderWidth: 2,
            showLine: false
          });
        }
        return { datasets: ds };
      }, [machPts, res, p.MN]);

      useNeonChart(altRef, "line", altDatasets, {
        scales: {
          x: { type: "linear", title: { display: true, text: "ALTITUDE [FT]", color: "#8E95A5" } },
          y: { type: "linear", title: { display: true, text: "NET THRUST [kN]", color: "#8E95A5" } }
        }
      });

      useNeonChart(machRef, "line", machDatasets, {
        scales: {
          x: { type: "linear", title: { display: true, text: "FLIGHT MACH", color: "#8E95A5" } },
          y: { type: "linear", title: { display: true, text: "NET THRUST [kN]", color: "#8E95A5" } }
        }
      });

      return (
        <div className="app-workspace">
          {/* Left Controls Sidebar */}
          <aside className="app-sidebar">
            <div className="panel-card">
              <div className="panel-card-header">
                <span>[INPUT] CF34 EMPIRICAL FLIGHT DECK</span>
                <span className={`tech-tag ${loading ? "warning" : "optimal"}`}>
                  {loading ? "INTERPOLATING..." : "TRILINEAR INTERP"}
                </span>
              </div>
              <div className="panel-card-body">
                <HudSlider label="ALTITUDE" value={p.alt} min={0} max={45000} step={1000} unit="FT" onChange={v => setVal("alt", v)} />
                <HudSlider label="FLIGHT MACH NUMBER" value={p.MN} min={0.0} max={0.88} step={0.02} unit="M" onChange={v => setVal("MN", v)} />
                <HudSlider label="POWER CODE (PC)" value={p.PC} min={0.2} max={1.0} step={0.05} onChange={v => setVal("PC", v)} />
              </div>
            </div>
          </aside>

          {/* Right Mainstage */}
          <main className="app-mainstage">
            {error && (
              <div className="panel-card" style={{ borderColor: "var(--accent-crimson)" }}>
                <div className="panel-card-header" style={{ color: "var(--accent-crimson)" }}>[FAULT] DECK INTERPOLATION ERROR</div>
                <div className="panel-card-body" style={{ color: "var(--accent-crimson)" }}>{formatErrorText(error)}</div>
              </div>
            )}

            {/* Top 4 KPI Cards (Stark Titanium White) */}
            <div className="kpi-grid">
              <HudKpi label="NET THRUST (Fn)" value={fn_kN != null ? fn_kN : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="thrust" sub="CF34-10E (UNVALIDATED EMPIRICAL FIT)" />
              <HudKpi label="FUEL FLOW (Wf)" value={wf_kgh != null ? wf_kgh : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="fuelflow_kgh" decimals={1} sub="Empirical Rate" />
              <HudKpi label="TSFC (SPECIFIC FUEL CONS)" value={tsfc != null ? tsfc : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="tsfc" decimals={2} sub="g/(kN·s)" />
              <HudKpi label="CORRECTED AIRFLOW (Wc)" value={wc_kgs != null ? wc_kgs : (loading ? "COMPUTING..." : "NOT COMPUTED")} unitType="massflow" decimals={1} sub="Fan Face" />
            </div>

            {/* Middle: 2 Sweep Charts */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
              <div className="panel-card">
                <div className="panel-card-header">
                  <span>[SWEEP] NET THRUST [kN] VS ALTITUDE [FT]</span>
                  <span className="tech-tag optimal">LAPSE CURVE</span>
                </div>
                <div className="panel-card-body">
                  <div className="chart-box" style={{ height: "260px" }}><canvas ref={altRef} /></div>
                </div>
              </div>

              <div className="panel-card">
                <div className="panel-card-header">
                  <span>[SWEEP] NET THRUST [kN] VS FLIGHT MACH</span>
                  <span className="tech-tag optimal">RAM RECOVERY</span>
                </div>
                <div className="panel-card-body">
                  <div className="chart-box" style={{ height: "260px" }}><canvas ref={machRef} /></div>
                </div>
              </div>
            </div>

            {/* Restored Bottom Panel: Operational Status & Certification Limits */}
            <div className="panel-card">
              <div className="panel-card-header">
                <span>[ENVELOPE] CF34 OPERATIONAL STATUS & CERTIFICATION LIMITS</span>
                <span className="tech-tag" style={{borderColor: '#F59E0B', color: '#F59E0B'}}>CF34-10E // UNVALIDATED EMPIRICAL FIT</span>
              </div>
              <div className="panel-card-body">
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "16px", color: "var(--text-silver)" }}>
                  <div>
                    <div style={{ fontSize: "10px", fontWeight: 700, color: "var(--accent-amber)", marginBottom: "4px" }}>OPERATING CONDITIONS</div>
                    <div>GEOPOTENTIAL ALTITUDE: <strong style={{ color: "#ffffff" }}>{fmtInt(p.alt)} FT</strong></div>
                    <div>FLIGHT MACH NUMBER: <strong style={{ color: "#ffffff" }}>{fmt(p.MN, 2)}</strong></div>
                    <div>THROTTLE RATING (PC): <strong style={{ color: "#ffffff" }}>{fmt(p.PC, 2)} ({Math.round(p.PC * 100)}%)</strong></div>
                  </div>
                  <div>
                    <div style={{ fontSize: "10px", fontWeight: 700, color: "var(--accent-emerald)", marginBottom: "4px" }}>SAFETY MARGINS & BOUNDARIES</div>
                    <div>MAX OPERATING ALT: <strong style={{ color: "#ffffff" }}>41,000 FT</strong></div>
                    <div>MAX OPERATING MACH (M_MO): <strong style={{ color: "#ffffff" }}>0.85 M</strong></div>
                    <div>TRILINEAR BOUNDARY: <span className="tech-tag optimal">INTERIOR GRID MATCH</span></div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // ═════════════════════════════════════════════════════════════════════════
    // DOMAIN 04: OFF-DESIGN COMPONENT MATCHING & MAPS
    // ═════════════════════════════════════════════════════════════════════════
    function OffDesignPanel() {
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [result, setResult] = useState(null);
      const [mapData, setMapData] = useState(null);
      const reqSeqRef = useRef(0);

      const [p, setP] = useState({
        N_rel: 1.0,
        alt: 35000.0,
        mach: 0.80,
        throttle_pos: 1.0,
        cpr_des: 8.0,
        eta_c_des: 0.85,
        mdot_corr_des: 20.0,
        eta_i: 0.98,
        eta_t: 0.88,
        mech_loss: 0.99,
        eta_b: 0.99,
        dp_over_p: 0.04,
        T_max: 1550.0,
        eta_noz: 0.98
      });

      const setVal = (k, v) => setP(prev => ({ ...prev, [k]: v }));

      const solveOffDesign = useCallback(async (currentP) => {
        const reqId = ++reqSeqRef.current;
        setLoading(true);
        setError(null);
        try {
          const [mapRes, singleRes] = await Promise.all([
            fetch(`${API}/api/off_design/map?cpr_des=${currentP.cpr_des}&eta_c_des=${currentP.eta_c_des}&mdot_corr_des=${currentP.mdot_corr_des}`),
            fetch(`${API}/api/off_design/single`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(currentP)
            })
          ]);

          if (reqId !== reqSeqRef.current) return;
          if (mapRes.ok) setMapData(await mapRes.json());
          if (!singleRes.ok) {
            const err = await singleRes.json().catch(() => ({ detail: singleRes.statusText }));
            throw new Error(err.detail || "Off-design component matching failed");
          }
          setResult(await singleRes.json());
        } catch (e) {
          if (reqId !== reqSeqRef.current) return;
          setError(e.message || String(e));
        } finally {
          if (reqId === reqSeqRef.current) {
            setLoading(false);
          }
        }
      }, []);

      const debouncedSolve = useDebouncedCallback(solveOffDesign, 80);

      const isFirstMount = useRef(true);
      useEffect(() => {
        if (isFirstMount.current) {
          isFirstMount.current = false;
          solveOffDesign(p);
          return;
        }
        debouncedSolve(p);
      }, [p, debouncedSolve, solveOffDesign]);

      const sm = result?.Surge_Margin_pct ?? result?.surge_margin_pct ?? null;
      const opCPR = result?.CPR ?? result?.cpr ?? null;
      const opMdot = result?.mdot_corr ?? null;
      const opEta = result?.eta_c ?? null;
      const opTIT = result?.TIT ?? result?.T04 ?? result?.TIT_K ?? null;
      const opThrust = result?.Thrust_kN ?? (result?.thrust_N ? result.thrust_N / 1000 : result?.Fn_kN ?? null);
      const opA8 = result?.A8_target ?? result?.A8 ?? null;

      const mapCanvasRef = useRef(null);

      // High-contrast progressive titanium palette for speed lines
      const speedColors = ["#475569", "#64748B", "#94A3B8", "#CBD5E1", "#E2E8F0", "#F8FAFC", "#F59E0B", "#FCD34D"];

      const mapDatasets = useMemo(() => {
        const ds = [];
        if (mapData?.speed_lines) {
          mapData.speed_lines.forEach((sl, idx) => {
            const isNom = Math.abs((sl.N_pct || sl.N_rel * 100) - 100) < 1;
            const lineColor = isNom ? "#F59E0B" : (speedColors[idx % speedColors.length] || "#94A3B8");
            ds.push({
              label: `N = ${sl.N_pct || Math.round(sl.N_rel * 100)}%`,
              data: [...sl.points].sort((a, b) => a.mdot_corr - b.mdot_corr).map(pt => ({
                x: pt.mdot_corr,
                y: pt.cpr != null ? pt.cpr : (pt.PR != null ? pt.PR : pt.y)
              })),
              borderColor: lineColor,
              borderWidth: isNom ? 2.5 : 1.2,
              tension: 0.25,
              pointRadius: 0,
              showLine: true
            });
          });
        }

        if (mapData?.surge_line) {
          ds.push({
            label: "SURGE BOUNDARY (STABILITY LIMIT)",
            data: mapData.surge_line.map(pt => ({
              x: pt.mdot_corr,
              y: pt.cpr != null ? pt.cpr : (pt.PR != null ? pt.PR : pt.y)
            })),
            borderColor: "#EF4444",
            borderDash: [6, 4],
            borderWidth: 2,
            pointRadius: 2,
            pointBackgroundColor: "#EF4444",
            showLine: true
          });
        }

        // Design Point Marker
        ds.push({
          label: `DESIGN POINT (CPR: ${fmt(p.cpr_des, 1)}, ṁ: ${fmt(p.mdot_corr_des, 1)} kg/s)`,
          data: [{ x: p.mdot_corr_des, y: p.cpr_des }],
          pointRadius: 8,
          pointStyle: "rectRot",
          pointBackgroundColor: "#F2F4F8",
          borderColor: "#090B0E",
          borderWidth: 2,
          showLine: false
        });

        // Current Operating Point Marker
        if (result) {
          ds.push({
            label: `OPERATING POINT (CPR: ${fmt(opCPR, 2)}, ṁ: ${fmt(opMdot, 1)} kg/s)`,
            data: [{ x: opMdot, y: opCPR }],
            pointRadius: 9,
            pointStyle: "rectRot",
