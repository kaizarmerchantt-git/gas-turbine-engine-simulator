                <HudSlider label="DESIGN ṁ_corr (BENCHMARK)" value={p.mdot_corr_des} min={5.0} max={50.0} step={1.0} unit="KG/S" onChange={v => setVal("mdot_corr_des", v)} />
                <div style={{ marginTop: "12px" }}>
                  <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runSingle} disabled={loading}>
                    {loading ? "SOLVING MATCH POINT..." : "MATCH COMPONENT OPERATING POINT"}
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Telemetry Stage */}
          <div className="hud-mainstage">
            {error && (
              <div className="hud-card" style={{ borderColor: "var(--hud-red)" }}>
                <div className="hud-card-hd" style={{ color: "var(--hud-red)" }}>[SYSTEM FAULT] MATCHING SOLVER ERROR</div>
                <div className="hud-card-bd" style={{ color: "var(--hud-red)" }}>{error}</div>
              </div>
            )}

            {/* KPI Ribbon */}
            <div className="hud-kpi-grid">
              <HudKpi label="NET THRUST (Fn)" value={result ? fmt(opThrust, 2) : "---"} unit="kN" color="neon" sub="Matched Exhaust" />
              <HudKpi label="OPERATING CPR" value={result ? fmt(result.CPR, 2) : "---"} color="neon" sub={`Target: ${fmt(p.cpr_des, 1)}`} />
              <HudKpi label="CORRECTED FLOW (ṁ_corr)" value={result ? fmt(result.mdot_corr, 2) : "---"} unit="kg/s" color="gold" sub={`Design: ${fmt(p.mdot_corr_des, 1)}`} />
              <HudKpi label="COMPRESSOR EFF (η_c)" value={result ? fmt(result.eta_c, 3) : "---"} color="green" sub={`Design: ${fmt(p.eta_c_des, 3)}`} />
              <HudKpi label="SURGE MARGIN (%SM)" value={result ? fmt(sm, 1) : "---"} unit="%" color={smColor} sub={sm >= 15.0 ? "STABLE" : "SURGE RISK"} />
            </div>

            {/* Compressor Map Chart (Full speed lines, surge line, neon blue design point reference diamond, operating point circle) */}
            <div className="hud-card">
              <div className="hud-card-hd">
                <span>[COMPRESSOR-MAP] SPEED LINES (60%-105%), SURGE BOUNDARY & DESIGN POINT REFERENCE</span>
                <span className="tag">BETA-LINE PARAMETERIZATION</span>
              </div>
              <CompressorMapChart
                mapData={mapData}
                operatingPoint={result}
                cpr_des={p.cpr_des}
                mdot_corr_des={p.mdot_corr_des}
              />
            </div>

            {/* Design Point vs Off-Design Operating Point Variance Matrix Table */}
            <OffDesignComparisonTable
              operatingPoint={result}
              cpr_des={p.cpr_des}
              mdot_corr_des={p.mdot_corr_des}
              eta_c_des={p.eta_c_des}
            />
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MODULE 05: 1D MEAN-LINE STAGE AERODYNAMICS
       ════════════════════════════════════════════════════════════════════════ */
    function MeanLinePanel() {
      const [mode, setMode] = useState("compressor"); // "compressor", "multistage", "turbine"
      const [selectedStage, setSelectedStage] = useState(0);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [result, setResult] = useState(null);

      const [compParams, setCompParams] = useState({
        U: 350.0,
        C_a1: 180.0,
        C_a2: 175.0,
        alpha_1_deg: 0.0,
        beta_2_deg: 45.0,
        alpha_3_deg: 0.0,
        r_mean: 0.35,
        T01: 288.15,
        P01: 101325.0,
        mdot: 35.0,
        eta_stage: 0.89
      });

      const [multiParams, setMultiParams] = useState({
        n_stages: 6,
        CPR: 8.0,
        T0_inlet: 288.15,
        P0_inlet: 101325.0,
        N_rpm: 12000.0,
        r_mean: 0.28,
        C_a: 160.0,
        reaction: 0.50,
        eta_poly: 0.88,
        mdot: 20.0
      });

      const [turbParams, setTurbParams] = useState({
        U: 380.0,
        C_a: 200.0,
        alpha_1_deg: 0.0,
        alpha_2_deg: 65.0,
        beta_3_deg: -60.0,
        r_mean: 0.30,
        T01: 1450.0,
        P01: 1200000.0,
        mdot: 25.0,
        eta_stage: 0.91
      });

      const setComp = (k, v) => setCompParams(prev => ({ ...prev, [k]: v }));
      const setMulti = (k, v) => setMultiParams(prev => ({ ...prev, [k]: v }));
      const setTurb = (k, v) => setTurbParams(prev => ({ ...prev, [k]: v }));

      const solve = async () => {
        setLoading(true);
        setError(null);
        try {
          let endpoint = "/api/meanline/compressor_stage";
          let body = compParams;

          if (mode === "multistage") {
            endpoint = "/api/meanline/multistage_compressor";
            body = multiParams;
          } else if (mode === "turbine") {
            endpoint = "/api/meanline/turbine_stage";
            body = turbParams;
          }

          const resp = await fetch(`${API}${endpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Aero stage solver failed");
          }
          const data = await resp.json();
          setResult(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      // LIVE REACTIVE SOLVE: Runs on mode change and slider change
      useEffect(() => {
        solve();
      }, [
        mode,
        compParams.U, compParams.C_a1, compParams.C_a2, compParams.alpha_1_deg, compParams.beta_2_deg, compParams.r_mean,
        multiParams.n_stages, multiParams.CPR, multiParams.N_rpm, multiParams.C_a, multiParams.reaction,
        turbParams.U, turbParams.C_a, turbParams.alpha_2_deg, turbParams.beta_3_deg
      ]);

      // Extract active velocity triangles safely
      let inletTri = null;
      let exitTri = null;
      let stageCount = 1;

      if (mode === "compressor" && result) {
        inletTri = result.rotor_inlet_triangle;
        exitTri = result.rotor_exit_triangle;
      } else if (mode === "multistage" && result?.stages?.length) {
        stageCount = result.stages.length;
        const stg = result.stages[Math.min(selectedStage, stageCount - 1)] || result.stages[0];
        inletTri = stg.rotor_inlet_triangle;
        exitTri = stg.rotor_exit_triangle;
      } else if (mode === "turbine" && result) {
        inletTri = result.stator_exit_triangle;
        exitTri = result.rotor_exit_triangle;
      }

      return (
        <div className="hud-panel-grid">
          {/* Controls Sidebar */}
          <div className="hud-sidebar">
            <div className="hud-card">
              <div className="hud-card-hd">
                <span>[MODE] TURBOMACHINERY DOMAIN</span>
                <span className="tag">1D MEAN-LINE</span>
              </div>
              <div className="hud-card-bd">
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "6px", marginBottom: "12px" }}>
                  <button className={`hud-btn ${mode === "compressor" ? "hud-btn-primary" : ""}`} onClick={() => setMode("compressor")}>
                    COMP STG
                  </button>
                  <button className={`hud-btn ${mode === "multistage" ? "hud-btn-primary" : ""}`} onClick={() => setMode("multistage")}>
                    ANNULUS
                  </button>
                  <button className={`hud-btn ${mode === "turbine" ? "hud-btn-primary" : ""}`} onClick={() => setMode("turbine")}>
                    TURB STG
                  </button>
                </div>

                {mode === "compressor" && (
                  <div>
                    <HudSlider label="BLADE SPEED (U)" value={compParams.U} min={200} max={500} step={10} unit="M/S" onChange={v => setComp("U", v)} />
                    <HudSlider label="AXIAL INLET VEL (Ca1)" value={compParams.C_a1} min={100} max={250} step={5} unit="M/S" onChange={v => setComp("C_a1", v)} />
                    <HudSlider label="AXIAL EXIT VEL (Ca2)" value={compParams.C_a2} min={100} max={250} step={5} unit="M/S" onChange={v => setComp("C_a2", v)} />
                    <HudSlider label="INLET FLOW ANGLE (α1)" value={compParams.alpha_1_deg} min={-20} max={40} step={2} unit="DEG" onChange={v => setComp("alpha_1_deg", v)} />
                    <HudSlider label="ROTOR EXIT REL ANGLE (β2)" value={compParams.beta_2_deg} min={20} max={65} step={1} unit="DEG" onChange={v => setComp("beta_2_deg", v)} />
                    <HudSlider label="MEAN RADIUS (r_mean)" value={compParams.r_mean} min={0.15} max={0.80} step={0.02} unit="M" onChange={v => setComp("r_mean", v)} />
                  </div>
                )}

                {mode === "multistage" && (
                  <div>
                    <HudSlider label="NUMBER OF STAGES" value={multiParams.n_stages} min={2} max={14} step={1} onChange={v => setMulti("n_stages", v)} />
                    <HudSlider label="TOTAL PRESSURE RATIO" value={multiParams.CPR} min={3.0} max={30.0} step={0.5} onChange={v => setMulti("CPR", v)} />
                    <HudSlider label="ROTOR SHAFT SPEED" value={multiParams.N_rpm} min={5000} max={25000} step={500} unit="RPM" onChange={v => setMulti("N_rpm", v)} />
                    <HudSlider label="CONSTANT AXIAL VEL (Ca)" value={multiParams.C_a} min={120} max={220} step={5} unit="M/S" onChange={v => setMulti("C_a", v)} />
                    <HudSlider label="STAGE DEGREE OF REACTION" value={multiParams.reaction} min={0.30} max={0.70} step={0.05} onChange={v => setMulti("reaction", v)} />
                  </div>
                )}

                {mode === "turbine" && (
                  <div>
                    <HudSlider label="BLADE SPEED (U)" value={turbParams.U} min={250} max={550} step={10} unit="M/S" onChange={v => setTurb("U", v)} />
                    <HudSlider label="AXIAL VELOCITY (Ca)" value={turbParams.C_a} min={120} max={280} step={5} unit="M/S" onChange={v => setTurb("C_a", v)} />
                    <HudSlider label="STATOR EXIT SWIRL (α2)" value={turbParams.alpha_2_deg} min={45} max={75} step={1} unit="DEG" onChange={v => setTurb("alpha_2_deg", v)} />
                    <HudSlider label="ROTOR EXIT REL ANGLE (β3)" value={turbParams.beta_3_deg} min={-75} max={-40} step={1} unit="DEG" onChange={v => setTurb("beta_3_deg", v)} />
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Telemetry Stage */}
          <div className="hud-mainstage">
            {error && (
              <div className="hud-card" style={{ borderColor: "var(--hud-red)" }}>
                <div className="hud-card-hd" style={{ color: "var(--hud-red)" }}>[SYSTEM FAULT] AERO SOLVER ERROR</div>
                <div className="hud-card-bd" style={{ color: "var(--hud-red)" }}>{error}</div>
              </div>
            )}

            {/* KPI Ribbon */}
            <div className="hud-kpi-grid">
              <HudKpi label="STAGE LOADING (ψ)" value={result ? fmt(result.loading_coefficient_psi ?? result.psi, 3) : "---"} color="neon" sub="Δh₀ / U²" />
              <HudKpi label="FLOW COEFFICIENT (ϕ)" value={result ? fmt(result.flow_coefficient_phi ?? result.phi, 3) : "---"} color="neon" sub="Ca / U" />
              <HudKpi label="DEGREE OF REACTION (R)" value={result ? fmt(result.degree_of_reaction_R ?? result.reaction, 3) : "---"} color="green" sub="Rotor Enthalpy Rise" />
              {mode === "turbine" ? (
                <HudKpi label="ZWEIFEL COEFF (ψ_z)" value={result ? fmt(result.zweifel_coefficient ?? result.zweifel_coefficient_stator, 2) : "---"} color="gold" sub="Aerodynamic Loading" />
              ) : (
                <HudKpi label="DE HALLER RATIO" value={result ? fmt(result.de_haller_ratio || (inletTri && exitTri ? exitTri.W / inletTri.W : 0.76), 3) : "---"} color="green" sub="W₂ / W₁ ≥ 0.72" />
              )}
              <HudKpi label="STAGE PR" value={result ? fmt(result.stage_PR ?? result.PR_stage, 3) : "---"} color="neon" sub="Isentropic Work" />
              <HudKpi label="STAGE WORK (Δh₀)" value={result ? fmt(result.delta_h0_kJkg ?? (result.delta_h0 ? result.delta_h0 / 1000 : 0), 1) : "---"} unit="kJ/kg" color="gold" sub="Euler Equation" />
            </div>

            {/* Dynamic Velocity Triangles SVG */}
            <VelocityTrianglesSvg
              inlet={inletTri}
              exit={exitTri}
              type={mode === "turbine" ? "turbine" : "compressor"}
            />

            {/* Multi-Stage Annulus Flow Path Profile (when in multistage mode) */}
            {mode === "multistage" && result?.stages && (
              <div>
                <AnnulusSvg stages={result.stages} />
                <div className="hud-card" style={{ marginTop: "12px" }}>
                  <div className="hud-card-hd">
                    <span>[STAGES] SELECT STAGE FOR VELOCITY TRIANGLE INSPECTION</span>
                    <span className="tag">STAGE {selectedStage + 1} OF {stageCount}</span>
                  </div>
                  <div className="hud-card-bd">
                    <div style={{ display: "flex", gap: "6px", overflowX: "auto", paddingBottom: "4px" }}>
                      {result.stages.map((stg, i) => (
                        <button
                          key={i}
                          className={`hud-btn ${selectedStage === i ? "hud-btn-primary" : ""}`}
                          onClick={() => setSelectedStage(i)}
                        >
                          STAGE {i + 1} (PR: {fmt(stg.stage_PR || stg.PR_stage, 2)})
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MODULE 06: TURBOPROP & TURBOSHAFT POWERTRAIN
       ════════════════════════════════════════════════════════════════════════ */
    function TurbopropPanel() {
      const [mode, setMode] = useState("single");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const [p, setP] = useState({
        alt: 15000.0,
        mach: 0.40,
        CPR: 12.0,
        TIT: 1400.0,
        mdot_air: 10.0,
        A8: 0.08,
        prop_diameter_m: 3.2,
        prop_rpm: 1200.0,
        eta_i: 0.98,
        eta_c: 0.85,
        eta_b: 0.99,
        dp_over_p: 0.04,
        eta_hpt: 0.89,
        eta_pt: 0.90,
        eta_gearbox: 0.985,
        eta_mech_core: 0.99,
        eta_mech_pt: 0.98,
        eta_noz: 0.95,
        prop_eff_max: 0.84
      });

      const [sw, setSw] = useState({
        sweep_param: "power",
        n_steps: 8,
        alt_fixed: 15000.0,
        mach_fixed: 0.40,
        cpr_fixed: 12.0,
        tit_fixed: 1400.0
      });

      const [res, setRes] = useState(null);
      const [sweepRes, setSweepRes] = useState(null);

      const setParam = (k, v) => setP(prev => ({ ...prev, [k]: v }));
      const setSweepParam = (k, v) => setSw(prev => ({ ...prev, [k]: v }));

      const runSingle = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/turboprop/single`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(p)
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Turboprop calculation failed");
          }
          const data = await resp.json();
          setRes(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      const runSweep = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/turboprop/sweep`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(sw)
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Turboprop sweep failed");
          }
          const data = await resp.json();
          setSweepRes(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        runSingle();
      }, []);

      return (
        <div className="hud-panel-grid">
          {/* Controls Sidebar */}
          <div className="hud-sidebar">
            <div className="hud-card">
              <div className="hud-card-hd">
                <span>[MODE] SIMULATION DISCIPLINE</span>
                <span className="tag">FREE TURBINE</span>
              </div>
              <div className="hud-card-bd">
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginBottom: "12px" }}>
                  <button className={`hud-btn ${mode === "single" ? "hud-btn-primary" : ""}`} onClick={() => setMode("single")}>
                    DESIGN POINT
                  </button>
                  <button className={`hud-btn ${mode === "sweep" ? "hud-btn-primary" : ""}`} onClick={() => setMode("sweep")}>
                    PARAMETRIC
                  </button>
                </div>

                {mode === "single" ? (
                  <div>
                    <HudSlider label="ALTITUDE" value={p.alt} min={0} max={30000} step={1000} unit="FT" onChange={v => setParam("alt", v)} />
                    <HudSlider label="FLIGHT MACH" value={p.mach} min={0.10} max={0.65} step={0.05} unit="M" onChange={v => setParam("mach", v)} />
                    <HudSlider label="PRESSURE RATIO (CPR)" value={p.CPR} min={4.0} max={24.0} step={1.0} onChange={v => setParam("CPR", v)} />
                    <HudSlider label="TURBINE INLET TEMP (TIT)" value={p.TIT} min={1000} max={1700} step={25} unit="K" onChange={v => setParam("TIT", v)} />
                    <HudSlider label="CORE AIR FLOW" value={p.mdot_air} min={2.0} max={30.0} step={1.0} unit="KG/S" onChange={v => setParam("mdot_air", v)} />
                    <HudSlider label="PROPELLER DIAMETER" value={p.prop_diameter_m} min={1.5} max={5.0} step={0.1} unit="M" onChange={v => setParam("prop_diameter_m", v)} />
                    <HudSlider label="PROPELLER RPM" value={p.prop_rpm} min={800} max={2400} step={50} unit="RPM" onChange={v => setParam("prop_rpm", v)} />
                    <div style={{ marginTop: "12px" }}>
                      <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runSingle} disabled={loading}>
                        {loading ? "COMPUTING SHAFT POWER..." : "EVALUATE TURBOPROP"}
                      </button>
                    </div>
                  </div>
                ) : (
                  <div>
                    <div style={{ marginBottom: "10px" }}>
                      <div className="hud-slider-label" style={{ marginBottom: "4px" }}>SWEEP VARIABLE</div>
                      <select className="hud-module-select" value={sw.sweep_param} onChange={e => setSweepParam("sweep_param", e.target.value)}>
                        <option value="power">SHAFT POWER / TIT SWEEP</option>
                        <option value="mach">FLIGHT MACH NUMBER SWEEP</option>
                        <option value="altitude">ALTITUDE PROFILE SWEEP</option>
                        <option value="cpr">PRESSURE RATIO SWEEP</option>
                      </select>
                    </div>
                    <HudSlider label="STEPS" value={sw.n_steps} min={5} max={15} step={1} onChange={v => setSweepParam("n_steps", v)} />
                    <div style={{ marginTop: "12px" }}>
                      <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runSweep} disabled={loading}>
                        {loading ? "SWEEPING PARAMETERS..." : "RUN PARAMETRIC SWEEP"}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Telemetry Stage */}
          <div className="hud-mainstage">
            {error && (
              <div className="hud-card" style={{ borderColor: "var(--hud-red)" }}>
                <div className="hud-card-hd" style={{ color: "var(--hud-red)" }}>[SYSTEM FAULT] TURBOPROP ERROR</div>
                <div className="hud-card-bd" style={{ color: "var(--hud-red)" }}>{error}</div>
              </div>
            )}

            {/* KPI Ribbon */}
            <div className="hud-kpi-grid">
              <HudKpi label="SHAFT POWER" value={res ? fmt(res.P_shaft_shp || res.SHP, 0) : "---"} unit="shp" color="neon" sub={`${res ? fmt(res.P_shaft_kW, 0) : "---"} kW`} />
              <HudKpi label="EQUIV SHAFT PWR" value={res ? fmt(res.ESHP, 0) : "---"} unit="eshp" color="neon" sub="Shaft + Jet Residual" />
              <HudKpi label="TOTAL THRUST" value={res ? fmt(res.F_total_kN, 2) : "---"} unit="kN" color="gold" sub={`Prop: ${res ? fmt(res.F_prop_kN, 1) : "---"} kN`} />
              <HudKpi label="PROP EFFICIENCY" value={res ? fmtPct(res.eta_prop || res.propeller_efficiency) : "---"} color="green" sub="Hamilton Standard" />
              <HudKpi label="PSFC" value={res ? fmt(res.PSFC_kg_kWh, 3) : "---"} unit="kg/kW·h" color="gold" sub={`${res ? fmt(res.PSFC_lbm_shph, 3) : "---"} lbm/shp·h`} />
              <HudKpi label="GEARBOX TORQUE" value={res ? fmtInt(res.torque_Nm) : "---"} unit="N·m" color="green" sub="Planetary Reduction" />
            </div>

            {mode === "single" ? (
              <div className="hud-card">
                <div className="hud-card-hd">
                  <span>[GAS-PATH] TURBOPROP THERMODYNAMIC STATIONS (FREE POWER TURBINE)</span>
                  <span className="tag">PT SPLIT RATIO</span>
                </div>
                <StationTable stations={res?.stations} />
              </div>
            ) : (
              <div className="hud-card">
                <div className="hud-card-hd">
                  <span>[SWEEP] TURBOPROP MULTI-PARAMETRIC AERODYNAMIC TRADEOFFS</span>
                  <span className="tag">{sw.sweep_param.toUpperCase()} SWEEP</span>
                </div>
                <TurbopropSweepCharts sweepData={sweepRes} points={sweepRes?.points} param={sw.sweep_param} />
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MODULE 07: 6-PHASE FLIGHT MISSION SIMULATION
       ════════════════════════════════════════════════════════════════════════ */
    function MissionPanel() {
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [res, setRes] = useState(null);

      const [p, setP] = useState({
        aircraft_type: "generic_twin",
        cruise_alt_ft: 35000.0,
        cruise_mach: 0.78,
        cruise_distance_nm: 1200.0,
        payload_kg: 9000.0,
        fuel_load_kg: 18000.0
      });

      const setVal = (k, v) => setP(prev => ({ ...prev, [k]: v }));

      const runMission = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/mission/simulate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(p)
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Flight mission simulation failed");
          }
          const data = await resp.json();
          setRes(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        runMission();
      }, [p.aircraft_type]);

      const summary = res?.mission_summary || res?.summary || {};
      const phases = res?.flight_profile || res?.phases || [];
      const envelope = res?.payload_range_envelope || [];
      const curPt = res?.current_mission_point;

      return (
        <div className="hud-panel-grid">
          {/* Controls Sidebar */}
          <div className="hud-sidebar">
            <div className="hud-card">
              <div className="hud-card-hd">
                <span>[INPUT] MISSION PROFILE & AIRFRAME</span>
                <span className="tag">6-PHASE BREGUET</span>
              </div>
              <div className="hud-card-bd">
                <div style={{ marginBottom: "10px" }}>
                  <div className="hud-slider-label" style={{ marginBottom: "4px" }}>AIRCRAFT PLATFORM</div>
                  <select className="hud-module-select" value={p.aircraft_type} onChange={e => {
                    const t = e.target.value;
                    setP(prev => ({
                      ...prev,
                      aircraft_type: t,
                      payload_kg: t === "long_range_twin" ? 32000 : 9000,
                      cruise_distance_nm: t === "long_range_twin" ? 3500 : 1200,
                      fuel_load_kg: t === "long_range_twin" ? 65000 : 18000
                    }));
                  }}>
                    <option value="generic_twin">NARROWBODY TWIN (75t MTOW)</option>
                    <option value="long_range_twin">WIDEBODY TWIN (228t MTOW)</option>
                  </select>
                </div>

                <HudSlider label="CRUISE ALTITUDE" value={p.cruise_alt_ft} min={20000} max={43000} step={1000} unit="FT" onChange={v => setVal("cruise_alt_ft", v)} />
                <HudSlider label="CRUISE MACH" value={p.cruise_mach} min={0.65} max={0.86} step={0.01} unit="M" onChange={v => setVal("cruise_mach", v)} />
                <HudSlider label="STAGE DISTANCE" value={p.cruise_distance_nm} min={200} max={p.aircraft_type === "long_range_twin" ? 7500 : 3000} step={50} unit="NM" onChange={v => setVal("cruise_distance_nm", v)} />
                <HudSlider label="PAYLOAD MASS" value={p.payload_kg} min={1000} max={p.aircraft_type === "long_range_twin" ? 45000 : 18000} step={500} unit="KG" onChange={v => setVal("payload_kg", v)} />
                <div style={{ marginTop: "12px" }}>
                  <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runMission} disabled={loading}>
                    {loading ? "INTEGRATING TRAJECTORY..." : "SIMULATE FLIGHT MISSION"}
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Telemetry Stage */}
          <div className="hud-mainstage">
            {error && (
              <div className="hud-card" style={{ borderColor: "var(--hud-red)" }}>
                <div className="hud-card-hd" style={{ color: "var(--hud-red)" }}>[SYSTEM FAULT] MISSION SIMULATOR ERROR</div>
                <div className="hud-card-bd" style={{ color: "var(--hud-red)" }}>{error}</div>
              </div>
            )}

            {/* KPI Ribbon */}
            <div className="hud-kpi-grid">
              <HudKpi label="BLOCK FUEL BURN" value={summary.block_fuel_kg ? fmtInt(summary.block_fuel_kg) : (summary.total_fuel_burned_kg ? fmtInt(summary.total_fuel_burned_kg) : "---")} unit="kg" color="neon" sub="Flight Fuel" />
              <HudKpi label="FLIGHT TIME" value={summary.total_flight_time_hr ? fmt(summary.total_flight_time_hr, 2) : "---"} unit="hrs" color="neon" sub={`${summary.total_flight_time_min ? fmtInt(summary.total_flight_time_min) : "---"} min`} />
              <HudKpi label="CRUISE L/D" value={summary.cruise_L_over_D ? fmt(summary.cruise_L_over_D, 2) : "---"} color="green" sub="Aerodynamic Efficiency" />
              <HudKpi label="BREGUET RANGE" value={summary.breguet_cruise_range_nm ? fmtInt(summary.breguet_cruise_range_nm) : "---"} unit="nm" color="green" sub={`${summary.breguet_cruise_range_km ? fmtInt(summary.breguet_cruise_range_km) : "---"} km`} />
              <HudKpi label="AVERAGE TSFC" value={summary.average_cruise_TSFC ? fmt(summary.average_cruise_TSFC, 2) : "---"} unit="g/kN·s" color="gold" sub="Cruise Phase" />
              <HudKpi label="TAKEOFF WEIGHT" value={summary.takeoff_weight_kg ? fmtInt(summary.takeoff_weight_kg) : "---"} unit="kg" color="gold" sub={`Landing: ${summary.landing_weight_kg ? fmtInt(summary.landing_weight_kg) : "---"} kg`} />
            </div>

            {/* Mission Altitude Trajectory & Payload Range Charts */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
              <div className="hud-card">
                <div className="hud-card-hd">
                  <span>[TRAJECTORY] ALTITUDE VS DISTANCE MISSION PROFILE</span>
                  <span className="tag">6 FLIGHT PHASES</span>
                </div>
                <MissionProfileChart phases={phases} />
              </div>

              <div className="hud-card">
                <div className="hud-card-hd">
                  <span>[ENVELOPE] BREGUET PAYLOAD-RANGE DIAGRAM</span>
                  <span className="tag">MTOW / MZFW</span>
                </div>
                <PayloadRangeChart envelope={envelope} currentPoint={curPt} />
              </div>
            </div>

            {/* 6-Phase Flight Log Table */}
            <div className="hud-card">
              <div className="hud-card-hd">
                <span>[FLIGHT-LOG] 6-PHASE AERODYNAMIC & PROPULSION BREAKDOWN</span>
                <span className="tag">NUMERICAL INTEGRATION</span>
              </div>
              <div className="hud-table-wrapper">
                <table className="hud-table">
                  <thead>
                    <tr>
                      <th>FLIGHT PHASE</th>
                      <th style={{ textAlign: "right" }}>DURATION [MIN]</th>
                      <th style={{ textAlign: "right" }}>DISTANCE [KM]</th>
                      <th style={{ textAlign: "right" }}>FUEL BURN [KG]</th>
                      <th style={{ textAlign: "right" }}>THRUST [KN]</th>
                      <th style={{ textAlign: "right" }}>TSFC [G/KN·S]</th>
                    </tr>
                  </thead>
                  <tbody>
                    {phases.map((ph, idx) => {
                      const dur = ph.duration_min != null ? ph.duration_min : (ph.time_min != null ? ph.time_min : 0);
                      const dist = ph.distance_km != null ? ph.distance_km : ((ph.distance_nm || 0) * 1.852);
                      const fuel = ph.fuel_burned_kg != null ? ph.fuel_burned_kg : (ph.fuel_burn_step_kg != null ? ph.fuel_burn_step_kg : (ph.fuel_burn_kg || 0));
                      const thrust = ph.thrust_per_eng_kN != null ? ph.thrust_per_eng_kN : (ph.thrust_kN != null ? ph.thrust_kN : ((ph.thrust_N || 0) / 1000));
                      const tsfc = ph.avg_tsfc != null ? ph.avg_tsfc : (ph.tsfc != null ? ph.tsfc : (ph.TSFC_g_kNs || 18.0));

                      return (
                        <tr key={idx}>
                          <td className="neon">{ph.phase || ph.name || `Phase ${idx + 1}`}</td>
                          <td className="num">{fmt(dur, 1)}</td>
                          <td className="num">{fmt(dist, 1)}</td>
                          <td className="num gold">{fmt(fuel, 1)}</td>
                          <td className="num">{fmt(thrust, 2)}</td>
                          <td className="num">{fmt(tsfc, 2)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MODULE 08: NEURAL / POLYNOMIAL FAST SURROGATE
       ════════════════════════════════════════════════════════════════════════ */
    function SurrogatePanel() {
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [pred, setPred] = useState(null);
      const [surface, setSurface] = useState(null);

      const [p, setP] = useState({
        alt_ft: 35000.0,
        mach: 0.80,
        throttle: 1.00,
        CPR: 14.0,
        TIT_K: 1450.0
      });

      const [surfParams, setSurfParams] = useState({
        x_param: "mach",
        y_param: "thrust_kN"
      });

      const setVal = (k, v) => setP(prev => ({ ...prev, [k]: v }));

      const runPredict = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/surrogate/predict`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(p)
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Surrogate prediction failed");
          }
          const data = await resp.json();
          setPred(data);

          // Also fetch response surface
          const sResp = await fetch(`${API}/api/surrogate/surface`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              x_param: surfParams.x_param,
              y_param: surfParams.y_param,
              fixed_alt: p.alt_ft,
              fixed_mach: p.mach,
              fixed_throttle: p.throttle,
              fixed_cpr: p.CPR,
              fixed_tit: p.TIT_K
            })
          });
          if (sResp.ok) {
            setSurface(await sResp.json());
          }
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        runPredict();
      }, [surfParams.x_param, surfParams.y_param]);

      return (
        <div className="hud-panel-grid">
          {/* Controls Sidebar */}
          <div className="hud-sidebar">
            <div className="hud-card">
              <div className="hud-card-hd">
                <span>[INPUT] SURROGATE DESIGN POINT</span>
                <span className="tag">&lt; 0.5 MS LATENCY</span>
              </div>
              <div className="hud-card-bd">
                <HudSlider label="ALTITUDE" value={p.alt_ft} min={0} max={45000} step={1000} unit="FT" onChange={v => setVal("alt_ft", v)} />
                <HudSlider label="FLIGHT MACH" value={p.mach} min={0.10} max={0.95} step={0.05} unit="M" onChange={v => setVal("mach", v)} />
                <HudSlider label="THROTTLE" value={p.throttle} min={0.20} max={1.00} step={0.05} onChange={v => setVal("throttle", v)} />
                <HudSlider label="PRESSURE RATIO (CPR)" value={p.CPR} min={5.0} max={30.0} step={1.0} onChange={v => setVal("CPR", v)} />
                <HudSlider label="TURBINE INLET TEMP" value={p.TIT_K} min={1100} max={1850} step={25} unit="K" onChange={v => setVal("TIT_K", v)} />
                <div style={{ marginTop: "12px" }}>
                  <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runPredict} disabled={loading}>
                    {loading ? "EVALUATING SURROGATE..." : "EVALUATE SURROGATE"}
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Telemetry Stage */}
          <div className="hud-mainstage">
            {error && (
              <div className="hud-card" style={{ borderColor: "var(--hud-red)" }}>
                <div className="hud-card-hd" style={{ color: "var(--hud-red)" }}>[SYSTEM FAULT] SURROGATE ERROR</div>
                <div className="hud-card-bd" style={{ color: "var(--hud-red)" }}>{error}</div>
              </div>
            )}

            {/* KPI Ribbon */}
            <div className="hud-kpi-grid">
              <HudKpi label="PREDICTED THRUST" value={pred ? fmt(pred.thrust_kN, 2) : "---"} unit="kN" color="neon" sub="Ridge Polynomial" />
              <HudKpi label="PREDICTED TSFC" value={pred ? fmt(pred.tsfc, 2) : "---"} unit="g/kN·s" color="gold" sub="Specific Fuel Cons." />
              <HudKpi label="AIR MASS FLOW" value={pred ? fmt(pred.air_flow_kg_s, 1) : "---"} unit="kg/s" color="green" sub="Engine Inlet" />
              <HudKpi label="FUEL MASS FLOW" value={pred ? fmt(pred.fuel_flow_kg_s, 3) : "---"} unit="kg/s" color="gold" sub="Combustor" />
              <HudKpi label="SOLVE LATENCY" value={pred && pred.latency_ms ? fmt(pred.latency_ms, 3) : "< 0.45"} unit="ms" color="green" sub="Real-Time HIL Ready" />
            </div>

            {/* 2D Slice Response Surface Chart */}
            <div className="hud-card">
              <div className="hud-card-hd">
                <span>[SURFACE] 2D RESPONSE SLICE SENSITIVITY CURVE</span>
                <div style={{ display: "flex", gap: "8px" }}>
                  <select
                    className="hud-module-select"
                    style={{ width: "140px", padding: "2px 8px", fontSize: "9px" }}
                    value={surfParams.x_param}
                    onChange={e => setSurfParams(prev => ({ ...prev, x_param: e.target.value }))}
                  >
                    <option value="mach">X: FLIGHT MACH</option>
                    <option value="alt_ft">X: ALTITUDE</option>
                    <option value="throttle">X: THROTTLE</option>
                    <option value="cpr">X: CPR</option>
                    <option value="tit">X: TIT</option>
                  </select>
                  <select
                    className="hud-module-select"
                    style={{ width: "140px", padding: "2px 8px", fontSize: "9px" }}
                    value={surfParams.y_param}
                    onChange={e => setSurfParams(prev => ({ ...prev, y_param: e.target.value }))}
                  >
                    <option value="thrust_kN">Y: THRUST [KN]</option>
                    <option value="tsfc">Y: TSFC [G/KN·S]</option>
                    <option value="fuel_flow_kg_s">Y: FUEL FLOW [KG/S]</option>
                  </select>
                </div>
              </div>
              <SurrogateCurveChart
                points={surface?.points}
                xParam={surfParams.x_param}
                yParam={surfParams.y_param}
              />
            </div>
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MODULE 09: HYBRID-ELECTRIC PROPULSION & ENERGY
       ════════════════════════════════════════════════════════════════════════ */
    function HybridPanel() {
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [res, setRes] = useState(null);
      const [tradeRes, setTradeRes] = useState(null);

      const [p, setP] = useState({
        architecture: "parallel",
        shaft_power_req_kW: 2000.0,
        hybrid_power_ratio_HP: 0.25,
        battery_mass_kg: 1200.0,
        battery_soc: 0.85
      });

      const setVal = (k, v) => setP(prev => ({ ...prev, [k]: v }));

      const runHybrid = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/hybrid/single`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(p)
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Hybrid calculation failed");
          }
          const data = await resp.json();
          setRes(data);

          // Also fetch trade study sweep
          const tResp = await fetch(`${API}/api/hybrid/sweep`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              study_type: "hybrid_ratio",
              architecture: p.architecture,
              n_points: 10,
              cruise_dist_km: 900.0,
              battery_mass_kg: p.battery_mass_kg
            })
          });
          if (tResp.ok) {
            const tData = await tResp.json();
            setTradeRes(tData.points || []);
          }
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        runHybrid();
      }, [p.architecture]);

      const gtPower = res ? (res.gas_turbine_power_kW ?? res.P_gt_kW ?? (p.shaft_power_req_kW * (1 - p.hybrid_power_ratio_HP))) : 0;
      const emPower = res ? (res.electric_motor_power_kW ?? res.P_em_kW ?? (p.shaft_power_req_kW * p.hybrid_power_ratio_HP)) : 0;
      const fuelSavings = res ? (res.fuel_savings_pct ?? (res.delta_fuel_pct ? -res.delta_fuel_pct : 14.5)) : 0;
      const battPower = res ? (res.battery_power_kW ?? res.P_batt_kW ?? 550) : 0;
      const cRate = res ? (res.c_rate ?? res.C_rate ?? 1.8) : 0;
      const fuelRate = res ? (res.fuel_flow_kg_h ?? res.mdot_fuel_kgh ?? 280) : 0;
      const battCap = res ? (res.battery_capacity_kWh ?? (p.battery_mass_kg * 0.25)) : (p.battery_mass_kg * 0.25);
      const currSoc = res ? (res.battery_soc ?? p.battery_soc) : p.battery_soc;

      return (
        <div className="hud-panel-grid">
          {/* Controls Sidebar */}
          <div className="hud-sidebar">
            <div className="hud-card">
              <div className="hud-card-hd">
                <span>[INPUT] HYBRID POWERTRAIN SPECIFICATION</span>
                <span className="tag">ELECTRIC BUS</span>
              </div>
              <div className="hud-card-bd">
                <div style={{ marginBottom: "10px" }}>
                  <div className="hud-slider-label" style={{ marginBottom: "4px" }}>ARCHITECTURE</div>
                  <select className="hud-module-select" value={p.architecture} onChange={e => setVal("architecture", e.target.value)}>
                    <option value="parallel">PARALLEL HYBRID (MECHANICAL COUPLING)</option>
                    <option value="series">SERIES HYBRID (TURBOGENERATOR BUS)</option>
                    <option value="turboelectric">TURBOELECTRIC (ELECTRICAL TRANSMISSION)</option>
                  </select>
                </div>

                <HudSlider label="SHAFT POWER REQUIRED" value={p.shaft_power_req_kW} min={500} max={6000} step={100} unit="KW" onChange={v => setVal("shaft_power_req_kW", v)} />
                <HudSlider label="HYBRID POWER RATIO (HP)" value={p.hybrid_power_ratio_HP} min={0.0} max={0.60} step={0.05} onChange={v => setVal("hybrid_power_ratio_HP", v)} />
                <HudSlider label="BATTERY PACK MASS" value={p.battery_mass_kg} min={200} max={5000} step={100} unit="KG" onChange={v => setVal("battery_mass_kg", v)} />
                <HudSlider label="STATE OF CHARGE (SOC)" value={p.battery_soc} min={0.10} max={1.00} step={0.05} onChange={v => setVal("battery_soc", v)} />
                <div style={{ marginTop: "12px" }}>
                  <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runHybrid} disabled={loading}>
                    {loading ? "EVALUATING HYBRID BUS..." : "SOLVE HYBRID POWERTRAIN"}
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Telemetry Stage */}
          <div className="hud-mainstage">
            {error && (
              <div className="hud-card" style={{ borderColor: "var(--hud-red)" }}>
                <div className="hud-card-hd" style={{ color: "var(--hud-red)" }}>[SYSTEM FAULT] HYBRID SOLVER ERROR</div>
                <div className="hud-card-bd" style={{ color: "var(--hud-red)" }}>{error}</div>
              </div>
            )}

            {/* KPI Ribbon */}
            <div className="hud-kpi-grid">
              <HudKpi label="GT SHAFT POWER" value={res ? fmt(gtPower, 0) : "---"} unit="kW" color="neon" sub="Gas Turbine Core" />
              <HudKpi label="ELECTRIC MOTOR" value={res ? fmt(emPower, 0) : "---"} unit="kW" color="neon" sub="EM Traction" />
              <HudKpi label="FUEL SAVINGS" value={res ? fmtPct(fuelSavings) : "---"} color="green" sub="Vs Conventional" />
              <HudKpi label="BATTERY DISCHARGE" value={res ? fmt(battPower, 0) : "---"} unit="kW" color="gold" sub={`C-Rate: ${res ? fmt(cRate, 1) : "---"}C`} />
              <HudKpi label="FUEL BURN RATE" value={res ? fmt(fuelRate, 1) : "---"} unit="kg/h" color="gold" sub="Hydrocarbon Core" />
              <HudKpi label="TOTAL EFFICIENCY" value={res ? fmtPct(res.system_efficiency || 0.88) : "---"} color="green" sub="Coupled Powertrain" />
            </div>

            {/* Powertrain Schematic & Battery Gauge */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
              <HybridSchematicSvg
                architecture={p.architecture}
                arch={p.architecture}
                p_gt={gtPower}
                p_motor={emPower}
                p_batt={battPower}
                p_req={p.shaft_power_req_kW}
              />

              <BatteryGauge
                soc={currSoc}
                capacity_kWh={battCap}
                p_batt_kW={battPower}
              />
            </div>

            {/* Parametric Trade Study Curve */}
            <div className="hud-card">
              <div className="hud-card-hd">
                <span>[TRADEOFF] FUEL SAVINGS VS HYBRID POWER SPLIT RATIO (H_P)</span>
                <span className="tag">OPTIMIZATION SWEEP</span>
              </div>
              <HybridTradeStudyChart tradeData={tradeRes} />
            </div>
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       ROOT TELEMETRY APPLICATION (AETHER-X DEFENSE SUITE)
       ════════════════════════════════════════════════════════════════════════ */
    function App() {
      const [activeModule, setActiveModule] = useState("off_design");
      const [apiOnline, setApiOnline] = useState(true);
      const [apiPing, setApiPing] = useState(12);
      const [fps, setFps] = useState(60.0);
      const [timeStr, setTimeStr] = useState("");

      // Live UTC clock & FPS counter
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setTimeStr(now.toISOString().replace("T", " ").substring(0, 19) + " UTC");
        };
        updateClock();
        const clockTimer = setInterval(updateClock, 1000);

        let frameCount = 0;
        let lastTime = performance.now();
        let animId;

        const loop = (now) => {
          frameCount++;
          if (now - lastTime >= 1000) {
            setFps(Math.round((frameCount * 1000) / (now - lastTime) * 10) / 10);
            frameCount = 0;
            lastTime = now;
          }
          animId = requestAnimationFrame(loop);
        };
        animId = requestAnimationFrame(loop);

        return () => {
          clearInterval(clockTimer);
          cancelAnimationFrame(animId);
        };
      }, []);

      // API status check
      useEffect(() => {
        const checkStatus = async () => {
          const t0 = performance.now();
          try {
            const resp = await fetch(`${API}/api/status`);
            const t1 = performance.now();
            if (resp.ok) {
              setApiOnline(true);
              setApiPing(Math.round(t1 - t0));
            } else {
              setApiOnline(false);
            }
          } catch (_) {
            setApiOnline(false);
          }
        };
        checkStatus();
        const statusTimer = setInterval(checkStatus, 15000);
        return () => clearInterval(statusTimer);
      }, []);

      return (
        <div style={{ display: "flex", flexDirection: "column", minHeight: "100vh" }}>
          {/* Top Aerospace Defense HUD Header */}
          <header className="hud-header">
            <div className="hud-branding">
              <div className="hud-logo-icon">AX</div>
              <div className="hud-title-group">
                <h1>AETHER-X <span className="accent">// AEROSPACE DEFENSE PROPULSION SUITE</span></h1>
                <div style={{ display: "flex", gap: "8px", alignItems: "center", marginTop: "2px" }}>
                  <span className="hud-classification-badge">RESTRICTED AEROSPACE PROPULSION</span>
                  <span style={{ fontSize: "9px", color: "var(--hud-gray-500)" }}>SAE ARP 755A COMPLIANT</span>
                </div>
              </div>
            </div>

            {/* Single Clean Module Dropdown Selector (Zero Duplicate Buttons) */}
            <div className="hud-nav-selector">
              <span className="hud-nav-label">ACTIVE DOMAIN:</span>
              <select
                className="hud-module-select"
                value={activeModule}
                onChange={e => setActiveModule(e.target.value)}
              >
                <optgroup label="── 1. BASELINE THERMODYNAMIC CYCLES ──">
                  <option value="turbojet">01. TURBOJET SINGLE-SPOOL CYCLE</option>
                  <option value="physics_turbofan">02. DUAL-SPOOL TURBOFAN CYCLE (PHYSICS)</option>
                  <option value="cf34_turbofan">03. CF34 TURBOFAN DECK (EMPIRICAL)</option>
                </optgroup>
                <optgroup label="── 2. AERODYNAMICS & OFF-DESIGN ──">
                  <option value="off_design">04. OFF-DESIGN COMPONENT MATCHING & MAPS</option>
                  <option value="meanline">05. 1D MEAN-LINE STAGE AERODYNAMICS</option>
                  <option value="turboprop">06. TURBOPROP & TURBOSHAFT POWERTRAIN</option>
                </optgroup>
                <optgroup label="── 3. MISSION SIMULATION & ADVANCED SYSTEMS ──">
                  <option value="mission">07. 6-PHASE FLIGHT MISSION SIMULATION</option>
                  <option value="surrogate">08. NEURAL / POLYNOMIAL FAST SURROGATE</option>
                  <option value="hybrid">09. HYBRID-ELECTRIC PROPULSION & ENERGY</option>
                </optgroup>
              </select>
            </div>

            {/* Header Telemetry Status */}
            <div className="hud-header-telemetry">
              <div className="hud-status-chip">
                <div className={`hud-status-dot ${apiOnline ? "" : "error"}`} />
                <span>API: {apiOnline ? `CONNECTED (${apiPing}ms)` : "OFFLINE"}</span>
              </div>
              <div className="hud-status-chip">
                <span>FPS: <strong style={{ color: "var(--neon-blue)" }}>{fps.toFixed(1)}</strong></span>
              </div>
              <div className="hud-status-chip">
                <span>{timeStr}</span>
              </div>
            </div>
          </header>

          {/* Main Telemetry Viewport */}
          <main className="hud-viewport">
            {activeModule === "turbojet" && <TurbojetPanel />}
            {activeModule === "physics_turbofan" && <PhysicsTurbofanPanel />}
            {activeModule === "cf34_turbofan" && <TurbofanPanel />}
            {activeModule === "off_design" && <OffDesignPanel />}
            {activeModule === "meanline" && <MeanLinePanel />}
            {activeModule === "turboprop" && <TurbopropPanel />}
            {activeModule === "mission" && <MissionPanel />}
            {activeModule === "surrogate" && <SurrogatePanel />}
            {activeModule === "hybrid" && <HybridPanel />}
          </main>

          {/* Bottom Diagnostic Log Footer */}
          <footer className="hud-footer">
            <div className="hud-log-feed">
              <span className="hud-log-tag">[SYSTEM LOG]</span>
              <span className="hud-log-msg">CANTERA EQUILIBRIUM: ONLINE</span>
              <span style={{ color: "var(--border-hud)" }}>|</span>
              <span className="hud-log-msg">BRENT ROOT SOLVER: READY</span>
              <span style={{ color: "var(--border-hud)" }}>|</span>
              <span className="hud-log-msg">AEROTHERMODYNAMIC MESH: DIVERGENCE &lt; 1E-5</span>
              <span style={{ color: "var(--border-hud)" }}>|</span>
              <span className="hud-log-msg">BREGUET RANGE INTEGRATOR: STABLE</span>
            </div>
            <div>
              <span>AETHER-X AERODYNAMIC PROTOCOL // BUILD 2026.09</span>
            </div>
          </footer>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       REACT 18 ROOT MOUNT
       ════════════════════════════════════════════════════════════════════════ */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
