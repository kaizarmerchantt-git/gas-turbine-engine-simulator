                  <option value="mach">Mach Number</option>
                  <option value="throttle">Throttle Position</option>
                  <option value="bpr">Bypass Ratio (BPR)</option>
                  <option value="cpr">Core PR (CPR)</option>
                  <option value="fpr">Fan PR (FPR)</option>
                </select>
              </div>

              {sw.param==="altitude" && <>
                <div className="row2">
                  <Num label="From" unit="ft" value={sw.altStart} min={0} max={50000} step={500} onChange={v=>setSW("altStart",v)}/>
                  <Num label="To"   unit="ft" value={sw.altEnd}   min={0} max={50000} step={500} onChange={v=>setSW("altEnd",v)}/>
                </div>
                <Slider label="Fixed Mach" unit="" value={sw.fixedMach} min={0} max={0.9} step={0.01} onChange={v=>setSW("fixedMach",v)} dp={2}/>
                <Slider label="Fixed Throttle" unit="" value={sw.fixedThrottle} min={0.5} max={1.0} step={0.01} onChange={v=>setSW("fixedThrottle",v)} dp={2}/>
              </>}

              {sw.param==="mach" && <>
                <div className="row2">
                  <Num label="From" unit="" value={sw.machStart} min={0} max={0.9} step={0.05} onChange={v=>setSW("machStart",v)} dp={2}/>
                  <Num label="To"   unit="" value={sw.machEnd}   min={0} max={0.9} step={0.05} onChange={v=>setSW("machEnd",v)} dp={2}/>
                </div>
                <Slider label="Fixed Altitude" unit="ft" value={sw.fixedAlt} min={0} max={50000} step={500} onChange={v=>setSW("fixedAlt",v)} dp={0}/>
                <Slider label="Fixed Throttle" unit="" value={sw.fixedThrottle} min={0.5} max={1.0} step={0.01} onChange={v=>setSW("fixedThrottle",v)} dp={2}/>
              </>}

              {sw.param==="throttle" && <>
                <div className="row2">
                  <Num label="From" unit="" value={sw.thrStart} min={0.5} max={1.0} step={0.05} onChange={v=>setSW("thrStart",v)} dp={2}/>
                  <Num label="To"   unit="" value={sw.thrEnd}   min={0.5} max={1.0} step={0.05} onChange={v=>setSW("thrEnd",v)} dp={2}/>
                </div>
                <Slider label="Fixed Altitude" unit="ft" value={sw.fixedAlt}  min={0}   max={50000} step={500}  onChange={v=>setSW("fixedAlt",v)}  dp={0}/>
                <Slider label="Fixed Mach"     unit=""   value={sw.fixedMach} min={0}   max={0.9}   step={0.01} onChange={v=>setSW("fixedMach",v)} dp={2}/>
              </>}

              {sw.param==="bpr" && <>
                <div className="row2">
                  <Num label="From BPR" unit="" value={sw.bprStart} min={0.5} max={15.0} step={0.5} onChange={v=>setSW("bprStart",v)} dp={1}/>
                  <Num label="To BPR"   unit="" value={sw.bprEnd}   min={0.5} max={15.0} step={0.5} onChange={v=>setSW("bprEnd",v)} dp={1}/>
                </div>
                <Slider label="Fixed Altitude" unit="ft" value={sw.fixedAlt}  min={0}   max={50000} step={500}  onChange={v=>setSW("fixedAlt",v)}  dp={0}/>
                <Slider label="Fixed Mach"     unit=""   value={sw.fixedMach} min={0}   max={0.9}   step={0.01} onChange={v=>setSW("fixedMach",v)} dp={2}/>
              </>}

              {sw.param==="cpr" && <>
                <div className="row2">
                  <Num label="From CPR" unit="" value={sw.cprStart} min={2.0} max={35.0} step={1.0} onChange={v=>setSW("cprStart",v)} dp={1}/>
                  <Num label="To CPR"   unit="" value={sw.cprEnd}   min={2.0} max={35.0} step={1.0} onChange={v=>setSW("cprEnd",v)} dp={1}/>
                </div>
                <Slider label="Fixed Altitude" unit="ft" value={sw.fixedAlt}  min={0}   max={50000} step={500}  onChange={v=>setSW("fixedAlt",v)}  dp={0}/>
                <Slider label="Fixed Mach"     unit=""   value={sw.fixedMach} min={0}   max={0.9}   step={0.01} onChange={v=>setSW("fixedMach",v)} dp={2}/>
              </>}

              {sw.param==="fpr" && <>
                <div className="row2">
                  <Num label="From FPR" unit="" value={sw.fprStart} min={1.1} max={2.5} step={0.05} onChange={v=>setSW("fprStart",v)} dp={2}/>
                  <Num label="To FPR"   unit="" value={sw.fprEnd}   min={1.1} max={2.5} step={0.05} onChange={v=>setSW("fprEnd",v)} dp={2}/>
                </div>
                <Slider label="Fixed Altitude" unit="ft" value={sw.fixedAlt}  min={0}   max={50000} step={500}  onChange={v=>setSW("fixedAlt",v)}  dp={0}/>
                <Slider label="Fixed Mach"     unit=""   value={sw.fixedMach} min={0}   max={0.9}   step={0.01} onChange={v=>setSW("fixedMach",v)} dp={2}/>
              </>}

              <Num label="Steps  (≤15 rec.)" unit="" value={sw.nSteps} min={3} max={30} onChange={v=>setSW("nSteps",v)}/>
              <div className="alert a-warn" style={{fontSize:11}}>
                ⚠ Each point ≈ 10–30 s (Cantera). {sw.nSteps} pts ≈ {Math.round(sw.nSteps*20/60)} min
              </div>
            </div>
          </div>
        )}

        <div className="card">
          <div className="card-hd">Engine Geometry</div>
          <div className="card-bd">
            <Slider label="Inlet area A₁"       unit="m²" value={p.A1} min={0.1} max={5.0} step={0.01} onChange={v=>set("A1",v)}/>
            <Slider label="Core face A₂"  unit="m²" value={p.A2} min={0.05} max={2.0} step={0.01} onChange={v=>set("A2",v)}/>
            <Slider label="Bypass Ratio (BPR)"    unit="" value={p.BPR} min={0.1} max={15.0} step={0.1} onChange={v=>set("BPR",v)}/>
            <Slider label="Core Nozzle A₈"    unit="m²" value={p.A8} min={0.02} max={2.0} step={0.01} onChange={v=>set("A8",v)}/>
            <div className="row2">
              <Num label="Fan stages" unit="" value={p.fanStages} min={1} max={3} onChange={v=>set("fanStages",v)}/>
              <Num label="HPC stages" unit="" value={p.hpcStages} min={1} max={20} onChange={v=>set("hpcStages",v)}/>
            </div>
            <div className="row2">
              <Num label="HPT stages" unit="" value={p.hptStages} min={1} max={4}  onChange={v=>set("hptStages",v)}/>
              <Num label="LPT stages" unit="" value={p.lptStages} min={1} max={6}  onChange={v=>set("lptStages",v)}/>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-hd">Compression</div>
          <div className="card-bd">
            <Slider label="Fan PR (FPR)" unit=""  value={p.FPR}  min={1.1}    max={2.5}   step={0.05}   onChange={v=>set("FPR",v)}/>
            <Slider label="Fan Eff η_fan"  unit=""  value={p.etaFan} min={0.70} max={0.98} step={0.005} onChange={v=>set("etaFan",v)}/>
            <Slider label="Core PR (CPR)" unit=""  value={p.CPR}  min={2}    max={40}   step={0.1}   onChange={v=>set("CPR",v)}/>
            <Slider label="HPC Eff η_hpc"  unit=""  value={p.etaHpc} min={0.60} max={0.95} step={0.005} onChange={v=>set("etaHpc",v)}/>
          </div>
        </div>

        <div className="card">
          <div className="card-hd">Combustor</div>
          <div className="card-bd">
            <Slider label="Efficiency η_b"     unit=""   value={p.etaB} min={0.80} max={1.00} step={0.005} onChange={v=>set("etaB",v)}/>
            <Slider label="Pressure loss dp/p" unit=""   value={p.dpP}  min={0.02} max={0.15} step={0.005} onChange={v=>set("dpP",v)}/>
            <Slider label="TIT Limit T_max"    unit="K"  value={p.Tmax} min={900}  max={2000} step={10}    onChange={v=>set("Tmax",v)} dp={0}/>
            <Slider label="Nominal velocity V" unit="m/s" value={p.Vnom} min={20} max={100}   step={1}     onChange={v=>set("Vnom",v)} dp={0}/>
            <div className="row2">
              <Num label="Max fuel φ" unit="" value={p.maxF} min={0.1} max={0.5} step={0.01} onChange={v=>set("maxF",v)} dp={2}/>
              <Num label="Min fuel φ" unit="" value={p.minF} min={0.05} max={0.3} step={0.01} onChange={v=>set("minF",v)} dp={2}/>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-hd">Turbines & Nozzles</div>
          <div className="card-bd">
            <Slider label="HPT Eff η_hpt"       unit="" value={p.etaHpt}     min={0.70} max={0.98} step={0.005} onChange={v=>set("etaHpt",v)}/>
            <Slider label="LPT Eff η_lpt"       unit="" value={p.etaLpt}     min={0.70} max={0.98} step={0.005} onChange={v=>set("etaLpt",v)}/>
            <Slider label="HP Mech Eff η_m,hp"  unit="" value={p.mechLossHp} min={0.90} max={1.00} step={0.001} onChange={v=>set("mechLossHp",v)}/>
            <Slider label="LP Mech Eff η_m,lp"  unit="" value={p.mechLossLp} min={0.90} max={1.00} step={0.001} onChange={v=>set("mechLossLp",v)}/>
            <Slider label="Inlet Eff η_i"       unit="" value={p.etaI}       min={0.80} max={1.00} step={0.005} onChange={v=>set("etaI",v)}/>
            <Slider label="Core Nozzle η_core"  unit="" value={p.etaNozCore} min={0.80} max={1.00} step={0.005} onChange={v=>set("etaNozCore",v)}/>
            <Slider label="Bypass Nozzle η_byp" unit="" value={p.etaNozByp}  min={0.80} max={1.00} step={0.005} onChange={v=>set("etaNozByp",v)}/>
          </div>
        </div>

        <div className="btn-row">
          <button className="btn btn-tj" style={{flex:3}}
            onClick={mode==="single" ? runSingle : runSweep} disabled={loading}>
            {loading
              ? <><span className="spin"/>Computing…</>
              : mode==="single" ? "▶  Run Simulation" : `▶  Run Sweep (${sw.nSteps} pts)`}
          </button>
          <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={reset} disabled={loading}>Reset</button>
        </div>

        {mode==="sweep" && sweepData && (
          <button className="btn btn-ghost btn-sm" onClick={doCSV} disabled={csvBusy}>
            {csvBusy ? <><span className="spin"/>Generating…</> : "⬇  Download CSV"}
          </button>
        )}
      </div>

      <div className="content">
        {error && <div className="alert a-err"><strong>Error:</strong>&nbsp;{error}</div>}

        {!result && !sweepData && !loading && !error && (
          <div className="alert a-info">
            Physics Turbofan Simulation runs a 2-spool thermodynamic solver with Cantera equilibrium.<br/>
            Configure parameters on the left, then click <strong>Run Simulation</strong> or <strong>Run Sweep</strong>.
          </div>
        )}

        {loading && (
          <div className="alert a-warn">
            <span className="spin" style={{color:"#d29922"}}/>&nbsp;
            Running Cantera thermochemistry — please wait (10–60 s per point)…
          </div>
        )}

        {result && mode==="single" && (
          <>
            {result.T_max_limited && (
              <div className="alert a-warn">
                ⚠ TIT limiter active — throttle was reduced internally to keep T below T_max = {p.Tmax} K
              </div>
            )}
            {!result.converged && (
              <div className="alert a-err">
                ⚠ Mass-flow convergence incomplete — results are approximate.
              </div>
            )}

            <div className="kpi-strip">
              <KPI label="Total Thrust" value={fmt(result.T,2)}        unit="kN"        cls="hi-tj"/>
              <KPI label="Bypass Thrust" value={fmt(result.T_byp,2)}   unit="kN"        />
              <KPI label="Core Thrust"   value={fmt(result.T_core,2)}  unit="kN"        />
              <KPI label="Fuel Flow"     value={fmt(result.mdot_fuel*3600,1)} unit="kg/h" />
              <KPI label="TSFC"          value={fmt(result.TSFC,2)}     unit="kg/(kN&middot;h)" />
              <KPI label="Bypass Ratio"  value={fmt(result.BPR,2)}      unit=""          />
              <KPI label="Req. A₁₈"      value={fmt(result.A18_calc,3)} unit="m²"        />
            </div>

            <div className="card">
              <div className="card-hd">Station Data</div>
              <div className="card-bd" style={{padding:0}}>
                <StationTable stations={result.stations}/>
              </div>
            </div>

            {tsLoading && (
              <div className="alert a-info"><span className="spin"/>&nbsp; Fetching T–s diagram data…</div>
            )}
            {tsData && <TsDiagram tsData={tsData}/>}
          </>
        )}

        {sweepData && mode==="sweep" && (
          <SweepCharts sweepData={sweepData} sweepParam={sweepData.sweep_param} engineType="ptf"/>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   OFF-DESIGN PERFORMANCE & COMPONENT MATCHING PANEL
   ════════════════════════════════════════════════════════════════════════════ */
const OD_DEF = {
  N_rel: 1.00,
  alt: 35000,
  mach: 0.80,
  cpr_des: 8.0,
  eta_c_des: 0.85,
  mdot_corr_des: 20.0,
  A8: null,
  eta_i: 0.98,
  eta_t: 0.88,
  mech_loss: 0.99,
  eta_b: 0.99,
  dp_over_p: 0.04,
  T_max: 1500.0,
  eta_noz: 0.98,
  throttle_pos: 1.0,
};

function OffDesignPanel() {
  const [mode, setMode]       = useState("single");
  const [p, setP]             = useState(OD_DEF);
  const set = (k,v) => setP(prev => ({...prev, [k]: v}));

  const [sw, setSw]           = useState({
    param: "speed",
    speedStart: 0.65, speedEnd: 1.05, fixedSpeed: 1.00,
    altStart: 0, altEnd: 40000, fixedAlt: 35000,
    machStart: 0.0, machEnd: 0.85, fixedMach: 0.80,
    nSteps: 12,
  });
  const setSW = (k,v) => setSw(prev => ({...prev, [k]: v}));

  const [mapData,   setMapData]   = useState(null);
  const [result,    setResult]    = useState(null);
  const [sweepData, setSweepData] = useState(null);
  const [loading,   setLoading]   = useState(false);
  const [error,     setError]     = useState(null);
  const [csvBusy,   setCsvBusy]   = useState(false);

  // Fetch initial compressor map on load or design point change
  useEffect(() => {
    fetch(`${API}/api/off_design/map?cpr_des=${p.cpr_des}&eta_c_des=${p.eta_c_des}&mdot_corr_des=${p.mdot_corr_des}`)
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d) setMapData(d); })
      .catch(() => {});
  }, [p.cpr_des, p.eta_c_des, p.mdot_corr_des]);

  const makeSingleBody = () => ({
    N_rel:         p.N_rel,
    alt:           p.alt,
    mach:          p.mach,
    cpr_des:       p.cpr_des,
    eta_c_des:     p.eta_c_des,
    mdot_corr_des: p.mdot_corr_des,
    A8:            p.A8 > 0 ? p.A8 : null,
    eta_i:         p.eta_i,
    eta_t:         p.eta_t,
    mech_loss:     p.mech_loss,
    eta_b:         p.eta_b,
    dp_over_p:     p.dp_over_p,
    T_max:         p.T_max,
    eta_noz:       p.eta_noz,
    throttle_pos:  p.throttle_pos,
  });

  const makeSweepBody = () => ({
    sweep_param:   sw.param,
    n_steps:       sw.nSteps,
    speed_start:   sw.speedStart,
    speed_end:     sw.speedEnd,
    fixed_speed:   sw.fixedSpeed,
    alt_start:     sw.altStart,
    alt_end:       sw.altEnd,
    fixed_alt:     sw.fixedAlt,
    mach_start:    sw.machStart,
    mach_end:      sw.machEnd,
    fixed_mach:    sw.fixedMach,
    cpr_des:       p.cpr_des,
    eta_c_des:     p.eta_c_des,
    mdot_corr_des: p.mdot_corr_des,
    A8:            p.A8 > 0 ? p.A8 : null,
    eta_i:         p.eta_i,
    eta_t:         p.eta_t,
    mech_loss:     p.mech_loss,
    eta_b:         p.eta_b,
    dp_over_p:     p.dp_over_p,
    T_max:         p.T_max,
    eta_noz:       p.eta_noz,
    throttle_pos:  p.throttle_pos,
  });

  const post = async (url, payload) => {
    const r = await fetch(`${API}${url}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    if (!r.ok) { const d = await r.json(); throw new Error(d.detail || r.statusText); }
    return r.json();
  };

  const runSingle = async () => {
    setLoading(true); setError(null); setResult(null);
    try {
      const res = await post("/api/off_design/single", makeSingleBody());
      setResult(res);
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  const runSweep = async () => {
    setLoading(true); setError(null); setSweepData(null);
    try {
      const res = await post("/api/off_design/sweep", makeSweepBody());
      setSweepData(res);
      if (res.map_curves) setMapData(res.map_curves);
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  const doCSV = async () => {
    setCsvBusy(true);
    try {
      const r = await fetch(`${API}/api/off_design/sweep/csv`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(makeSweepBody()),
      });
      if (!r.ok) throw new Error(r.statusText);
      downloadCSV(await r.text(), `off_design_sweep_${sw.param}.csv`);
    } catch(e) { setError(e.message); }
    setCsvBusy(false);
  };

  const reset = () => {
    setP(OD_DEF);
    setResult(null);
    setSweepData(null);
    setError(null);
  };

  return (
    <div className="grid">
      {/* ── sidebar ──────────────────────────────── */}
      <div className="sidebar">
        <div className="card">
          <div className="card-hd">Mode</div>
          <div className="card-bd">
            <div className="mode-tog">
              <button className={`mode-btn ${mode==="single"?"active":""}`} onClick={()=>setMode("single")}>Single Point</button>
              <button className={`mode-btn ${mode==="sweep"?"active":""}`}  onClick={()=>setMode("sweep")}>Operating Sweep</button>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-hd">Flight &amp; Shaft Speed</div>
          <div className="card-bd">
            <Slider label="Relative Spool Speed N/N_des" unit="" value={p.N_rel} min={0.60} max={1.05} step={0.01} onChange={v=>set("N_rel",v)} dp={2}/>
            <Slider label="Altitude" unit="ft" value={p.alt} min={0} max={50000} step={500} onChange={v=>set("alt",v)} dp={0}/>
            <Slider label="Flight Mach" unit="" value={p.mach} min={0.0} max={0.90} step={0.01} onChange={v=>set("mach",v)} dp={2}/>
            <Slider label="Throttle (Fuel)" unit="" value={p.throttle_pos} min={0.5} max={1.0} step={0.01} onChange={v=>set("throttle_pos",v)} dp={2}/>
          </div>
        </div>

        {mode==="sweep" && (
          <div className="card">
            <div className="card-hd">Operating Sweep Settings</div>
            <div className="card-bd">
              <div className="field">
                <label>Sweep Parameter</label>
                <select value={sw.param} onChange={e=>setSW("param",e.target.value)}>
                  <option value="speed">Relative Shaft Speed (N/N_des)</option>
                  <option value="altitude">Altitude (ft)</option>
                  <option value="mach">Flight Mach Number</option>
                </select>
              </div>

              {sw.param==="speed" && (
                <>
                  <div className="row2">
                    <Num label="From N" unit="" value={sw.speedStart} min={0.60} max={1.05} step={0.05} onChange={v=>setSW("speedStart",v)} dp={2}/>
                    <Num label="To N"   unit="" value={sw.speedEnd}   min={0.60} max={1.05} step={0.05} onChange={v=>setSW("speedEnd",v)} dp={2}/>
                  </div>
                  <Slider label="Fixed Alt" unit="ft" value={sw.fixedAlt} min={0} max={50000} step={500} onChange={v=>setSW("fixedAlt",v)} dp={0}/>
                  <Slider label="Fixed Mach" unit="" value={sw.fixedMach} min={0} max={0.9} step={0.01} onChange={v=>setSW("fixedMach",v)} dp={2}/>
                </>
              )}

              {sw.param==="altitude" && (
                <>
                  <div className="row2">
                    <Num label="From Alt" unit="ft" value={sw.altStart} min={0} max={50000} step={1000} onChange={v=>setSW("altStart",v)}/>
                    <Num label="To Alt"   unit="ft" value={sw.altEnd}   min={0} max={50000} step={1000} onChange={v=>setSW("altEnd",v)}/>
                  </div>
                  <Slider label="Fixed Speed N" unit="" value={sw.fixedSpeed} min={0.60} max={1.05} step={0.01} onChange={v=>setSW("fixedSpeed",v)} dp={2}/>
                  <Slider label="Fixed Mach" unit="" value={sw.fixedMach} min={0} max={0.9} step={0.01} onChange={v=>setSW("fixedMach",v)} dp={2}/>
                </>
              )}

              {sw.param==="mach" && (
                <>
                  <div className="row2">
                    <Num label="From Mach" unit="" value={sw.machStart} min={0.0} max={0.9} step={0.05} onChange={v=>setSW("machStart",v)} dp={2}/>
                    <Num label="To Mach"   unit="" value={sw.machEnd}   min={0.0} max={0.9} step={0.05} onChange={v=>setSW("machEnd",v)} dp={2}/>
                  </div>
                  <Slider label="Fixed Speed N" unit="" value={sw.fixedSpeed} min={0.60} max={1.05} step={0.01} onChange={v=>setSW("fixedSpeed",v)} dp={2}/>
                  <Slider label="Fixed Alt" unit="ft" value={sw.fixedAlt} min={0} max={50000} step={500} onChange={v=>setSW("fixedAlt",v)} dp={0}/>
                </>
              )}

              <Num label="Sweep Points" unit="" value={sw.nSteps} min={4} max={30} onChange={v=>setSW("nSteps",v)}/>
              <div className="alert a-info" style={{fontSize:11}}>
                Fast Brent root matching runs pure analytical cycle thermodynamics with sub-second convergence.
              </div>
            </div>
          </div>
        )}

        <div className="card">
          <div className="card-hd">Design Point Calibration</div>
          <div className="card-bd">
            <Slider label="Design CPR" unit="" value={p.cpr_des} min={3.0} max={25.0} step={0.1} onChange={v=>set("cpr_des",v)} dp={1}/>
            <Slider label="Design Comp Eff η_c" unit="" value={p.eta_c_des} min={0.65} max={0.95} step={0.01} onChange={v=>set("eta_c_des",v)} dp={2}/>
            <Slider label="Design ṁ_corr" unit="kg/s" value={p.mdot_corr_des} min={5.0} max={50.0} step={0.5} onChange={v=>set("mdot_corr_des",v)} dp={1}/>
            <div className="field">
              <label>Throat Area A₈ <span>{p.A8 > 0 ? `${p.A8.toFixed(4)} m²` : "Auto (Design Sized)"}</span></label>
              <input type="number" min={0} max={2.0} step={0.01} value={p.A8 || ""} placeholder="Auto (Leave blank for design sizing)"
                onChange={e => set("A8", e.target.value ? Number(e.target.value) : null)} />
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-hd">Turbomachinery &amp; Limits</div>
          <div className="card-bd">
            <Slider label="TIT Limit T_max" unit="K" value={p.T_max} min={1000} max={1900} step={10} onChange={v=>set("T_max",v)} dp={0}/>
            <Slider label="Turbine Eff η_t" unit="" value={p.eta_t} min={0.65} max={0.96} step={0.01} onChange={v=>set("eta_t",v)} dp={2}/>

              <KPI label="Corr. Flow" value={fmt(result.mdot_corr, 2)} unit="kg/s" />
              <KPI label="CPR" value={fmt(result.CPR, 2)} unit="" />

            {/* Emissions & Combustor strip */}

                  </div>
                  <div className="field">
                    <label>Fuel-Air Ratio (FAR)</label>
                    <span style={{fontFamily:"var(--mono)", fontSize:15, fontWeight:700}}>{fmt(result.emissions.FAR, 4)}</span>
                  </div>
                  <div className="field">
                    <label>EI NOx</label>
                    <span style={{fontFamily:"var(--mono)", fontSize:15, fontWeight:700, color:"#f78166"}}>{fmt(result.emissions.EI_NOx, 2)} g/kg</span>
                  </div>
                  <div className="field">
                    <label>EI CO</label>
                    <span style={{fontFamily:"var(--mono)", fontSize:15, fontWeight:700, color:"#d29922"}}>{fmt(result.emissions.EI_CO, 2)} g/kg</span>
                  </div>
                  <div className="field">
                    <label>EI CO₂</label>
                    <span style={{fontFamily:"var(--mono)", fontSize:15, fontWeight:700, color:"var(--acc2)"}}>{fmt(result.emissions.EI_CO2, 1)} g/kg</span>
                  </div>
                  <div className="field">
                    <label>Throat A₈ Match</label>
                    <span style={{fontFamily:"var(--mono)", fontSize:15, fontWeight:700, color:"var(--acc1)"}}>{fmt(result.A8_calc, 4)} m² ({fmt(result.A8_match_err_pct, 2)}% err)</span>
                  </div>
                </div>
              </div>

            {/* Station Thermodynamics */}
            <div className="card">
              <div className="card-hd">Station Thermodynamics</div>

              </div>

        )}

        {sweepData && mode==="sweep" && (
          <>
            <CompressorMapChart
              mapData={mapData || sweepData.map_curves}
              operatingPoint={null}
              operatingLine={sweepData.operating_line}
            />
            <OffDesignSweepCharts sweepData={sweepData} sweepParam={sweepData.sweep_param} />
          </>
        )}
      </div>
    </div>
  );
}

function VelocityTrianglesSvg({ inlet, exit, type = "compressor" }) {
  if (!inlet || !exit) return null;
  const U = inlet.U || 350;
  const Ca1 = inlet.Ca || 180;
  const Ctheta1 = inlet.Ctheta || 0;
  const Ca2 = exit.Ca || 175;
  const Ctheta2 = exit.Ctheta || 120;
  
  const maxVel = Math.max(U, Ca1, Ca2, Math.abs(Ctheta2), Math.abs(inlet.W || 300), Math.abs(exit.W || 200)) || 350;
  const scale = 110 / maxVel;
  
  const y0 = 190;
  const x1_start = 60;
  const u1_len = U * scale;
  const ca1_len = Ca1 * scale;
  const ct1_len = Ctheta1 * scale;
  
  const x2_start = 360;
  const u2_len = U * scale;
  const ca2_len = Ca2 * scale;
  const ct2_len = Ctheta2 * scale;
  
  return (
    <div className="card" style={{marginTop: 14}}>
      <div className="card-hd">Mean-Line Velocity Triangles (Euler Turbomachinery)</div>
      <div className="card-bd" style={{background: "#11151c", padding: 12}}>
        <svg viewBox="0 0 640 240" style={{width: "100%", maxHeight: 240}}>
          <defs>
            <marker id="arr-u" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#e3b341" />
            </marker>
            <marker id="arr-c" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff" />
            </marker>
            <marker id="arr-w" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950" />
            </marker>
          </defs>

          {/* Legend */}
          <g transform="translate(20, 20)">
            <line x1="0" y1="0" x2="25" y2="0" stroke="#e3b341" strokeWidth="2.5" markerEnd="url(#arr-u)"/>
            <text x="32" y="4" fill="#e3b341" fontSize="11" fontFamily="var(--mono)">U (Blade speed)</text>
            <line x1="150" y1="0" x2="175" y2="0" stroke="#58a6ff" strokeWidth="2.5" markerEnd="url(#arr-c)"/>
            <text x="182" y="4" fill="#58a6ff" fontSize="11" fontFamily="var(--mono)">C (Absolute vel)</text>
            <line x1="310" y1="0" x2="335" y2="0" stroke="#3fb950" strokeWidth="2.5" markerEnd="url(#arr-w)"/>
            <text x="342" y="4" fill="#3fb950" fontSize="11" fontFamily="var(--mono)">W (Relative vel)</text>
          </g>

          {/* Station 1: Rotor Inlet */}
          <text x={x1_start + 20} y="55" fill="var(--muted)" fontSize="12" fontWeight="700">Station 1: Rotor Inlet</text>
          <line x1={x1_start} y1={y0} x2={x1_start + u1_len} y2={y0} stroke="#e3b341" strokeWidth="2.5" markerEnd="url(#arr-u)"/>
          <text x={x1_start + u1_len/2 - 10} y={y0 + 16} fill="#e3b341" fontSize="11" fontFamily="var(--mono)">U={fmt(U,0)}</text>
          <line x1={x1_start} y1={y0} x2={x1_start + ct1_len} y2={y0 - ca1_len} stroke="#58a6ff" strokeWidth="2.5" markerEnd="url(#arr-c)"/>
          <text x={x1_start + ct1_len/2 - 25} y={y0 - ca1_len/2} fill="#58a6ff" fontSize="11" fontFamily="var(--mono)">C₁={fmt(inlet.C,0)} (α₁={fmt(inlet.alpha_deg,1)}°)</text>
          <line x1={x1_start + u1_len} y1={y0} x2={x1_start + ct1_len} y2={y0 - ca1_len} stroke="#3fb950" strokeWidth="2.5" markerEnd="url(#arr-w)"/>
          <text x={x1_start + u1_len/2 + 10} y={y0 - ca1_len/2} fill="#3fb950" fontSize="11" fontFamily="var(--mono)">W₁={fmt(inlet.W,0)} (β₁={fmt(inlet.beta_deg,1)}°)</text>

          {/* Station 2: Rotor Exit */}
          <text x={x2_start + 20} y="55" fill="var(--muted)" fontSize="12" fontWeight="700">Station 2: Rotor Exit</text>
          <line x1={x2_start} y1={y0} x2={x2_start + u2_len} y2={y0} stroke="#e3b341" strokeWidth="2.5" markerEnd="url(#arr-u)"/>
          <text x={x2_start + u2_len/2 - 10} y={y0 + 16} fill="#e3b341" fontSize="11" fontFamily="var(--mono)">U={fmt(U,0)}</text>
          <line x1={x2_start} y1={y0} x2={x2_start + ct2_len} y2={y0 - ca2_len} stroke="#58a6ff" strokeWidth="2.5" markerEnd="url(#arr-c)"/>

          <line x1={x2_start + u2_len} y1={y0} x2={x2_start + ct2_len} y2={y0 - ca2_len} stroke="#3fb950" strokeWidth="2.5" markerEnd="url(#arr-w)"/>

        </svg>
      </div>
    </div>
  );
}

function AnnulusSvg({ stages }) {
  if (!stages || !stages.length) return null;
  const n = stages.length;
  const w = 620, h = 180;
  const xStart = 60, xEnd = 560;
  const dx = n > 1 ? (xEnd - xStart) / (n - 1) : 0;
  const maxTip = Math.max(...stages.map(s => s.tip_radius_mm));
  const minHub = Math.min(...stages.map(s => s.hub_radius_mm));
  
  const toY = r => h - 30 - ((r - minHub) / Math.max(10, maxTip - minHub + 30)) * (h - 60);
  
  const tipCoords = stages.map((s, i) => [xStart + i * dx, toY(s.tip_radius_mm)]);
  const hubCoords = stages.map((s, i) => [xStart + i * dx, toY(s.hub_radius_mm)]);
  
  const tipPts = tipCoords.map(p => `${p[0]},${p[1]}`).join(" ");
  const hubPtsRev = [...hubCoords].reverse().map(p => `${p[0]},${p[1]}`).join(" ");
  const polygonPts = `${tipPts} ${hubPtsRev}`;
  
  return (
    <div className="card" style={{marginTop: 14}}>
      <div className="card-hd">Multi-Stage Annulus Flowpath (Casing Convergence)</div>
      <div className="card-bd" style={{background: "#11151c", padding: 10}}>
        <svg viewBox={`0 0 ${w} ${h}`} style={{width: "100%", maxHeight: 190}}>
          <polygon points={polygonPts} fill="rgba(56,217,169,0.12)" stroke="#38d9a9" strokeWidth="1.5" />
          <polyline points={tipPts} fill="none" stroke="#58a6ff" strokeWidth="2.5" />
          <polyline points={hubCoords.map(p => `${p[0]},${p[1]}`).join(" ")} fill="none" stroke="#e3b341" strokeWidth="2.5" />
          {stages.map((s, i) => {
            const x = xStart + i * dx;
            const yTip = toY(s.tip_radius_mm);
            const yHub = toY(s.hub_radius_mm);
            return (
              <g key={i}>
                <line x1={x} y1={yTip} x2={x} y2={yHub} stroke="rgba(255,255,255,0.3)" strokeDasharray="3,3" />
                <circle cx={x} cy={yTip} r="3.5" fill="#58a6ff" />
                <circle cx={x} cy={yHub} r="3.5" fill="#e3b341" />
                <text x={x} y={h - 10} fill="var(--muted)" fontSize="10" textAnchor="middle" fontFamily="var(--mono)">
                  S{s.stage_num}: {fmt(s.blade_height_mm, 1)}mm
                </text>
              </g>
            );
          })}
          <text x="25" y="25" fill="#58a6ff" fontSize="10" fontFamily="var(--mono)">── Outer Casing (Tip)</text>
          <text x="165" y="25" fill="#e3b341" fontSize="10" fontFamily="var(--mono)">── Inner Hub Contour</text>
        </svg>
      </div>
    </div>
  );
}

function MeanLinePanel() {
  const [mode, setMode] = useState("compressor"); // "compressor", "multistage", "turbine"
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  
  const [compParams, setCompParams] = useState({
    U: 350.0, C_a1: 180.0, C_a2: 175.0, alpha_1_deg: 0.0,
    beta_2_deg: 45.0, alpha_3_deg: 0.0, r_mean: 0.35,
    T01: 288.15, P01: 101325.0, mdot: 35.0, eta_stage: 0.89
  });
  
  const [multiParams, setMultiParams] = useState({
    num_stages: 5, U_mean: 350.0, C_a: 180.0, delta_T0_stage: 30.0,
    r_mean: 0.32, mdot: 40.0, T0_in: 288.15, P0_in: 101325.0, eta_stage: 0.89
  });
  
  const [turbParams, setTurbParams] = useState({
    U: 380.0, C_a: 200.0, alpha_1_deg: 0.0, alpha_2_deg: 65.0,
    beta_3_deg: -60.0, r_mean: 0.30, T01: 1450.0, P01: 1200000.0,
    mdot: 25.0, eta_stage: 0.91
  });
  
  const [result, setResult] = useState(null);
  
  const setComp = (k, v) => setCompParams(prev => ({ ...prev, [k]: v }));
  const setMulti = (k, v) => setMultiParams(prev => ({ ...prev, [k]: v }));
  const setTurb = (k, v) => setTurbParams(prev => ({ ...prev, [k]: v }));
  
  const solve = async () => {
    setLoading(true);
    setError(null);
    try {
      let endpoint = "/api/meanline/compressor_stage";
      let body = compParams;
      if (mode === "multistage") {
        endpoint = "/api/meanline/multistage_compressor";
        body = multiParams;
      } else if (mode === "turbine") {
        endpoint = "/api/meanline/turbine_stage";
        body = turbParams;
      }
      const res = await fetch(`${API}${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Meanline simulation failed");
      }
      const data = await res.json();
      setResult(data);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="grid">
      <div className="sidebar">
        <div className="mode-tog">
          <button className={`mode-btn ${mode==="compressor"?"active":""}`} onClick={()=>setMode("compressor")}>
            Compressor Stg
          </button>
          <button className={`mode-btn ${mode==="multistage"?"active":""}`} onClick={()=>setMode("multistage")}>
            Multi-Stage
          </button>
          <button className={`mode-btn ${mode==="turbine"?"active":""}`} onClick={()=>setMode("turbine")}>
            Turbine Stg
          </button>
        </div>

        {mode === "compressor" && (
          <>
            <div className="card">
              <div className="card-hd">Kinematics &amp; Aerodynamics</div>
              <div className="card-bd">
                <Slider label="Blade Speed U" unit="m/s" value={compParams.U} min={180} max={480} step={5} onChange={v=>setComp("U",v)} dp={0}/>
                <Slider label="Inlet Axial Vel C_a1" unit="m/s" value={compParams.C_a1} min={100} max={260} step={2} onChange={v=>setComp("C_a1",v)} dp={0}/>
                <Slider label="Exit Axial Vel C_a2" unit="m/s" value={compParams.C_a2} min={100} max={260} step={2} onChange={v=>setComp("C_a2",v)} dp={0}/>
                <Slider label="Inlet Swirl α₁" unit="deg" value={compParams.alpha_1_deg} min={-20} max={40} step={1} onChange={v=>setComp("alpha_1_deg",v)} dp={0}/>
                <Slider label="Rotor Exit Rel Angle β₂" unit="deg" value={compParams.beta_2_deg} min={20} max={65} step={1} onChange={v=>setComp("beta_2_deg",v)} dp={0}/>
                <Slider label="Stator Exit Swirl α₃" unit="deg" value={compParams.alpha_3_deg} min={-20} max={30} step={1} onChange={v=>setComp("alpha_3_deg",v)} dp={0}/>
              </div>
            </div>
            <div className="card">
              <div className="card-hd">Flow &amp; Annulus</div>
              <div className="card-bd">
                <Slider label="Mean Radius r_m" unit="m" value={compParams.r_mean} min={0.15} max={0.75} step={0.01} onChange={v=>setComp("r_mean",v)} dp={2}/>
                <Slider label="Mass Airflow ṁ" unit="kg/s" value={compParams.mdot} min={5} max={120} step={1} onChange={v=>setComp("mdot",v)} dp={0}/>
                <Slider label="Stage Efficiency η" unit="" value={compParams.eta_stage} min={0.75} max={0.96} step={0.005} onChange={v=>setComp("eta_stage",v)} dp={3}/>
              </div>
            </div>
          </>
        )}

        {mode === "multistage" && (
          <div className="card">
            <div className="card-hd">Multi-Stage Stacking Parameters</div>
            <div className="card-bd">
              <Num label="Number of Stages" unit="" value={multiParams.num_stages} min={2} max={12} onChange={v=>setMulti("num_stages",v)}/>
              <Slider label="Mean Blade Speed U" unit="m/s" value={multiParams.U_mean} min={200} max={450} step={5} onChange={v=>setMulti("U_mean",v)} dp={0}/>
              <Slider label="Axial Velocity C_a" unit="m/s" value={multiParams.C_a} min={120} max={250} step={2} onChange={v=>setMulti("C_a",v)} dp={0}/>
              <Slider label="Stage ΔT₀ Rise" unit="K" value={multiParams.delta_T0_stage} min={15} max={50} step={1} onChange={v=>setMulti("delta_T0_stage",v)} dp={0}/>
              <Slider label="Mean Radius r_m" unit="m" value={multiParams.r_mean} min={0.15} max={0.65} step={0.01} onChange={v=>setMulti("r_mean",v)} dp={2}/>
              <Slider label="Mass Flow ṁ" unit="kg/s" value={multiParams.mdot} min={10} max={100} step={1} onChange={v=>setMulti("mdot",v)} dp={0}/>
              <Slider label="Stage Efficiency η" unit="" value={multiParams.eta_stage} min={0.80} max={0.95} step={0.005} onChange={v=>setMulti("eta_stage",v)} dp={3}/>

          </div>
        )}

        {mode === "turbine" && (
          <div className="card">

            </div>
          </div>
        )}

        <button className="btn btn-ml" onClick={solve} disabled={loading}>
          {loading ? <><span className="spin"/>Calculating Aerodynamics…</> : "▶  Compute Mean-Line Design"}
        </button>
      </div>

      <div className="content">
        {error && <div className="alert a-err"><strong>Aerodynamics Error:</strong>&nbsp;{error}</div>}

        {!result && !loading && !error && (
          <div className="alert a-info">
            <strong>1D Mean-Line Aerodynamic Stage Design:</strong><br/>
            Solve velocity triangles, Euler work transfer (\u0394h₀ = U &middot; \u0394C_θ), flow &amp; work coefficients,

                  <div className="spec-row"><span>Inlet Abs Mach (M₁):</span><span>{fmt(result.rotor_inlet_triangle?.Mach_abs, 3)}</span></div>
                  <div className="spec-row"><span>Exit Abs Mach (M₂):</span><span>{fmt(result.rotor_exit_triangle?.Mach_abs, 3)}</span></div>
                </div>
                <div>
                  <div className="spec-row"><span>Stage Temp Rise ΔT₀:</span><span>{fmt(result.delta_T0, 2)} K</span></div>
                  <div className="spec-row"><span>Inlet Blade Height h₁:</span><span>{fmt(result.blade_height_inlet_mm, 1)} mm</span></div>
                  <div className="spec-row"><span>Exit Blade Height h₂:</span><span>{fmt(result.blade_height_exit_mm, 1)} mm</span></div>

        {result && mode === "multistage" && (
          <>
            <div className="kpi-strip">
              <KPI label="Total PR" value={fmt(result.total_PR, 2)} unit="" cls="hi-ml"/>
              <KPI label="Total Work" value={fmt(result.total_delta_h0_kJkg, 1)} unit="kJ/kg"/>
              <KPI label="Inlet T₀" value={fmt(result.T0_in, 1)} unit="K"/>
              <KPI label="Exit T₀" value={fmt(result.T0_out, 1)} unit="K"/>
              <KPI label="Inlet Blade H" value={fmt(result.stages?.[0]?.blade_height_mm, 1)} unit="mm"/>
              <KPI label="Exit Blade H" value={fmt(result.stages?.[result.stages.length-1]?.blade_height_mm, 1)} unit="mm"/>
            </div>

            <AnnulusSvg stages={result.stages} />

            <div className="card">
              <div className="card-hd">Multi-Stage Casing &amp; Annulus Geometry Table</div>
              <div className="card-bd" style={{padding: 0}}>
                <table className="st-table">
                  <thead>
                    <tr>
                      <th>Stg</th><th>T₀ Out [K]</th><th>P₀ Out [kPa]</th><th>Stage PR</th>
                      <th>ρ [kg/m³]</th><th>Annulus Area [m²]</th><th>Blade H [mm]</th><th>Hub/Tip</th>
                    </tr>
                  </thead>
                  <tbody>
                    {result.stages?.map(s => (
                      <tr key={s.stage_num}>
                        <td><strong>#{s.stage_num}</strong></td>
                        <td className={s.T0_out > 450 ? "hot" : "cool"}>{fmt(s.T0_out, 1)}</td>
                        <td>{fmt(s.P0_out / 1000, 1)}</td>
                        <td>{fmt(s.stage_PR, 3)}</td>

        {result && mode === "turbine" && (

              <KPI label="Work Extracted" value={fmt(result.delta_h0_kJkg, 1)} unit="kJ/kg"/>
              <KPI label="Reaction R" value={fmt(result.degree_of_reaction_R, 3)} unit=""/>

function TurbopropSweepCharts({ sweepData, param }) {
  const r1 = useRef(), r2 = useRef(), r3 = useRef(), r4 = useRef();
  const pts = sweepData?.points || [];

  const xLabel = param === "mach" ? "Flight Mach Number"
               : param === "altitude" ? "Altitude [m]"
               : param === "pi_c" ? "Compressor Pressure Ratio"
               : "Turbine Inlet Temperature [K]";

  const pwrPts = pts.map(p => ({ x: p.Mach ?? p.altitude_m ?? p.pi_c ?? p.T04, y: p.P_shaft_shp }));
  const psfcPts = pts.map(p => ({ x: p.Mach ?? p.altitude_m ?? p.pi_c ?? p.T04, y: p.PSFC_kg_kWh }));
  const thrustPts = pts.map(p => ({ x: p.Mach ?? p.altitude_m ?? p.pi_c ?? p.T04, y: p.total_thrust_kN }));
  const effPts = pts.map(p => ({ x: p.Mach ?? p.altitude_m ?? p.pi_c ?? p.T04, y: p.prop_eff * 100 }));

  const mkOpts = (xT, yT) => ({
    animation: false, responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { type: "linear", title: { display: true, text: xT, color: "#8b949e" }, ticks: { color: "#8b949e" }, grid: { color: "rgba(48,54,61,.6)" } },
      y: { title: { display: true, text: yT, color: "#8b949e" }, ticks: { color: "#8b949e" }, grid: { color: "rgba(48,54,61,.6)" } }
    }
  });

  const mkDs = (label, data, color) => ({
    label, data, borderColor: color, backgroundColor: "rgba(255,146,43,0.1)",
    fill: true, tension: 0.25, pointRadius: 3, showLine: true
  });

  useChart(r1, "line", pts.length ? { datasets: [mkDs("SHP", pwrPts, "#ff922b")] } : null, mkOpts(xLabel, "Shaft Horsepower [SHP]"));
  useChart(r2, "line", pts.length ? { datasets: [mkDs("PSFC", psfcPts, "#f78166")] } : null, mkOpts(xLabel, "PSFC [kg/(kW·h)]"));
  useChart(r3, "line", pts.length ? { datasets: [mkDs("Thrust", thrustPts, "#58a6ff")] } : null, mkOpts(xLabel, "Total Thrust [kN]"));
  useChart(r4, "line", pts.length ? { datasets: [mkDs("Prop Eff", effPts, "#3fb950")] } : null, mkOpts(xLabel, "Propeller Efficiency [%]"));

  if (!pts.length) return null;

  return (
    <div style={{display: "flex", flexDirection: "column", gap: 14}}>
      <div className="chart-grid">
        <div className="chart-card"><div className="chart-title">Shaft Horsepower [SHP]</div><canvas ref={r1}/></div>
        <div className="chart-card"><div className="chart-title">Power Specific Fuel Consumption [kg/(kW·h)]</div><canvas ref={r2}/></div>
      </div>
      <div className="chart-grid">
        <div className="chart-card"><div className="chart-title">Total Equivalent Thrust [kN]</div><canvas ref={r3}/></div>
        <div className="chart-card"><div className="chart-title">Propeller Efficiency [%]</div><canvas ref={r4}/></div>
      </div>
    </div>
  );
}

function TurbopropPanel() {
  const [mode, setMode] = useState("single");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const [p, setP] = useState({
    altitude_m: 4572.0, mach: 0.40, mdot_core: 3.8, pi_c: 16.0,
    T04: 1400.0, pi_pt: 3.5, eta_c: 0.86, eta_hpt: 0.89, eta_pt: 0.90,
    eta_gear: 0.985, eta_mech: 0.99, burner_dP: 0.04, prop_diameter_m: 3.2, rpm: 1500.0
  });

  const [sw, setSw] = useState({
    param: "mach", start_val: 0.1, end_val: 0.65, n_steps: 12
  });

  const [result, setResult] = useState(null);
  const [sweepData, setSweepData] = useState(null);

  const setParam = (k, v) => setP(prev => ({ ...prev, [k]: v }));
  const setSweep = (k, v) => setSw(prev => ({ ...prev, [k]: v }));

  const runSingle = async () => {
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(`${API}/api/turboprop/single`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(p)
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Turboprop calculation failed");
      }
      const data = await res.json();
      setResult(data);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const runSweep = async () => {
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(`${API}/api/turboprop/sweep`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          param: sw.param,
          start_val: sw.start_val,
          end_val: sw.end_val,
          n_steps: sw.n_steps,
          fixed_params: p
        })
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Turboprop sweep failed");
      }
      const data = await res.json();
      setSweepData(data);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="grid">
      <div className="sidebar">
        <div className="mode-tog">
          <button className={`mode-btn ${mode==="single"?"active":""}`} onClick={()=>setMode("single")}>Design Point</button>
          <button className={`mode-btn ${mode==="sweep"?"active":""}`} onClick={()=>setMode("sweep")}>Parametric Sweep</button>
        </div>

        <div className="card">
          <div className="card-hd">Flight Condition</div>
          <div className="card-bd">
            <Slider label="Altitude" unit="m" value={p.altitude_m} min={0} max={10000} step={250} onChange={v=>setParam("altitude_m",v)} dp={0}/>
            <Slider label="Flight Mach" unit="" value={p.mach} min={0.05} max={0.65} step={0.02} onChange={v=>setParam("mach",v)} dp={2}/>
          </div>
        </div>

        <div className="card">
          <div className="card-hd">Gas Generator Core</div>
          <div className="card-bd">
            <Slider label="Core Mass Flow" unit="kg/s" value={p.mdot_core} min={1.0} max={15.0} step={0.2} onChange={v=>setParam("mdot_core",v)} dp={1}/>
            <Slider label="Compressor PR π_c" unit="" value={p.pi_c} min={6} max={30} step={0.5} onChange={v=>setParam("pi_c",v)} dp={1}/>
            <Slider label="Turbine Inlet Temp T₀₄" unit="K" value={p.T04} min={1100} max={1650} step={10} onChange={v=>setParam("T04",v)} dp={0}/>
          </div>
        </div>

        <div className="card">
          <div className="card-hd">Free Power Turbine &amp; Propeller</div>
          <div className="card-bd">
            <Slider label="Power Turbine PR π_pt" unit="" value={p.pi_pt} min={1.5} max={7.0} step={0.1} onChange={v=>setParam("pi_pt",v)} dp={1}/>
            <Slider label="Propeller Diameter" unit="m" value={p.prop_diameter_m} min={1.8} max={4.5} step={0.1} onChange={v=>setParam("prop_diameter_m",v)} dp={1}/>
            <Slider label="Propeller RPM" unit="rpm" value={p.rpm} min={800} max={2200} step={50} onChange={v=>setParam("rpm",v)} dp={0}/>
            <Slider label="Gearbox Eff η_gear" unit="" value={p.eta_gear} min={0.92} max={0.995} step={0.005} onChange={v=>setParam("eta_gear",v)} dp={3}/>
          </div>
        </div>

        {mode === "sweep" && (
          <div className="card">
            <div className="card-hd">Sweep Setup</div>
            <div className="card-bd">
              <div className="field">
                <label>Sweep Variable</label>
                <select value={sw.param} onChange={e=>{
                  const v = e.target.value;
                  setSweep("param", v);
                  if (v === "mach") { setSweep("start_val", 0.1); setSweep("end_val", 0.65); }
                  else if (v === "altitude") { setSweep("start_val", 0); setSweep("end_val", 9000); }
                  else if (v === "pi_c") { setSweep("start_val", 8); setSweep("end_val", 28); }
                  else if (v === "T04") { setSweep("start_val", 1150); setSweep("end_val", 1600); }
                }}>
                  <option value="mach">Flight Mach</option>
                  <option value="altitude">Altitude [m]</option>
                  <option value="pi_c">Compressor PR</option>
                  <option value="T04">TIT [K]</option>
                </select>
              </div>
              <div className="row2">
                <Num label="Start" unit="" value={sw.start_val} min={0} max={10000} step={sw.param==="mach"?0.05:10} onChange={v=>setSweep("start_val",v)} dp={sw.param==="mach"?2:0}/>
                <Num label="End" unit="" value={sw.end_val} min={0} max={10000} step={sw.param==="mach"?0.05:10} onChange={v=>setSweep("end_val",v)} dp={sw.param==="mach"?2:0}/>
              </div>
              <Num label="Steps" unit="" value={sw.n_steps} min={5} max={20} onChange={v=>setSweep("n_steps",v)}/>
            </div>
          </div>
        )}

        <button className="btn btn-tp" onClick={mode==="single"?runSingle:runSweep} disabled={loading}>
          {loading ? <><span className="spin"/>Evaluating Cycle…</> : mode==="single" ? "▶  Simulate Turboprop Cycle" : "▶  Run Turboprop Sweep"}
        </button>
      </div>

      <div className="content">
        {error && <div className="alert a-err"><strong>Turboprop Error:</strong>&nbsp;{error}</div>}

        {!result && !sweepData && !loading && !error && (
          <div className="alert a-info">
            <strong>Turboprop &amp; Turboshaft Brayton Cycle Variant:</strong><br/>
            Gas generator core drives compressor work balance; free Power Turbine extracts shaft torque
            coupled to a variable-efficiency propeller model and residual jet expansion.
          </div>
        )}

        {loading && (
          <div className="alert a-warn">
            <span className="spin" style={{color:"#ff922b"}}/>&nbsp;
            Running Cantera combustion equilibrium and shaft work extraction…
          </div>
        )}

        {result && mode === "single" && (
          <>
            <div className="kpi-strip">
              <KPI label="Shaft Power" value={fmt(result.P_shaft_kW, 1)} unit="kW" cls="hi-tp"/>
              <KPI label="Shaft HP" value={fmt(result.P_shaft_shp, 1)} unit="SHP" cls="hi-tp"/>
              <KPI label="Equiv SHP" value={fmt(result.ESHP, 1)} unit="ESHP"/>
              <KPI label="Prop Thrust" value={fmt(result.propeller_thrust_N / 1000, 2)} unit="kN"/>
              <KPI label="Jet Thrust" value={fmt(result.jet_thrust_N / 1000, 2)} unit="kN"/>
              <KPI label="Total Thrust" value={fmt(result.total_thrust_N / 1000, 2)} unit="kN"/>
              <KPI label="PSFC" value={fmt(result.PSFC_kg_kWh, 3)} unit="kg/(kW·h)"/>
              <KPI label="Prop Efficiency" value={fmt(result.propeller_efficiency * 100, 1)} unit="%"/>
            </div>

            <div className="card">
              <div className="card-hd">Turboshaft Power Balance &amp; Torque Extraction</div>
              <div className="card-bd" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, fontSize:12}}>
                <div>
                  <div className="spec-row"><span>Compressor Required Work:</span><span>{fmt(result.core_compressor_work_kW, 1)} kW</span></div>
                  <div className="spec-row"><span>Core HPT Work Extraction:</span><span>{fmt(result.core_hpt_work_kW, 1)} kW</span></div>
                  <div className="spec-row"><span>Free PT Power Extraction:</span><span>{fmt(result.power_turbine_work_kW, 1)} kW</span></div>
                </div>
                <div>
                  <div className="spec-row"><span>Propeller Shaft Torque:</span><span>{fmt(result.torque_Nm, 1)} N·m</span></div>
                  <div className="spec-row"><span>Fuel Mass Flow Rate:</span><span>{fmt(result.mdot_fuel_kg_s * 3600, 1)} kg/h</span></div>
                  <div className="spec-row"><span>Combustor Equivalence Ratio Φ:</span><span>{fmt(result.combustion_metrics?.equivalence_ratio, 3)}</span></div>
                </div>
              </div>
            </div>

            <div className="card">
              <div className="card-hd">Turboprop Station Flow Thermodynamics</div>
              <div className="card-bd" style={{padding:0}}>
                <StationTable stations={result.stations} />
              </div>
            </div>
          </>
        )}

        {sweepData && mode === "sweep" && (
          <TurbopropSweepCharts sweepData={sweepData} param={sweepData.param} />
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════

function MissionProfileChart({ phases }) {
  const rAlt = useRef(), rFuel = useRef();
  
  const altPts = [];
  const wtPts = [];
  let cumTime = 0;
  
  if (phases && phases.length) {
    phases.forEach((ph, i) => {
      if (i === 0) {
        altPts.push({ x: 0, y: ph.altitude_start_m });
        wtPts.push({ x: 0, y: ph.start_weight_kg });
      }
      cumTime += ph.duration_min;
      altPts.push({ x: cumTime, y: ph.altitude_end_m });
      wtPts.push({ x: cumTime, y: ph.end_weight_kg });
    });
  }

  const mkOpts = (xT, yT) => ({
    animation: false, responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { type: "linear", title: { display: true, text: xT, color: "#8b949e" }, ticks: { color: "#8b949e" }, grid: { color: "rgba(48,54,61,.6)" } },
      y: { title: { display: true, text: yT, color: "#8b949e" }, ticks: { color: "#8b949e" }, grid: { color: "rgba(48,54,61,.6)" } }
    }
  });

  useChart(rAlt, "line", altPts.length ? {
    datasets: [{ label: "Altitude", data: altPts, borderColor: "#b197fc", backgroundColor: "rgba(177,151,252,0.12)", fill: true, tension: 0.1, pointRadius: 4, showLine: true }]
  } : null, mkOpts("Mission Time [min]", "Altitude [m]"));

  useChart(rFuel, "line", wtPts.length ? {
    datasets: [{ label: "Aircraft Weight", data: wtPts, borderColor: "#f06595", backgroundColor: "rgba(240,101,149,0.12)", fill: true, tension: 0.1, pointRadius: 4, showLine: true }]
  } : null, mkOpts("Mission Time [min]", "Aircraft Gross Weight [kg]"));

  return (
    <div className="chart-grid">
      <div className="chart-card"><div className="chart-title">Flight Altitude Profile</div><canvas ref={rAlt}/></div>
      <div className="chart-card"><div className="chart-title">Gross Weight &amp; Fuel Burn Tracking</div><canvas ref={rFuel}/></div>
    </div>
  );
}

  const opts = {

function MissionPanel() {
  const [acType, setAcType] = useState("generic_twin");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const [p, setP] = useState({

    loiter_time_min: 45.0
  });

  const [result, setResult] = useState(null);

  const setParam = (k, v) => setP(prev => ({ ...prev, [k]: v }));

  const runMission = async () => {
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(`${API}/api/mission/simulate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },

          cruise_alt_m: p.cruise_alt_m,
          cruise_mach: p.cruise_mach,
          cruise_dist_km: p.cruise_dist_km,
          loiter_time_min: p.loiter_time_min
        })
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Mission simulation failed");
      }
      const data = await res.json();
      setResult(data);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="grid">
      <div className="sidebar">
        <div className="card">

          <div className="card-bd">

            </div>
            <Slider label="Payload Weight" unit="kg" value={p.payload_kg} min={1000} max={acType==="generic_twin"?13000:45000} step={500} onChange={v=>setParam("payload_kg",v)} dp={0}/>

        </div>

        <div className="card">

          <div className="card-bd">
            <Slider label="Cruise Distance" unit="km" value={p.cruise_dist_km} min={400} max={acType==="generic_twin"?4500:12000} step={100} onChange={v=>setParam("cruise_dist_km",v)} dp={0}/>
            <Slider label="Cruise Altitude" unit="m" value={p.cruise_alt_m} min={6000} max={12500} step={250} onChange={v=>setParam("cruise_alt_m",v)} dp={0}/>
            <Slider label="Cruise Mach" unit="" value={p.cruise_mach} min={0.65} max={0.85} step={0.01} onChange={v=>setParam("cruise_mach",v)} dp={2}/>
            <Slider label="Reserve Loiter Time" unit="min" value={p.loiter_time_min} min={20} max={60} step={5} onChange={v=>setParam("loiter_time_min",v)} dp={0}/>
          </div>
        </div>

        <button className="btn btn-ms" onClick={runMission} disabled={loading}>
          {loading ? <><span className="spin"/>Simulating Mission…</> : "▶  Fly Mission Profile"}
        </button>
      </div>

      <div className="content">
        {error && <div className="alert a-err"><strong>Mission Error:</strong>&nbsp;{error}</div>}

        {!result && !loading && !error && (
          <div className="alert a-info">
            <strong>6-Phase Aircraft Mission Fuel Burn &amp; Payload-Range Envelope:</strong><br/>
            Simulate Taxi-out → Takeoff → Climb → Cruise → Descent → 45-min Loiter with coupled aircraft polar drag
            matching and numerical fuel burn integration.
          </div>
        )}

        {loading && (
          <div className="alert a-warn">
            <span className="spin" style={{color:"#b197fc"}}/>&nbsp;
            Integrating phase fuel burns &amp; aerodynamic drag polar…
          </div>
        )}

        {result && (
          <>
            <div className="kpi-strip">
              <KPI label="Total Fuel Burn" value={fmt(result.summary?.total_fuel_burn_kg, 1)} unit="kg" cls="hi-ms"/>
              <KPI label="Block Fuel" value={fmt(result.summary?.block_fuel_kg, 1)} unit="kg"/>
              <KPI label="Reserve Fuel" value={fmt(result.summary?.reserve_fuel_kg, 1)} unit="kg"/>
              <KPI label="Flight Time" value={`${fmt(result.summary?.total_flight_time_hr, 2)} h (${fmt(result.summary?.total_flight_time_min, 0)} min)`} unit=""/>
              <KPI label="Cruise TSFC" value={fmt(result.summary?.average_cruise_TSFC, 2)} unit="g/(kN·s)"/>
              <KPI label="Breguet Check" value={fmt(result.summary?.breguet_cruise_range_km, 0)} unit="km"/>
            </div>

            <MissionProfileChart phases={result.phases} />

            <PayloadRangeChart envelope={result.payload_range_envelope} currentPoint={result.current_mission_point} />

            <div className="card">
              <div className="card-hd">Mission Flight Phases Breakdown</div>
              <div className="card-bd" style={{padding: 0}}>
                <table className="st-table">
                  <thead>
                    <tr>
                      <th>Phase</th><th>Duration [min]</th><th>Distance [km]</th><th>Fuel Burn [kg]</th>
                      <th>Start Wt [kg]</th><th>End Wt [kg]</th><th>Thrust/Eng [kN]</th><th>TSFC [g/kN·s]</th>
                    </tr>
                  </thead>
                  <tbody>
                    {result.phases?.map((ph, idx) => (
                      <tr key={idx}>
                        <td><strong>{ph.phase}</strong></td>
                        <td>{fmt(ph.duration_min, 1)}</td>
                        <td>{fmt(ph.distance_km, 1)}</td>
                        <td><strong style={{color:"#f06595"}}>{fmt(ph.fuel_burned_kg, 1)}</strong></td>
                        <td>{fmt(ph.start_weight_kg, 0)}</td>
                        <td>{fmt(ph.end_weight_kg, 0)}</td>
                        <td>{fmt(ph.thrust_per_eng_kN, 1)}</td>
                        <td>{fmt(ph.TSFC_g_kNs, 2)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════

function SurrogateCurveChart({ points, xLabel, yLabel }) {
  const rRef = useRef();
  const ds = points ? [{
    label: yLabel,
    data: points.map(p => ({ x: p.x, y: p.y })),
    borderColor: "#f06595",
    backgroundColor: "rgba(240,101,149,0.12)",
    fill: true,
    tension: 0.25,
    pointRadius: 3,
    showLine: true
  }] : [];

  const opts = {
    animation: false, responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { type: "linear", title: { display: true, text: xLabel, color: "#8b949e" }, ticks: { color: "#8b949e" }, grid: { color: "rgba(48,54,61,.6)" } },
      y: { title: { display: true, text: yLabel, color: "#8b949e" }, ticks: { color: "#8b949e" }, grid: { color: "rgba(48,54,61,.6)" } }
    }
  };

  useChart(rRef, "line", ds.length ? { datasets: ds } : null, opts);

  return (
    <div className="chart-card">
      <div className="chart-title">Response Surface: {yLabel} vs {xLabel}</div>
      <canvas ref={rRef}/>
    </div>
  );
}

function SurrogatePanel() {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const [p, setP] = useState({
    altitude_m: 5000.0,
    mach: 0.50,
    throttle: 0.80,
    cpr: 20.0,
    tit_K: 1500.0
  });

  const [surfOpts, setSurfOpts] = useState({
    x_param: "throttle",
    y_param: "thrust_kN"
  });

  const [pred, setPred] = useState(null);
  const [surfaceData, setSurfaceData] = useState(null);

  const setParam = (k, v) => setP(prev => ({ ...prev, [k]: v }));

  const evaluatePoint = async () => {
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(`${API}/api/surrogate/predict`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(p)
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Surrogate evaluation failed");
      }
      const data = await res.json();
      setPred(data);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const generateSurface = async () => {
    setLoading(true);
    setError(null);
    try {
      let xMin = 0.3, xMax = 1.0;
      if (surfOpts.x_param === "altitude_m") { xMin = 0; xMax = 11000; }
      else if (surfOpts.x_param === "mach") { xMin = 0.05; xMax = 0.85; }
      else if (surfOpts.x_param === "throttle") { xMin = 0.3; xMax = 1.0; }
      else if (surfOpts.x_param === "cpr") { xMin = 10.0; xMax = 35.0; }
      else if (surfOpts.x_param === "tit_K") { xMin = 1200.0; xMax = 1750.0; }

      const res = await fetch(`${API}/api/surrogate/surface`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          x_param: surfOpts.x_param,
          y_param: surfOpts.y_param,
          x_min: xMin,
          x_max: xMax,
          n_points: 30,
          fixed_params: p
        })
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Surface generation failed");
      }
      const data = await res.json();
      setSurfaceData(data);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  // Evaluate initial point on load
  useEffect(() => {
    evaluatePoint();
  }, []);

  return (
    <div className="grid">
      <div className="sidebar">
        <div className="card">
          <div className="card-hd">5D State Vector Query</div>
          <div className="card-bd">
            <Slider label="Altitude" unit="m" value={p.altitude_m} min={0} max={11000} step={250} onChange={v=>setParam("altitude_m",v)} dp={0}/>
            <Slider label="Flight Mach" unit="" value={p.mach} min={0.05} max={0.85} step={0.02} onChange={v=>setParam("mach",v)} dp={2}/>
            <Slider label="Throttle Setting" unit="" value={p.throttle} min={0.30} max={1.00} step={0.02} onChange={v=>setParam("throttle",v)} dp={2}/>
            <Slider label="Compressor PR" unit="" value={p.cpr} min={10.0} max={35.0} step={0.5} onChange={v=>setParam("cpr",v)} dp={1}/>
            <Slider label="Turbine Temp (TIT)" unit="K" value={p.tit_K} min={1200} max={1750} step={10} onChange={v=>setParam("tit_K",v)} dp={0}/>
          </div>
        </div>

        <button className="btn btn-sg" onClick={evaluatePoint} disabled={loading}>
          {loading ? <><span className="spin"/>Predicting…</> : "⚡ Evaluate State Vector (< 0.2 ms)"}
        </button>

        <div className="card" style={{marginTop: 10}}>
          <div className="card-hd">Response Surface Generator</div>
          <div className="card-bd">
            <div className="field">
              <label>X Variable</label>
              <select value={surfOpts.x_param} onChange={e=>setSurfOpts(prev=>({...prev, x_param: e.target.value}))}>
                <option value="throttle">Throttle Setting</option>
                <option value="mach">Flight Mach</option>
                <option value="altitude_m">Altitude [m]</option>
                <option value="cpr">Compressor PR</option>
                <option value="tit_K">Turbine Temp [K]</option>
              </select>
            </div>
            <div className="field">
              <label>Y Response Metric</label>
              <select value={surfOpts.y_param} onChange={e=>setSurfOpts(prev=>({...prev, y_param: e.target.value}))}>
                <option value="thrust_kN">Net Thrust [kN]</option>
                <option value="tsfc">TSFC [g/(kN·s)]</option>
                <option value="air_flow_kg_s">Mass Airflow [kg/s]</option>
                <option value="fuel_flow_kg_s">Fuel Flow [kg/s]</option>
                <option value="EI_NOx_g_kg">Emissions EI NOx [g/kg]</option>
              </select>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={generateSurface} disabled={loading}>
              Generate 2D Response Surface Curve
            </button>
          </div>
        </div>
      </div>

      <div className="content">
        {error && <div className="alert a-err"><strong>Surrogate Error:</strong>&nbsp;{error}</div>}

        <div className="alert a-ok" style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
          <span>
            <strong>⚡ High-Speed Response Surface:</strong> 2nd-order polynomial model with full interaction cross-terms.
            Trained on high-fidelity multi-stage Cantera cycle simulations.
          </span>
          <span className="badge" style={{background:"rgba(255,255,255,0.2)", padding:"4px 8px"}}>
            Latency: {pred?.evaluation_time_ms ? `${fmt(pred.evaluation_time_ms, 2)} ms` : "< 0.2 ms"}
          </span>
        </div>

        {pred && (
          <>
            <div className="kpi-strip">
              <KPI label="Net Thrust" value={fmt(pred.thrust_kN, 2)} unit="kN" cls="hi-sg"/>
              <KPI label="TSFC" value={fmt(pred.tsfc, 2)} unit="g/(kN·s)"/>
              <KPI label="Airflow" value={fmt(pred.air_flow_kg_s, 1)} unit="kg/s"/>
              <KPI label="Fuel Flow" value={fmt(pred.fuel_flow_kg_s, 3)} unit="kg/s"/>
              <KPI label="EI NOx" value={fmt(pred.EI_NOx_g_kg, 1)} unit="g/kg"/>
            </div>

            <div className="card">
              <div className="card-hd">Query Vector State</div>
              <div className="card-bd" style={{display:"flex", gap:20, fontSize:12}}>
                <div><strong>Altitude:</strong> {fmt(pred.altitude_m, 0)} m</div>
                <div><strong>Mach:</strong> {fmt(pred.mach, 2)}</div>
                <div><strong>Throttle:</strong> {fmt(pred.throttle, 2)}</div>
                <div><strong>CPR:</strong> {fmt(pred.cpr, 1)}</div>
                <div><strong>TIT:</strong> {fmt(pred.tit_K, 0)} K</div>
              </div>
            </div>
          </>
        )}

        {surfaceData && (
          <SurrogateCurveChart
            points={surfaceData.points}
            xLabel={surfOpts.x_param}
            yLabel={surfOpts.y_param}
          />
        )}
      </div>
    </div>
  );
}

function BatterySocGauge({ soc, capacity_kWh, c_rate, mass_kg, sp_energy }) {

  return (
    <div className="card" style={{marginTop: 10}}>

        <div style={{display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 700}}>
          <span>SoC: <strong style={{color: fillColor, fontSize: 15, fontFamily: "var(--mono)"}}>{fmt(pct, 1)}%</strong></span>
          <span style={{color: "var(--muted)", fontSize: 11}}>Reserve Threshold: 20%</span>

        <div className="batt-bar-bg">
          <div className="batt-marker" style={{left: "20%"}} title="20% Safety Reserve Threshold"/>
          <div className="batt-bar-fill" style={{width: `${pct}%`, background: fillColor}}/>
        </div>

        <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, fontSize: 11}}>
          <div className="spec-row"><span>Energy Stored:</span><span>{fmt(capacity_kWh * soc, 1)} / {fmt(capacity_kWh, 1)} kWh</span></div>
          <div className="spec-row"><span>Discharge C-rate:</span><span>{fmt(c_rate, 2)} C</span></div>
          <div className="spec-row"><span>Pack Mass:</span><span>{fmt(mass_kg, 0)} kg</span></div>
          <div className="spec-row"><span>Specific Energy:</span><span>{fmt(sp_energy, 0)} Wh/kg</span></div>

  );
}

function HybridMissionProfileChart({ phases }) {
  const rRef = useRef();
  
  const altPts = [];
  const socPts = [];
  let cumTime = 0;

  if (phases && phases.length) {
    phases.forEach((ph, idx) => {
      if (idx === 0) {
        altPts.push({ x: 0, y: 0 });
        socPts.push({ x: 0, y: 100 });
      }
      cumTime += ph.duration_min;
      const alt = ph.phase === "Taxi-out" ? 0 : ph.phase === "Takeoff" ? 150 : ph.phase === "Climb" ? 5500 : ph.phase === "Cruise" ? 9144 : ph.phase === "Descent" ? 3600 : 1500;
      altPts.push({ x: cumTime, y: alt });
      socPts.push({ x: cumTime, y: ph.end_soc * 100 });
    });
  }

  const datasets = [
    {
      label: "Altitude [m]",
      data: altPts,
      borderColor: "#58a6ff",
      backgroundColor: "rgba(88,166,255,0.08)",
      yAxisID: "yAlt",
      fill: true,
      tension: 0.1,
      pointRadius: 4,
      showLine: true,
    },
    {
      label: "Battery SoC [%]",
      data: socPts,
      borderColor: "#20c997",
      backgroundColor: "rgba(32,201,151,0.08)",
      yAxisID: "ySoC",
      fill: false,
      tension: 0.1,
      pointRadius: 4,
      showLine: true,
    }
  ];

  const opts = {
    animation: false, responsive: true,
    plugins: { legend: { display: true, labels: { color: "#8b949e" } } },
    scales: {
      x: { type: "linear", title: { display: true, text: "Mission Time [min]", color: "#8b949e" }, ticks: { color: "#8b949e" }, grid: { color: "rgba(48,54,61,.6)" } },
      yAlt: { type: "linear", position: "left", title: { display: true, text: "Altitude [m]", color: "#58a6ff" }, ticks: { color: "#58a6ff" }, grid: { color: "rgba(48,54,61,.6)" } },
      ySoC: { type: "linear", position: "right", min: 0, max: 100, title: { display: true, text: "Battery SoC [%]", color: "#20c997" }, ticks: { color: "#20c997" }, grid: { drawOnChartArea: false } }
    }
  };

  useChart(rRef, "line", phases?.length ? { datasets } : null, opts);

  return (
    <div className="chart-card">
      <div className="chart-title">Hybrid Mission Altitude &amp; Battery SoC Depletion Profile</div>
      <canvas ref={rRef}/>
    </div>
  );
}

function HybridTradeStudyChart({ points, xLabel }) {
  const rRef = useRef();

  const ds = points ? [
    {
      label: "Net Fuel Savings [%]",
      data: points.map(p => ({ x: p.x, y: p.fuel_saved_percent })),
      borderColor: "#20c997",
      backgroundColor: "rgba(32,201,151,0.15)",
      fill: true,
      tension: 0.25,
      pointRadius: 4,
      showLine: true,
    }
  ] : [];

  const opts = {
    animation: false, responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { type: "linear", title: { display: true, text: xLabel, color: "#8b949e" }, ticks: { color: "#8b949e" }, grid: { color: "rgba(48,54,61,.6)" } },
      y: { title: { display: true, text: "Net Mission Fuel Savings [%]", color: "#8b949e" }, ticks: { color: "#8b949e" }, grid: { color: "rgba(48,54,61,.6)" } }
    }
  };

  useChart(rRef, "line", ds.length ? { datasets: ds } : null, opts);

  return (
    <div className="chart-card">
      <div className="chart-title">Trade Study: Fuel Savings vs {xLabel}</div>
      <canvas ref={rRef}/>
    </div>
  );
}

      <header>
        <div className="h-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc1)" strokeWidth="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2c-3 3-4 6-4 10s1 7 4 10"/>
          </svg>
          Gas Turbine Simulator
          <span className="h-sub">
            {apiOk==="online"   && <span style={{color:"var(--acc2)"}}>● API online</span>}
            {apiOk==="offline"  && <span style={{color:"#f78166"}}>● API offline — run start.sh (see SETUP_GUIDE.md)</span>}
            {apiOk==="checking" && <span style={{color:"var(--muted)"}}>● checking…</span>}
          </span>
        </div>

        
        
        <div className="eng-tabs">
          <button className={`eng-tab ${engine==="turbojet"?"tj":""}`} onClick={()=>setEngine("turbojet")}>
            ✈ Turbojet
          </button>
          <button className={`eng-tab ${engine==="physics_tf"?"tj":""}`} onClick={()=>setEngine("physics_tf")}>
            ✈ Physics Turbofan
          </button>
          <button className={`eng-tab ${engine==="turbofan"?"tf":""}`} onClick={()=>setEngine("turbofan")}>
            ✈ CF34 Turbofan
          </button>
          <button className={`eng-tab ${engine==="off_design"?"od":""}`} onClick={()=>setEngine("off_design")}>
            ⚙ Off-Design
          </button>
          <button className={`eng-tab ${engine==="meanline"?"ml":""}`} onClick={()=>setEngine("meanline")}>
            📐 Mean-Line
          </button>
          <button className={`eng-tab ${engine==="turboprop"?"tp":""}`} onClick={()=>setEngine("turboprop")}>
            🚁 Turboprop
          </button>
          <button className={`eng-tab ${engine==="mission"?"ms":""}`} onClick={()=>setEngine("mission")}>
            🛫 Mission
          </button>
          <button className={`eng-tab ${engine==="surrogate"?"sg":""}`} onClick={()=>setEngine("surrogate")}>
            ⚡ Surrogate
          </button>
          <button className={`eng-tab ${engine==="hybrid"?"hy":""}`} onClick={()=>setEngine("hybrid")}>
            ⚡ Hybrid Electric
          </button>
        </div>
      </header>

      {engine==="turbojet" ? <TurbojetPanel/>
        : engine==="physics_tf" ? <PhysicsTurbofanPanel/>
        : engine==="turbofan" ? <TurbofanPanel/>
        : engine==="off_design" ? <OffDesignPanel/>
        : engine==="meanline" ? <MeanLinePanel/>
        : engine==="turboprop" ? <TurbopropPanel/>
        : engine==="mission" ? <MissionPanel/>
        : engine==="surrogate" ? <SurrogatePanel/>
        : <HybridPanel/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
