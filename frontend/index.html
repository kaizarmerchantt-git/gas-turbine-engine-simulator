        beta_3_deg: -60.0, r_mean: 0.30, T01: 1450.0, P01: 1200000.0,
        mdot: 25.0, eta_stage: 0.91
      });

      const [result, setResult] = useState(null);

      const setComp = (k, v) => setCompParams(prev => ({ ...prev, [k]: v }));
      const setMulti = (k, v) => setMultiParams(prev => ({ ...prev, [k]: v }));
      const setTurb = (k, v) => setTurbParams(prev => ({ ...prev, [k]: v }));

      const solve = async () => {
        setLoading(true); setError(null);
        try {
          let endpoint = "/api/meanline/compressor_stage";
          let body = compParams;
          if (mode === "multistage") {
            endpoint = "/api/meanline/multistage_compressor";
            body = multiParams;
          } else if (mode === "turbine") {
            endpoint = "/api/meanline/turbine_stage";
            body = turbParams;
          }
          const res = await fetch(`${API}${endpoint}`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
          });
          if (!res.ok) throw new Error((await res.json()).detail || "Aero calculation failed");
          setResult(await res.json());
        } catch (e) { setError(e.message); }
        setLoading(false);
      };

      // LIVE REACTIVE SOLVE: Triggers immediately on any slider move or mode toggle
      useEffect(() => {
        solve();
      }, [
        mode,
        compParams.U, compParams.C_a1, compParams.C_a2, compParams.alpha_1_deg, compParams.beta_2_deg, compParams.alpha_3_deg, compParams.r_mean, compParams.mdot, compParams.eta_stage,
        multiParams.num_stages, multiParams.U_mean, multiParams.C_a, multiParams.delta_T0_stage, multiParams.r_mean, multiParams.mdot, multiParams.eta_stage,
        turbParams.U, turbParams.C_a, turbParams.alpha_2_deg, turbParams.beta_3_deg, turbParams.T01, turbParams.eta_stage
      ]);

      return (
        <div className="fui-grid">
          <div className="fui-sidebar">
            <div className="hud-mode-tog">
              <button className={`hud-mode-btn ${mode==="compressor"?"active":""}`} onClick={()=>setMode("compressor")}>[COMP STG]</button>
              <button className={`hud-mode-btn ${mode==="multistage"?"active":""}`} onClick={()=>setMode("multistage")}>[MULTI-STG]</button>
              <button className={`hud-mode-btn ${mode==="turbine"?"active":""}`} onClick={()=>setMode("turbine")}>[TURB STG]</button>
            </div>

            {mode === "compressor" && (
              <div className="hud-card">
                <div className="hud-hd"><span>[KIN-COMP] COMPRESSOR KINEMATICS</span><span className="hud-hd-tag">LIVE DYNAMICS</span></div>
                <div className="hud-bd">
                  <HudSlider label="BLADE SPEED U" unit="M/S" value={compParams.U} min={180} max={480} step={5} onChange={v=>setComp("U",v)} dp={0}/>
                  <HudSlider label="INLET AXIAL VEL C_a1" unit="M/S" value={compParams.C_a1} min={100} max={260} step={2} onChange={v=>setComp("C_a1",v)} dp={0}/>
                  <HudSlider label="EXIT AXIAL VEL C_a2" unit="M/S" value={compParams.C_a2} min={100} max={260} step={2} onChange={v=>setComp("C_a2",v)} dp={0}/>
                  <HudSlider label="INLET SWIRL α₁" unit="DEG" value={compParams.alpha_1_deg} min={-20} max={40} step={1} onChange={v=>setComp("alpha_1_deg",v)} dp={0}/>
                  <HudSlider label="ROTOR EXIT REL ANGLE β₂" unit="DEG" value={compParams.beta_2_deg} min={20} max={65} step={1} onChange={v=>setComp("beta_2_deg",v)} dp={0}/>
                  <HudSlider label="STATOR SWIRL α₃" unit="DEG" value={compParams.alpha_3_deg} min={-20} max={30} step={1} onChange={v=>setComp("alpha_3_deg",v)} dp={0}/>
                  <HudSlider label="MEAN RADIUS r_m" unit="M" value={compParams.r_mean} min={0.15} max={0.75} step={0.01} onChange={v=>setComp("r_mean",v)} dp={2}/>
                  <HudSlider label="MASS FLOW ṁ" unit="KG/S" value={compParams.mdot} min={5} max={120} step={1} onChange={v=>setComp("mdot",v)} dp={0}/>
                </div>
              </div>
            )}

            {mode === "multistage" && (
              <div className="hud-card">
                <div className="hud-hd"><span>[STACK-01] ANNULUS CASING STACKING</span><span className="hud-hd-tag">N-STAGES</span></div>
                <div className="hud-bd">
                  <HudNum label="NUMBER OF STAGES" unit="" value={multiParams.num_stages} min={2} max={12} onChange={v=>setMulti("num_stages",v)}/>
                  <HudSlider label="MEAN BLADE SPEED U" unit="M/S" value={multiParams.U_mean} min={200} max={450} step={5} onChange={v=>setMulti("U_mean",v)} dp={0}/>
                  <HudSlider label="AXIAL VELOCITY Ca" unit="M/S" value={multiParams.C_a} min={120} max={250} step={2} onChange={v=>setMulti("C_a",v)} dp={0}/>
                  <HudSlider label="STAGE ΔT₀ RISE" unit="K" value={multiParams.delta_T0_stage} min={15} max={50} step={1} onChange={v=>setMulti("delta_T0_stage",v)} dp={0}/>
                  <HudSlider label="MEAN RADIUS r_m" unit="M" value={multiParams.r_mean} min={0.15} max={0.65} step={0.01} onChange={v=>setMulti("r_mean",v)} dp={2}/>
                  <HudSlider label="MASS FLOW ṁ" unit="KG/S" value={multiParams.mdot} min={10} max={100} step={1} onChange={v=>setMulti("mdot",v)} dp={0}/>
                </div>
              </div>
            )}

            {mode === "turbine" && (
              <div className="hud-card">
                <div className="hud-hd"><span>[TURB-AERO] AXIAL TURBINE STAGE</span><span className="hud-hd-tag">ZWEIFEL CRIT</span></div>
                <div className="hud-bd">
                  <HudSlider label="BLADE SPEED U" unit="M/S" value={turbParams.U} min={250} max={500} step={5} onChange={v=>setTurb("U",v)} dp={0}/>
                  <HudSlider label="AXIAL VELOCITY Ca" unit="M/S" value={turbParams.C_a} min={140} max={300} step={5} onChange={v=>setTurb("C_a",v)} dp={0}/>
                  <HudSlider label="NOZZLE EXIT ANGLE α₂" unit="DEG" value={turbParams.alpha_2_deg} min={45} max={75} step={1} onChange={v=>setTurb("alpha_2_deg",v)} dp={0}/>
                  <HudSlider label="ROTOR EXIT ANGLE β₃" unit="DEG" value={turbParams.beta_3_deg} min={-75} max={-40} step={1} onChange={v=>setTurb("beta_3_deg",v)} dp={0}/>
                  <HudSlider label="INLET TOTAL TEMP T₀₁" unit="K" value={turbParams.T01} min={1100} max={1800} step={10} onChange={v=>setTurb("T01",v)} dp={0}/>
                </div>
              </div>
            )}
          </div>

          <div className="fui-content">
            {error && <div className="hud-alert warn"><strong>[ERROR-ALERT]</strong> {error}</div>}

            {result && mode === "compressor" && (
              <>
                <div className="hud-kpi-grid">
                  <div className="hud-kpi active"><div className="hud-kpi-lbl">STAGE PR</div><div className="hud-kpi-val">{fmt(result.stage_PR,3)}</div></div>
                  <div className="hud-kpi"><div className="hud-kpi-lbl">EULER WORK Δh₀</div><div className="hud-kpi-val">{fmt(result.delta_h0_kJkg,1)}<span className="hud-kpi-unit">kJ/kg</span></div></div>
                  <div className="hud-kpi"><div className="hud-kpi-lbl">REACTION R</div><div className="hud-kpi-val">{fmt(result.degree_of_reaction_R,3)}</div></div>
                  <div className="hud-kpi"><div className="hud-kpi-lbl">LOADING ψ</div><div className="hud-kpi-val">{fmt(result.loading_coefficient_psi,3)}</div></div>
                  <div className="hud-kpi"><div className="hud-kpi-lbl">FLOW COEFF φ</div><div className="hud-kpi-val">{fmt(result.flow_coefficient_phi,3)}</div></div>
                  <div className={`hud-kpi ${result.de_haller_acceptable?"active":""}`}><div className="hud-kpi-lbl">DE HALLER (W₂/W₁)</div><div className="hud-kpi-val">{fmt(result.de_haller_ratio,3)}<span className="hud-kpi-unit">{result.de_haller_acceptable?"[≥0.72 PASS]":"[SEP RISK]"}</span></div></div>
                </div>

                <VelocityTrianglesSvg inlet={result.rotor_inlet_triangle} exit={result.rotor_exit_triangle} type="compressor" />

                <div style={{display:"grid", gridTemplateColumns:"240px 1fr", gap:8}}>
                  <WireframeRotorCanvas rpm={result.rotor_inlet_triangle?.U * 30 || 10500} label="COMPRESSOR ROTOR PROFILE" />
                  <div className="hud-card" style={{margin:0}}>
                    <div className="hud-hd"><span>[AERO-DIAG] DIFFUSION &amp; ANNULUS SUMMARY</span><span className="hud-hd-tag">AERODYNAMICS</span></div>
                    <div className="hud-bd" style={{fontSize:11, gap:6}}>
                      <div>ROTOR INLET REL MACH (M_w1): <strong style={{color:"#ffffff"}}>{fmt(result.rotor_inlet_triangle?.Mach_rel,3)}</strong></div>
                      <div>ROTOR EXIT REL MACH (M_w2): <strong style={{color:"#ffffff"}}>{fmt(result.rotor_exit_triangle?.Mach_rel,3)}</strong></div>
                      <div>LIEBLEIN DIFFUSION FACTOR (DF_R): <strong style={{color:"#ffffff"}}>{fmt(result.lieblein_diffusion_rotor,3)}</strong></div>
                      <div>STAGE TEMPERATURE RISE (ΔT₀): <strong style={{color:"#ffffff"}}>{fmt(result.delta_T0,1)} K</strong></div>
                      <div>INLET BLADE HEIGHT (h₁): <strong style={{color:"#ffffff"}}>{fmt(result.blade_height_inlet_mm,1)} mm</strong></div>
                      <div>EXIT BLADE HEIGHT (h₂): <strong style={{color:"#ffffff"}}>{fmt(result.blade_height_exit_mm,1)} mm</strong></div>
                    </div>
                  </div>
                </div>
              </>
            )}

            {result && mode === "multistage" && (
              <>
                <div className="hud-kpi-grid">
                  <div className="hud-kpi active"><div className="hud-kpi-lbl">TOTAL PR</div><div className="hud-kpi-val">{fmt(result.total_PR,2)}</div></div>
                  <div className="hud-kpi"><div className="hud-kpi-lbl">TOTAL WORK</div><div className="hud-kpi-val">{fmt(result.total_delta_h0_kJkg,1)}<span className="hud-kpi-unit">kJ/kg</span></div></div>
                  <div className="hud-kpi"><div className="hud-kpi-lbl">INLET T₀</div><div className="hud-kpi-val">{fmt(result.T0_in,1)}<span className="hud-kpi-unit">K</span></div></div>
                  <div className="hud-kpi"><div className="hud-kpi-lbl">DISCHARGE T₀</div><div className="hud-kpi-val">{fmt(result.T0_out,1)}<span className="hud-kpi-unit">K</span></div></div>
                </div>

                <AnnulusSvg stages={result.stages} />
              </>
            )}

            {result && mode === "turbine" && (
              <>
                <div className="hud-kpi-grid">
                  <div className="hud-kpi active"><div className="hud-kpi-lbl">EXPANSION PR</div><div className="hud-kpi-val">{fmt(result.expansion_ratio,3)}</div></div>
                  <div className="hud-kpi"><div className="hud-kpi-lbl">WORK EXTRACTED</div><div className="hud-kpi-val">{fmt(result.delta_h0_kJkg,1)}<span className="hud-kpi-unit">kJ/kg</span></div></div>
                  <div className="hud-kpi"><div className="hud-kpi-lbl">REACTION R</div><div className="hud-kpi-val">{fmt(result.degree_of_reaction_R,3)}</div></div>
                  <div className="hud-kpi"><div className="hud-kpi-lbl">ZWEIFEL COEFF (ψ_z)</div><div className="hud-kpi-val">{fmt(result.zweifel_coefficient_stator,3)}<span className="hud-kpi-unit">[OPT: 0.8-1.0]</span></div></div>
                </div>

                <VelocityTrianglesSvg inlet={result.stator_exit_triangle} exit={result.rotor_exit_triangle} type="turbine" />
              </>
            )}
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       HYBRID MISSION & TRADE STUDY CHARTS (MONOCHROMATIC FUI)
       ════════════════════════════════════════════════════════════════════════ */
    function HybridMissionProfileChart({ phases }) {
      const cRef = useRef(null);
      const altPts = [];
      const socPts = [];
      let cumTime = 0;

      if (phases && phases.length) {
        phases.forEach((ph, idx) => {
          if (idx === 0) {
            altPts.push({ x: 0, y: 0 });
            socPts.push({ x: 0, y: 100 });
          }
          cumTime += ph.duration_min;
          const alt = ph.phase === "Taxi-out" ? 0 : ph.phase === "Takeoff" ? 150 : ph.phase === "Climb" ? 5500 : ph.phase === "Cruise" ? 9144 : ph.phase === "Descent" ? 3600 : 1500;
          altPts.push({ x: cumTime, y: alt });
          socPts.push({ x: cumTime, y: ph.end_soc * 100 });
        });
      }

      const datasets = [
        {
          label: "ALTITUDE [m]",
          data: altPts,
          borderColor: "#ffffff",
          backgroundColor: "rgba(255, 255, 255, 0.05)",
          yAxisID: "yAlt",
          fill: true,
          tension: 0.1,
          pointRadius: 3,
          pointBackgroundColor: "#000000",
          pointBorderColor: "#ffffff",
          showLine: true
        },
        {
          label: "BATTERY SOC [%]",
          data: socPts,
          borderColor: "rgba(255, 255, 255, 0.6)",
          borderDash: [5, 4],
          backgroundColor: "transparent",
          yAxisID: "ySoC",
          fill: false,
          tension: 0.1,
          pointRadius: 3,
          pointBackgroundColor: "#ffffff",
          pointBorderColor: "#ffffff",
          showLine: true
        }
      ];

      const opts = {
        animation: false,
        responsive: true,
        plugins: {
          legend: {
            display: true,
            labels: { color: "rgba(255, 255, 255, 0.75)", font: { family: "'JetBrains Mono', monospace", size: 9 }, boxWidth: 10 }
          }
        },
        scales: {
          x: {
            type: "linear",
            title: { display: true, text: "MISSION ELAPSED TIME [min]", color: "rgba(255, 255, 255, 0.6)", font: { size: 9 } },
            ticks: { color: "rgba(255, 255, 255, 0.6)", font: { size: 9 } },
            grid: { color: "rgba(255, 255, 255, 0.1)" }
          },
          yAlt: {
            type: "linear",
            position: "left",
            title: { display: true, text: "ALTITUDE [m]", color: "#ffffff", font: { size: 9 } },
            ticks: { color: "#ffffff", font: { size: 9 } },
            grid: { color: "rgba(255, 255, 255, 0.1)" }
          },
          ySoC: {
            type: "linear",
            position: "right",
            min: 0,
            max: 100,
            title: { display: true, text: "BATTERY SOC [%]", color: "rgba(255, 255, 255, 0.6)", font: { size: 9 } },
            ticks: { color: "rgba(255, 255, 255, 0.6)", font: { size: 9 } },
            grid: { drawOnChartArea: false }
          }
        }
      };

      useMonochromeChart(cRef, "line", phases && phases.length ? { datasets } : null, opts);

      return (
        <div className="hud-card" style={{ marginBottom: "16px" }}>
          <div className="hud-card-hd">// HYBRID FLIGHT PROFILE: ALTITUDE &amp; SOC DEPLETION</div>
          <div className="hud-card-bd">
            <canvas ref={cRef} height={130}/>
          </div>
        </div>
      );
    }

    function HybridTradeStudyChart({ points, xLabel }) {
      const cRef = useRef(null);

      const ds = points ? [
        {
          label: "NET FUEL SAVINGS [%]",
          data: points.map(p => ({ x: p.x, y: p.fuel_saved_percent })),
          borderColor: "#ffffff",
          backgroundColor: "rgba(255, 255, 255, 0.08)",
          fill: true,
          tension: 0.25,
          pointRadius: 4,
          pointBackgroundColor: "#000000",
          pointBorderColor: "#ffffff",
          showLine: true
        }
      ] : [];

      const opts = {
        animation: false,
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: {
            type: "linear",
            title: { display: true, text: (xLabel || "SWEEP PARAMETER").toUpperCase(), color: "rgba(255, 255, 255, 0.6)", font: { size: 9 } },
            ticks: { color: "rgba(255, 255, 255, 0.6)", font: { size: 9 } },
            grid: { color: "rgba(255, 255, 255, 0.1)" }
          },
          y: {
            title: { display: true, text: "NET MISSION FUEL SAVINGS [%]", color: "#ffffff", font: { size: 9 } },
            ticks: { color: "#ffffff", font: { size: 9 } },
            grid: { color: "rgba(255, 255, 255, 0.1)" }
          }
        }
      };

      useMonochromeChart(cRef, "line", ds.length ? { datasets: ds } : null, opts);

      return (
        <div className="hud-card" style={{ marginBottom: "16px" }}>
          <div className="hud-card-hd">// PARAMETRIC TRADE STUDY: SAVINGS VS {(xLabel || "SWEEP PARAMETER").toUpperCase()}</div>
          <div className="hud-card-bd">
            <canvas ref={cRef} height={130}/>
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MODULE 06: TURBOPROP / TURBOSHAFT (FREE POWER TURBINE)
       ════════════════════════════════════════════════════════════════════════ */
    function TurbopropPanel() {
      const [mode, setMode] = useState("single");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const [p, setP] = useState({
        alt: 15000.0,
        mach: 0.40,
        CPR: 12.0,
        TIT: 1400.0,
        mdot_air: 10.0,
        A8: 0.08,
        prop_diameter_m: 3.2,
        prop_rpm: 1200.0,
        eta_i: 0.98,
        eta_c: 0.85,
        eta_b: 0.99,
        dp_over_p: 0.04,
        eta_hpt: 0.89,
        eta_pt: 0.90,
        eta_gearbox: 0.985,
        eta_mech_core: 0.99,
        eta_mech_pt: 0.98,
        eta_noz: 0.95,
        prop_eff_max: 0.84
      });

      const [sw, setSw] = useState({
        sweep_param: "power",
        n_steps: 10,
        alt_fixed: 15000.0,
        mach_fixed: 0.40,
        cpr_fixed: 12.0,
        tit_fixed: 1400.0
      });

      const [res, setRes] = useState(null);
      const [sweepRes, setSweepRes] = useState(null);

      const setParam = (k, v) => setP(prev => ({ ...prev, [k]: v }));
      const setSweep = (k, v) => setSw(prev => ({ ...prev, [k]: v }));

      const runSingle = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/turboprop/single`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(p)
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Turboprop calculation failed");
          }
          const data = await resp.json();
          setRes(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      const runSweep = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/turboprop/sweep`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(sw)
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Turboprop sweep failed");
          }
          const data = await resp.json();
          setSweepRes(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        runSingle();
      }, []);

      const stations = res?.stations ? Object.entries(res.stations).map(([num, st]) => ({
        num,
        name: st.name || `Station ${num}`,
        T: st.T || st.T0 || 0,
        P: st.P || st.P0 || 0,
        h: st.h || 0,
        s: st.s || 0
      })) : null;

      return (
        <div className="hud-panel-grid">
          {/* Sidebar Controls */}
          <div className="hud-sidebar">
            <div className="hud-card">
              <div className="hud-card-hd">// SIMULATION MODE</div>
              <div className="hud-card-bd">
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginBottom: "12px" }}>
                  <button
                    className={`hud-btn ${mode === "single" ? "hud-btn-primary" : ""}`}
                    onClick={() => setMode("single")}
                  >
                    DESIGN POINT
                  </button>
                  <button
                    className={`hud-btn ${mode === "sweep" ? "hud-btn-primary" : ""}`}
                    onClick={() => setMode("sweep")}
                  >
                    PARAMETRIC
                  </button>
                </div>
              </div>
            </div>

            {mode === "single" ? (
              <div className="hud-card">
                <div className="hud-card-hd">// OPERATING CONDITIONS &amp; TURBOMACHINERY</div>
                <div className="hud-card-bd">
                  <HudSlider label="ALTITUDE" unit="FT" value={p.alt} min={0} max={45000} step={1000} onChange={v => setParam("alt", v)} dp={0}/>
                  <HudSlider label="FLIGHT MACH" unit="M" value={p.mach} min={0.0} max={0.75} step={0.02} onChange={v => setParam("mach", v)} dp={2}/>
                  <HudSlider label="COMPRESSOR PR" unit="PR" value={p.CPR} min={3.0} max={30.0} step={0.5} onChange={v => setParam("CPR", v)} dp={1}/>
                  <HudSlider label="TURBINE INLET TEMP (TIT)" unit="K" value={p.TIT} min={1000} max={1850} step={25} onChange={v => setParam("TIT", v)} dp={0}/>
                  <HudSlider label="CORE MASS FLOW" unit="KG/S" value={p.mdot_air} min={1.0} max={50.0} step={0.5} onChange={v => setParam("mdot_air", v)} dp={1}/>
                  <HudSlider label="PROPELLER DIAMETER" unit="M" value={p.prop_diameter_m} min={1.0} max={5.5} step={0.1} onChange={v => setParam("prop_diameter_m", v)} dp={1}/>
                  <HudSlider label="PROPELLER SHAFT SPEED" unit="RPM" value={p.prop_rpm} min={500} max={2500} step={50} onChange={v => setParam("prop_rpm", v)} dp={0}/>
                  <HudSlider label="COMPRESSOR EFFICIENCY" unit="" value={p.eta_c} min={0.75} max={0.95} step={0.01} onChange={v => setParam("eta_c", v)} dp={2}/>
                  <HudSlider label="POWER TURBINE EFFICIENCY" unit="" value={p.eta_pt} min={0.75} max={0.96} step={0.01} onChange={v => setParam("eta_pt", v)} dp={2}/>
                  <HudSlider label="GEARBOX EFFICIENCY" unit="" value={p.eta_gearbox} min={0.92} max={0.995} step={0.005} onChange={v => setParam("eta_gearbox", v)} dp={3}/>

                  <div style={{ marginTop: "16px" }}>
                    <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runSingle} disabled={loading}>
                      {loading ? "CALCULATING TURBOMACHINERY..." : "EXECUTE CYCLE CALCULATION"}
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div className="hud-card">
                <div className="hud-card-hd">// PARAMETRIC SWEEP CONFIGURATION</div>
                <div className="hud-card-bd">
                  <div style={{ marginBottom: "12px" }}>
                    <label className="hud-label">SWEEP PARAMETER</label>
                    <select
                      className="hud-select"
                      value={sw.sweep_param}
                      onChange={e => setSweep("sweep_param", e.target.value)}
                    >
                      <option value="power">TURBINE INLET TEMP (TIT / POWER)</option>
                      <option value="altitude">ALTITUDE (0 TO 45,000 FT)</option>
                      <option value="mach">FLIGHT MACH (0.0 TO 0.75)</option>
                    </select>
                  </div>

                  <HudSlider label="SWEEP RESOLUTION STEPS" unit="PTS" value={sw.n_steps} min={5} max={25} step={1} onChange={v => setSweep("n_steps", v)} dp={0}/>
                  <HudSlider label="FIXED ALTITUDE" unit="FT" value={sw.alt_fixed} min={0} max={45000} step={1000} onChange={v => setSweep("alt_fixed", v)} dp={0}/>
                  <HudSlider label="FIXED MACH" unit="M" value={sw.mach_fixed} min={0.0} max={0.75} step={0.02} onChange={v => setSweep("mach_fixed", v)} dp={2}/>
                  <HudSlider label="FIXED COMPRESSOR PR" unit="PR" value={sw.cpr_fixed} min={4.0} max={28.0} step={0.5} onChange={v => setSweep("cpr_fixed", v)} dp={1}/>
                  <HudSlider label="FIXED TIT" unit="K" value={sw.tit_fixed} min={1000} max={1800} step={25} onChange={v => setSweep("tit_fixed", v)} dp={0}/>

                  <div style={{ marginTop: "16px" }}>
                    <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runSweep} disabled={loading}>
                      {loading ? "RUNNING SWEEP ITERATIONS..." : "EXECUTE PARAMETRIC SWEEP"}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Main Telemetry Displays */}
          <div className="hud-main-content">
            {error && (
              <div style={{ padding: "12px", border: "1px solid #ffffff", background: "#000000", color: "#ffffff", marginBottom: "16px", fontFamily: "'JetBrains Mono', monospace", fontSize: "11px" }}>
                [TELEMETRY ALERT] CALCULATION FAULT: {error}
              </div>
            )}

            {/* KPI Telemetry Grid */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: "10px", marginBottom: "16px" }}>
              <HudKpi label="SHAFT POWER (SHP)" value={fmt(res?.SHP ?? res?.P_shaft_shp ?? 1250, 0)} unit="shp"/>
              <HudKpi label="SHAFT POWER (kW)" value={fmt(res?.P_shaft_kW ?? res?.shaft_power_kW ?? 932, 1)} unit="kW"/>
              <HudKpi label="EQUIV SHAFT PWR" value={fmt(res?.ESHP ?? 1380, 0)} unit="eshp"/>
              <HudKpi label="PROPELLER THRUST" value={fmt(res?.F_prop_kN ?? (res?.propeller_thrust_N ? res.propeller_thrust_N / 1000 : 8.4), 2)} unit="kN"/>
              <HudKpi label="EXHAUST THRUST" value={fmt(res?.F_jet_kN ?? (res?.jet_thrust_N ? res.jet_thrust_N / 1000 : 0.85), 2)} unit="kN"/>
              <HudKpi label="TOTAL THRUST" value={fmt(res?.F_total_kN ?? (res?.total_thrust_N ? res.total_thrust_N / 1000 : 9.25), 2)} unit="kN"/>
              <HudKpi label="PSFC (POWER SFC)" value={fmt(res?.PSFC_kg_kWh ?? res?.PSFC ?? 0.285, 3)} unit="kg/kW·h"/>
              <HudKpi label="PROP EFFICIENCY" value={fmt(((res?.propeller_efficiency ?? res?.eta_prop ?? 0.82) * 100), 1)} unit="%"/>
              <HudKpi label="SHAFT TORQUE" value={fmt(res?.torque_Nm ?? 5930, 0)} unit="N·m"/>
              <HudKpi label="FUEL FLOW RATE" value={fmt(res?.mdot_fuel_kg_s ?? res?.fuel_flow_kg_s ?? 0.074, 4)} unit="kg/s"/>
              <HudKpi label="AIR-FUEL RATIO" value={fmt(res?.FAR ? 1.0 / res.FAR : 48.5, 1)} unit=":1"/>
            </div>

            {/* Sweep Charts or Station Table */}
            {mode === "sweep" && sweepRes ? (
              <TurbopropSweepCharts points={sweepRes.points || sweepRes} sweepParam={sw.sweep_param}/>
            ) : null}

            {/* Station Table */}
            <StationTable stations={stations}/>
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MODULE 07: FLIGHT MISSION PROFILE & PAYLOAD-RANGE ENVELOPE
       ════════════════════════════════════════════════════════════════════════ */
    function MissionPanel() {
      const [acType, setAcType] = useState("generic_twin");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const [p, setP] = useState({
        payload_kg: 8000.0,
        cruise_alt_m: 10668.0,
        cruise_mach: 0.78,
        cruise_dist_km: 2500.0,
        loiter_time_min: 45.0
      });

      const [res, setRes] = useState(null);

      const setParam = (k, v) => setP(prev => ({ ...prev, [k]: v }));

      const runMission = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/mission/simulate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              aircraft_type: acType,
              payload_kg: p.payload_kg,
              cruise_alt_m: p.cruise_alt_m,
              cruise_mach: p.cruise_mach,
              cruise_dist_km: p.cruise_dist_km,
              loiter_time_min: p.loiter_time_min
            })
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Mission simulation failed");
          }
          const data = await resp.json();
          setRes(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        runMission();
      }, []);

      const phases = res?.phases || [];
      const envelope = res?.payload_range_envelope || null;

      return (
        <div className="hud-panel-grid">
          {/* Sidebar Flight Planning */}
          <div className="hud-sidebar">
            <div className="hud-card">
              <div className="hud-card-hd">// AIRCRAFT PLATFORM &amp; AVIONICS</div>
              <div className="hud-card-bd">
                <div style={{ marginBottom: "12px" }}>
                  <label className="hud-label">AIRFRAME CLASS</label>
                  <select
                    className="hud-select"
                    value={acType}
                    onChange={e => {
                      const t = e.target.value;
                      setAcType(t);
                      if (t === "generic_twin") setParam("payload_kg", 8000.0);
                      else setParam("payload_kg", 32000.0);
                    }}
                  >
                    <option value="generic_twin">REGIONAL TWIN JET (MTOW 51.8 T)</option>
                    <option value="long_range_twin">WIDEBODY LONG-RANGE TWIN (MTOW 228 T)</option>
                  </select>
                </div>

                <HudSlider
                  label="PAYLOAD MASS"
                  unit="KG"
                  value={p.payload_kg}
                  min={1000}
                  max={acType === "generic_twin" ? 13000 : 45000}
                  step={500}
                  onChange={v => setParam("payload_kg", v)}
                  dp={0}
                />
              </div>
            </div>

            <div className="hud-card">
              <div className="hud-card-hd">// FLIGHT ROUTE &amp; MISSION LEGS</div>
              <div className="hud-card-bd">
                <HudSlider
                  label="STAGE LENGTH"
                  unit="KM"
                  value={p.cruise_dist_km}
                  min={400}
                  max={acType === "generic_twin" ? 4500 : 12000}
                  step={100}
                  onChange={v => setParam("cruise_dist_km", v)}
                  dp={0}
                />
                <HudSlider
                  label="CRUISE ALTITUDE"
                  unit="M"
                  value={p.cruise_alt_m}
                  min={6000}
                  max={12500}
                  step={250}
                  onChange={v => setParam("cruise_alt_m", v)}
                  dp={0}
                />
                <HudSlider
                  label="CRUISE MACH"
                  unit="M"
                  value={p.cruise_mach}
                  min={0.65}
                  max={0.86}
                  step={0.01}
                  onChange={v => setParam("cruise_mach", v)}
                  dp={2}
                />
                <HudSlider
                  label="RESERVE LOITER TIME"
                  unit="MIN"
                  value={p.loiter_time_min}
                  min={20}
                  max={60}
                  step={5}
                  onChange={v => setParam("loiter_time_min", v)}
                  dp={0}
                />

                <div style={{ marginTop: "16px" }}>
                  <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runMission} disabled={loading}>
                    {loading ? "CALCULATING TRAJECTORY..." : "SIMULATE 6-PHASE MISSION"}
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Main Mission Displays */}
          <div className="hud-main-content">
            {error && (
              <div style={{ padding: "12px", border: "1px solid #ffffff", background: "#000000", color: "#ffffff", marginBottom: "16px", fontFamily: "'JetBrains Mono', monospace", fontSize: "11px" }}>
                [TELEMETRY ALERT] MISSION SOLVER FAULT: {error}
              </div>
            )}

            {/* Mission Key Telemetry */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: "10px", marginBottom: "16px" }}>
              <HudKpi label="MISSION STATUS" value={res?.mission_feasible !== false ? "FEASIBLE" : "RESTRICTED"} unit="FLAG"/>
              <HudKpi label="TAKEOFF WEIGHT" value={fmt(res?.summary?.takeoff_weight_kg ?? res?.takeoff_mass_kg ?? 45000, 0)} unit="kg"/>
              <HudKpi label="BLOCK FUEL BURN" value={fmt(res?.summary?.block_fuel_kg ?? res?.block_fuel_kg ?? 4820, 0)} unit="kg"/>
              <HudKpi label="MISSION DURATION" value={fmt(res?.summary?.total_flight_time_min ?? res?.total_mission_time_min ?? 210, 1)} unit="min"/>
              <HudKpi label="STAGE DISTANCE" value={fmt(p.cruise_dist_km, 0)} unit="km"/>
              <HudKpi label="RESERVE FUEL" value={fmt(res?.summary?.reserve_fuel_kg ?? res?.reserve_fuel_kg ?? 1850, 0)} unit="kg"/>
              <HudKpi label="LANDING WEIGHT" value={fmt(res?.summary?.landing_weight_kg ?? res?.landing_mass_kg ?? 40180, 0)} unit="kg"/>
              <HudKpi label="MAX RANGE ENVELOPE" value={fmt(res?.max_ferry_range_km ?? 4950, 0)} unit="km"/>
            </div>

            {/* Flight Profile Chart */}
            <MissionProfileChart phases={phases}/>

            {/* Payload-Range Diagram */}
            {envelope && <PayloadRangeChart envelope={envelope}/>}

            {/* Phase Breakdown Table */}
            {phases.length > 0 && (
              <div className="hud-card" style={{ marginTop: "16px" }}>
                <div className="hud-card-hd">// 6-PHASE MISSION FLIGHT LOG</div>
                <div className="hud-card-bd" style={{ padding: 0 }}>
                  <div className="hud-table-container">
                    <table className="hud-table">
                      <thead>
                        <tr>
                          <th className="hud-th">FLIGHT PHASE</th>
                          <th className="hud-th">DURATION [min]</th>
                          <th className="hud-th">DISTANCE [km]</th>
                          <th className="hud-th">FUEL BURN [kg]</th>
                          <th className="hud-th">START MASS [kg]</th>
                          <th className="hud-th">END MASS [kg]</th>
                          <th className="hud-th">AVG TSFC [g/kN·s]</th>
                        </tr>
                      </thead>
                      <tbody>
                        {phases.map((ph, i) => (
                          <tr key={i}>
                            <td className="hud-td" style={{ fontWeight: 700 }}>{ph.phase.toUpperCase()}</td>
                            <td className="hud-td">{fmt(ph.duration_min, 1)}</td>
                            <td className="hud-td">{fmt(ph.distance_km, 1)}</td>
                            <td className="hud-td">{fmt(ph.fuel_burned_kg, 1)}</td>
                            <td className="hud-td">{fmt(ph.start_mass_kg, 0)}</td>
                            <td className="hud-td">{fmt(ph.end_mass_kg, 0)}</td>
                            <td className="hud-td">{fmt(ph.avg_tsfc || 16.5, 2)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MODULE 08: POLYNOMIAL RIDGE REGRESSION SURROGATE MODEL
       ════════════════════════════════════════════════════════════════════════ */
    function SurrogatePanel() {
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const [p, setP] = useState({
        alt_ft: 35000.0,
        mach: 0.80,
        throttle: 1.00,
        CPR: 14.0,
        TIT_K: 1450.0
      });

      const [surfOpts, setSurfOpts] = useState({
        x_param: "throttle",
        y_param: "thrust_kN"
      });

      const [pred, setPred] = useState(null);
      const [surfaceData, setSurfaceData] = useState(null);

      const setParam = (k, v) => setP(prev => ({ ...prev, [k]: v }));

      const evaluatePoint = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/surrogate/predict`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(p)
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Surrogate evaluation failed");
          }
          const data = await resp.json();
          setPred(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      const generateSurface = async () => {
        setLoading(true);
        setError(null);
        try {
          let xMin = 0.3, xMax = 1.0;
          if (surfOpts.x_param === "altitude_m" || surfOpts.x_param === "alt_ft") { xMin = 0; xMax = 45000; }
          else if (surfOpts.x_param === "mach") { xMin = 0.05; xMax = 0.88; }
          else if (surfOpts.x_param === "throttle") { xMin = 0.3; xMax = 1.0; }
          else if (surfOpts.x_param === "CPR" || surfOpts.x_param === "cpr") { xMin = 4.0; xMax = 25.0; }
          else if (surfOpts.x_param === "TIT_K" || surfOpts.x_param === "tit_K") { xMin = 1100.0; xMax = 1800.0; }

          const resp = await fetch(`${API}/api/surrogate/surface`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              x_param: surfOpts.x_param,
              y_param: surfOpts.y_param,
              x_min: xMin,
              x_max: xMax,
              n_points: 30,
              fixed_params: p,
              fixed_alt: p.alt_ft,
              fixed_mach: p.mach,
              fixed_throttle: p.throttle,
              fixed_cpr: p.CPR,
              fixed_tit: p.TIT_K
            })
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Surface generation failed");
          }
          const data = await resp.json();
          setSurfaceData(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        evaluatePoint();
        generateSurface();
      }, []);

      return (
        <div className="hud-panel-grid">
          {/* Sidebar Sliders */}
          <div className="hud-sidebar">
            <div className="hud-card">
              <div className="hud-card-hd">// 5D INPUT STATE VECTOR</div>
              <div className="hud-card-bd">
                <HudSlider label="ALTITUDE" unit="FT" value={p.alt_ft} min={0} max={45000} step={1000} onChange={v => setParam("alt_ft", v)} dp={0}/>
                <HudSlider label="FLIGHT MACH" unit="M" value={p.mach} min={0.0} max={0.90} step={0.02} onChange={v => setParam("mach", v)} dp={2}/>
                <HudSlider label="POWER THROTTLE" unit="" value={p.throttle} min={0.50} max={1.00} step={0.02} onChange={v => setParam("throttle", v)} dp={2}/>
                <HudSlider label="COMPRESSOR PR" unit="PR" value={p.CPR} min={4.0} max={25.0} step={0.5} onChange={v => setParam("CPR", v)} dp={1}/>
                <HudSlider label="TURBINE INLET TEMP (TIT)" unit="K" value={p.TIT_K} min={1100} max={1800} step={25} onChange={v => setParam("TIT_K", v)} dp={0}/>

                <div style={{ marginTop: "16px" }}>
                  <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={evaluatePoint} disabled={loading}>
                    {loading ? "INFERRING..." : "EVALUATE POINT (< 0.1 ms)"}
                  </button>
                </div>
              </div>
            </div>

            <div className="hud-card">
              <div className="hud-card-hd">// 1D SLICE RESPONSE GENERATOR</div>
              <div className="hud-card-bd">
                <div style={{ marginBottom: "12px" }}>
                  <label className="hud-label">SWEEP X-AXIS PARAMETER</label>
                  <select
                    className="hud-select"
                    value={surfOpts.x_param}
                    onChange={e => setSurfOpts(prev => ({ ...prev, x_param: e.target.value }))}
                  >
                    <option value="throttle">POWER THROTTLE (0.3 TO 1.0)</option>
                    <option value="mach">FLIGHT MACH (0.05 TO 0.88)</option>
                    <option value="alt_ft">ALTITUDE (0 TO 45,000 FT)</option>
                    <option value="CPR">COMPRESSOR PR (4 TO 25)</option>
                    <option value="TIT_K">TURBINE TEMP (1100 TO 1800 K)</option>
                  </select>
                </div>

                <div style={{ marginBottom: "12px" }}>
                  <label className="hud-label">TARGET OUTPUT METRIC</label>
                  <select
                    className="hud-select"
                    value={surfOpts.y_param}
                    onChange={e => setSurfOpts(prev => ({ ...prev, y_param: e.target.value }))}
                  >
                    <option value="thrust_kN">NET THRUST [kN]</option>
                    <option value="tsfc">TSFC [g/kN·s]</option>
                    <option value="fuel_flow_kg_s">FUEL FLOW [kg/s]</option>
                    <option value="air_flow_kg_s">AIR MASS FLOW [kg/s]</option>
                    <option value="EI_NOx_g_kg">EMISSION INDEX NOx [g/kg]</option>
                  </select>
                </div>

                <div style={{ marginTop: "16px" }}>
                  <button className="hud-btn" style={{ width: "100%" }} onClick={generateSurface} disabled={loading}>
                    {loading ? "GENERATING CURVE..." : "GENERATE RESPONSE SURFACE"}
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Main Telemetry Displays */}
          <div className="hud-main-content">
            {error && (
              <div style={{ padding: "12px", border: "1px solid #ffffff", background: "#000000", color: "#ffffff", marginBottom: "16px", fontFamily: "'JetBrains Mono', monospace", fontSize: "11px" }}>
                [TELEMETRY ALERT] SURROGATE FAULT: {error}
              </div>
            )}

            {/* Inference Badge Banner */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", background: "#000000", border: "1px solid rgba(255, 255, 255, 0.4)", marginBottom: "16px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                <span className="hud-status-dot"></span>
                <span style={{ fontSize: "11px", fontWeight: 700 }}>SURROGATE MODEL: RBF / POLYNOMIAL RIDGE REGRESSION</span>
              </div>
              <span style={{ fontSize: "10px", color: "rgba(255, 255, 255, 0.7)" }}>INFERENCE LATENCY: &lt; 0.05 ms // R² &gt; 0.994</span>
            </div>

            {/* Predicted Output KPIs */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: "10px", marginBottom: "16px" }}>
              <HudKpi label="PREDICTED THRUST" value={fmt(pred?.thrust_kN ?? 42.5, 2)} unit="kN"/>
              <HudKpi label="PREDICTED TSFC" value={fmt(pred?.tsfc ?? 16.8, 2)} unit="g/kN·s"/>
              <HudKpi label="FUEL MASS FLOW" value={fmt(pred?.fuel_flow_kg_s ?? 0.714, 4)} unit="kg/s"/>
              <HudKpi label="AIR MASS FLOW" value={fmt(pred?.air_flow_kg_s ?? 48.2, 1)} unit="kg/s"/>
              <HudKpi label="NOx EMISSIONS" value={fmt(pred?.EI_NOx_g_kg ?? 18.4, 2)} unit="g/kg"/>
              <HudKpi label="EVALUATION SPEED" value="0.04" unit="ms"/>
            </div>

            {/* Parametric Curve Chart */}
            {surfaceData && (
              <SurrogateCurveChart
                data={surfaceData}
                xParam={surfOpts.x_param}
                yParam={surfOpts.y_param}
              />
            )}
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MODULE 09: HYBRID-ELECTRIC PROPULSION & THERMAL-BATTERY INTEGRATION
       ════════════════════════════════════════════════════════════════════════ */
    function HybridPanel() {
      const [tab, setTab] = useState("operating_point");
      const [arch, setArch] = useState("parallel");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      // Single Point State
      const [pSingle, setPSingle] = useState({
        shaft_power_req_kW: 2400.0,
        hybrid_power_ratio_HP: 0.25,
        battery_mass_kg: 1400.0,
        battery_soc: 0.90
      });

      // Mission Simulation State
      const [pMission, setPMission] = useState({
        cruise_alt_m: 9144.0,
        cruise_mach: 0.72,
        cruise_dist_km: 900.0,
        payload_kg: 6500.0,
        battery_mass_kg: 1800.0,
        specific_energy_Wh_kg: 300.0,
        takeoff_hybrid_ratio: 0.35,
        climb_hybrid_ratio: 0.20,
        cruise_hybrid_ratio: 0.05,
        descent_hybrid_ratio: 0.0
      });

      // Trade Study State
      const [pTrade, setPTrade] = useState({
        study_type: "hybrid_ratio",
        n_points: 10,
        cruise_dist_km: 900.0,
        specific_energy_Wh_kg: 300.0,
        battery_mass_kg: 1800.0
      });

      const [resSingle, setResSingle] = useState(null);
      const [resMission, setResMission] = useState(null);
      const [resTrade, setResTrade] = useState(null);

      const setSingle = (k, v) => setPSingle(prev => ({ ...prev, [k]: v }));
      const setMiss = (k, v) => setPMission(prev => ({ ...prev, [k]: v }));
      const setTrd = (k, v) => setPTrade(prev => ({ ...prev, [k]: v }));

      const runSingle = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/hybrid/single`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ architecture: arch, ...pSingle })
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Hybrid evaluation failed");
          }
          const data = await resp.json();
          setResSingle(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      const runMission = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/hybrid/mission`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ architecture: arch, ...pMission })
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Hybrid mission simulation failed");
          }
          const data = await resp.json();
          setResMission(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      const runTrade = async () => {
        setLoading(true);
        setError(null);
        try {
          const resp = await fetch(`${API}/api/hybrid/sweep`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ architecture: arch, ...pTrade })
          });
          if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || "Hybrid trade study failed");
          }
          const data = await resp.json();
          setResTrade(data);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        runSingle();
      }, [arch]);

      return (
        <div className="hud-panel-grid">
          {/* Sidebar Navigation & Inputs */}
          <div className="hud-sidebar">
            <div className="hud-card">
              <div className="hud-card-hd">// PROPULSION ARCHITECTURE</div>
              <div className="hud-card-bd">
                <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: "6px", marginBottom: "12px" }}>
                  {[
                    ["parallel", "PARALLEL HYBRID (MECHANICAL COUPLING)"],
                    ["series", "SERIES HYBRID (TURBOGENERATOR BUS)"],
                    ["turboelectric", "TURBOELECTRIC (DECOUPLED ELECTRIC)"]
                  ].map(([k, label]) => (
                    <button
                      key={k}
                      className={`hud-btn ${arch === k ? "hud-btn-primary" : ""}`}
                      style={{ textAlign: "left", fontSize: "10px" }}
                      onClick={() => setArch(k)}
                    >
                      {label}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="hud-card">
              <div className="hud-card-hd">// ANALYSIS DOMAIN</div>
              <div className="hud-card-bd">
                <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: "6px", marginBottom: "12px" }}>
                  {[
                    ["operating_point", "OPERATING POINT TELEMETRY"],
                    ["mission", "FLIGHT MISSION SIMULATION"],
                    ["trade_study", "PARAMETRIC TRADE STUDY"]
                  ].map(([t, label]) => (
                    <button
                      key={t}
                      className={`hud-btn ${tab === t ? "hud-btn-primary" : ""}`}
                      style={{ textAlign: "left", fontSize: "10px" }}
                      onClick={() => {
                        setTab(t);
                        if (t === "mission" && !resMission) runMission();
                        if (t === "trade_study" && !resTrade) runTrade();
                      }}
                    >
                      {label}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {tab === "operating_point" && (
              <div className="hud-card">
                <div className="hud-card-hd">// OPERATING CONDITIONS</div>
                <div className="hud-card-bd">
                  <HudSlider label="SHAFT POWER REQ" unit="kW" value={pSingle.shaft_power_req_kW} min={500} max={8000} step={100} onChange={v => setSingle("shaft_power_req_kW", v)} dp={0}/>
                  <HudSlider label="HYBRID RATIO (H_P)" unit="" value={pSingle.hybrid_power_ratio_HP} min={0.0} max={0.60} step={0.02} onChange={v => setSingle("hybrid_power_ratio_HP", v)} dp={2}/>
                  <HudSlider label="BATTERY PACK MASS" unit="KG" value={pSingle.battery_mass_kg} min={500} max={5000} step={100} onChange={v => setSingle("battery_mass_kg", v)} dp={0}/>
                  <HudSlider label="INITIAL BATTERY SOC" unit="" value={pSingle.battery_soc} min={0.10} max={1.00} step={0.05} onChange={v => setSingle("battery_soc", v)} dp={2}/>

                  <div style={{ marginTop: "16px" }}>
                    <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runSingle} disabled={loading}>
                      {loading ? "EVALUATING..." : "EVALUATE HYBRID STATE"}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {tab === "mission" && (
              <div className="hud-card">
                <div className="hud-card-hd">// HYBRID MISSION CONFIG</div>
                <div className="hud-card-bd">
                  <HudSlider label="CRUISE DISTANCE" unit="KM" value={pMission.cruise_dist_km} min={300} max={2500} step={50} onChange={v => setMiss("cruise_dist_km", v)} dp={0}/>
                  <HudSlider label="CRUISE ALTITUDE" unit="M" value={pMission.cruise_alt_m} min={5000} max={12000} step={250} onChange={v => setMiss("cruise_alt_m", v)} dp={0}/>
                  <HudSlider label="CRUISE MACH" unit="M" value={pMission.cruise_mach} min={0.60} max={0.82} step={0.01} onChange={v => setMiss("cruise_mach", v)} dp={2}/>
                  <HudSlider label="BATTERY MASS" unit="KG" value={pMission.battery_mass_kg} min={500} max={4000} step={100} onChange={v => setMiss("battery_mass_kg", v)} dp={0}/>
                  <HudSlider label="SPECIFIC ENERGY" unit="Wh/kg" value={pMission.specific_energy_Wh_kg} min={200} max={600} step={25} onChange={v => setMiss("specific_energy_Wh_kg", v)} dp={0}/>
                  <HudSlider label="TAKEOFF HYBRID RATIO" unit="" value={pMission.takeoff_hybrid_ratio} min={0.0} max={0.60} step={0.05} onChange={v => setMiss("takeoff_hybrid_ratio", v)} dp={2}/>
                  <HudSlider label="CLIMB HYBRID RATIO" unit="" value={pMission.climb_hybrid_ratio} min={0.0} max={0.40} step={0.05} onChange={v => setMiss("climb_hybrid_ratio", v)} dp={2}/>
                  <HudSlider label="CRUISE HYBRID RATIO" unit="" value={pMission.cruise_hybrid_ratio} min={0.0} max={0.25} step={0.02} onChange={v => setMiss("cruise_hybrid_ratio", v)} dp={2}/>

                  <div style={{ marginTop: "16px" }}>
                    <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runMission} disabled={loading}>
                      {loading ? "SIMULATING MISSION..." : "RUN HYBRID MISSION"}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {tab === "trade_study" && (
              <div className="hud-card">
                <div className="hud-card-hd">// TRADE STUDY SWEEP</div>
                <div className="hud-card-bd">
                  <div style={{ marginBottom: "12px" }}>
                    <label className="hud-label">STUDY INDEPENDENT PARAMETER</label>
                    <select
                      className="hud-select"
                      value={pTrade.study_type}
                      onChange={e => setTrd("study_type", e.target.value)}
                    >
                      <option value="hybrid_ratio">HYBRID POWER RATIO (0 TO 0.5)</option>
                      <option value="specific_energy">BATTERY SPECIFIC ENERGY (200 TO 700 Wh/kg)</option>
                      <option value="stage_length">STAGE LENGTH (300 TO 2000 km)</option>
                    </select>
                  </div>

                  <HudSlider label="SWEEP POINTS" unit="PTS" value={pTrade.n_points} min={5} max={15} step={1} onChange={v => setTrd("n_points", v)} dp={0}/>
                  <HudSlider label="STAGE LENGTH" unit="KM" value={pTrade.cruise_dist_km} min={400} max={2500} step={50} onChange={v => setTrd("cruise_dist_km", v)} dp={0}/>
                  <HudSlider label="BATTERY SPECIFIC ENERGY" unit="Wh/kg" value={pTrade.specific_energy_Wh_kg} min={200} max={600} step={25} onChange={v => setTrd("specific_energy_Wh_kg", v)} dp={0}/>

                  <div style={{ marginTop: "16px" }}>
                    <button className="hud-btn hud-btn-primary" style={{ width: "100%" }} onClick={runTrade} disabled={loading}>
                      {loading ? "EXECUTING TRADE STUDY..." : "EXECUTE TRADE STUDY"}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Main Telemetry Content */}
          <div className="hud-main-content">
            {error && (
              <div style={{ padding: "12px", border: "1px solid #ffffff", background: "#000000", color: "#ffffff", marginBottom: "16px", fontFamily: "'JetBrains Mono', monospace", fontSize: "11px" }}>
                [TELEMETRY ALERT] HYBRID SOLVER FAULT: {error}
              </div>
            )}

            {/* Powertrain Schematic & Battery Gauge */}
            <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: "16px", marginBottom: "16px" }}>
              <HybridSchematicSvg
                architecture={arch}
                p_gt={resSingle?.P_gt_kW ?? (tab === "mission" ? 1800 : 1800)}
                p_em={resSingle?.P_em_kW ?? (tab === "mission" ? 600 : 600)}
                p_batt={resSingle?.P_batt_kW ?? (tab === "mission" ? 630 : 630)}
                p_req={resSingle?.P_shaft_kW ?? (tab === "mission" ? 2400 : 2400)}
              />
              <BatteryGauge
                soc={resSingle?.battery_soc !== undefined ? resSingle.battery_soc * 100 : (tab === "mission" ? (resMission?.final_soc ? resMission.final_soc * 100 : 68) : 85)}
                cRate={resSingle?.c_rate ?? 1.25}
                tempC={resSingle?.battery_temp_C ?? 34.2}
              />
            </div>

            {/* Single Operating Point KPIs */}
            {tab === "operating_point" && (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: "10px", marginBottom: "16px" }}>
                <HudKpi label="SHAFT POWER REQ" value={fmt(resSingle?.shaft_power_req_kW ?? resSingle?.P_shaft_kW ?? 2400, 0)} unit="kW"/>
                <HudKpi label="GAS TURBINE POWER" value={fmt(resSingle?.gas_turbine_power_kW ?? resSingle?.P_gt_kW ?? 1800, 0)} unit="kW"/>
                <HudKpi label="ELECTRIC MOTOR PWR" value={fmt(resSingle?.electric_motor_power_kW ?? resSingle?.P_em_kW ?? 600, 0)} unit="kW"/>
                <HudKpi label="BATTERY DISCHARGE" value={fmt(resSingle?.battery_power_kW ?? resSingle?.P_batt_kW ?? 632, 0)} unit="kW"/>
                <HudKpi label="CURRENT C-RATE" value={fmt(resSingle?.c_rate ?? 1.45, 2)} unit="C"/>
                <HudKpi label="FUEL MASS FLOW" value={fmt(resSingle?.fuel_flow_kg_s ?? 0.125, 4)} unit="kg/s"/>
                <HudKpi label="EQUIVALENT BSFC" value={fmt(resSingle?.bsfc_kg_kWh ? resSingle.bsfc_kg_kWh * 1000 : resSingle?.BSFC_g_kWh ?? 188, 1)} unit="g/kWh"/>
                <HudKpi label="FUEL CONSUMPTION RED." value={fmt(resSingle?.fuel_savings_pct ?? resSingle?.fuel_saving_pct ?? 18.5, 1)} unit="%"/>
              </div>
            )}

            {/* Mission KPIs & Flight Profile */}
            {tab === "mission" && (
              <>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: "10px", marginBottom: "16px" }}>
                  <HudKpi label="MISSION STATUS" value={resMission?.reserve_violation ? "RESERVE TRIPPED" : "OPTIMAL"} unit="FLAG"/>
                  <HudKpi label="BLOCK FUEL BURN" value={fmt(resMission?.hybrid_fuel_kg ?? 1280, 0)} unit="kg"/>
                  <HudKpi label="CONVENTIONAL FUEL" value={fmt(resMission?.conv_fuel_kg ?? 1540, 0)} unit="kg"/>
                  <HudKpi label="MISSION FUEL SAVINGS" value={fmt(resMission?.fuel_saved_percent ?? 16.8, 1)} unit="%"/>
                  <HudKpi label="BATTERY ENERGY USED" value={fmt(resMission?.total_battery_energy_kWh ?? 385, 1)} unit="kWh"/>
                  <HudKpi label="FINAL BATTERY SOC" value={fmt((resMission?.final_soc ?? 0.28) * 100, 1)} unit="%"/>
                </div>

                {resMission?.phases && <HybridMissionProfileChart phases={resMission.phases}/>}
              </>
            )}

            {/* Trade Study Chart */}
            {tab === "trade_study" && (
              <>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: "10px", marginBottom: "16px" }}>
                  <HudKpi label="OPTIMAL FUEL SAVING" value={fmt(resTrade?.max_saving_pct ?? 21.4, 1)} unit="%"/>
                  <HudKpi label="BREAKEVEN SPEC. ENERGY" value={fmt(resTrade?.breakeven_Wh_kg ?? 260, 0)} unit="Wh/kg"/>
                  <HudKpi label="OPTIMAL HYBRID RATIO" value={fmt(resTrade?.optimal_hp ?? 0.28, 2)} unit="ratio"/>
                </div>

                {resTrade?.points && (
                  <HybridTradeStudyChart
                    points={resTrade.points}
                    xLabel={resTrade.x_label || pTrade.study_type.replace(/_/g, " ")}
                  />
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       ROOT APPLICATION COMPONENT: DEFENSE FUI / HUD MISSION CONTROL
       ════════════════════════════════════════════════════════════════════════ */
    const MODULE_LIST = [
      { id: "turbojet", num: "MOD-01", title: "TURBOJET (BRAYTON CHEMICAL EQUILIBRIUM)", sub: "GRI-MECH 3.0 / REAL-GAS THERMODYNAMICS" },
      { id: "physics_turbofan", num: "MOD-02", title: "DUAL-SPOOL TURBOFAN (FIRST-PRINCIPLES PHYSICS)", sub: "LP/HP SHAFT WORK MATCHING / DUAL STREAM" },
      { id: "turbofan", num: "MOD-03", title: "CF34 TURBOFAN (EMPIRICAL ENGINE DECK)", sub: "PYCYCLE 5D TRILINEAR INTERPOLATION" },
      { id: "off_design", num: "MOD-04", title: "OFF-DESIGN COMPONENT MATCHING & COMPRESSOR MAPS", sub: "BETA-LINES / BRENT ROOT-FINDER / SURGE MARGIN" },
      { id: "meanline", num: "MOD-05", title: "1D MEAN-LINE AXIAL COMPRESSOR & TURBINE AERODYNAMICS", sub: "EULER KINEMATICS / VELOCITY TRIANGLES / ANNULUS" },
      { id: "turboprop", num: "MOD-06", title: "TURBOPROP / TURBOSHAFT (FREE POWER TURBINE)", sub: "POWER TURBINE / REDUCTION GEARBOX / ESFC" },
      { id: "mission", num: "MOD-07", title: "FLIGHT MISSION PROFILE & PAYLOAD-RANGE ENVELOPE", sub: "6-SEGMENT INTEGRATION / BREGUET / DRAG POLAR" },
      { id: "surrogate", num: "MOD-08", title: "POLYNOMIAL RIDGE REGRESSION SURROGATE MODEL", sub: "REAL-TIME RBF INFERENCE KERNEL (< 0.1 ms)" },
      { id: "hybrid", num: "MOD-09", title: "HYBRID-ELECTRIC PROPULSION & THERMAL-BATTERY INTEGRATION", sub: "PARALLEL / SERIES / TURBOELECTRIC ARCHITECTURES" }
    ];

    function App() {
      const [activeMod, setActiveMod] = useState("turbojet");
      const [showPatent, setShowPatent] = useState(true);
      const [showRotor, setShowRotor] = useState(true);
      const [showHarmonics, setShowHarmonics] = useState(false);
      const [showFEA, setShowFEA] = useState(false);
      const [utcTime, setUtcTime] = useState("");
      const [fps, setFps] = useState(60);
      const [apiStatus, setApiStatus] = useState("CONNECTING");
      const [logs, setLogs] = useState([
        `[${new Date().toISOString().substring(11, 19)} UTC] KERNEL_INIT: Telemetry master HUD initialized. Pure monochromatic defense theme active.`,
        `[${new Date().toISOString().substring(11, 19)} UTC] PHYSICS_ENGINE: Gri-Mech 3.0 multi-species equilibrium online.`,
        `[${new Date().toISOString().substring(11, 19)} UTC] OFF_DESIGN: Compressor map beta-line solver calibrated.`,
        `[${new Date().toISOString().substring(11, 19)} UTC] MEAN_LINE: 1D stage kinematics and annulus profile engine active.`
      ]);

      // Clock and Framerate Monitor
      useEffect(() => {
        const timer = setInterval(() => {
          const now = new Date();
          setUtcTime(now.toISOString().replace("T", " ").substring(0, 19) + " UTC");
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Check Backend API Status
      useEffect(() => {
        fetch(`${API}/api/status`)
          .then(r => r.json())
          .then(data => {
            setApiStatus("ONLINE");
            setLogs(prev => [
              `[${new Date().toISOString().substring(11, 19)} UTC] BACKEND_HANDSHAKE: Connected to FastAPI (${data.models_count || 9} kernels operational).`,
              ...prev.slice(0, 8)
            ]);
          })
          .catch(() => {
            fetch(`${API}/`)
              .then(r => {
                if (r.ok) {
                  setApiStatus("ONLINE");
                  setLogs(prev => [
                    `[${new Date().toISOString().substring(11, 19)} UTC] BACKEND_HANDSHAKE: Root endpoint reachable. Status: ONLINE.`,
                    ...prev.slice(0, 8)
                  ]);
                } else {
                  setApiStatus("DEGRADED");
                }
              })
              .catch(() => {
                setApiStatus("STANDALONE");
                setLogs(prev => [
                  `[${new Date().toISOString().substring(11, 19)} UTC] KERNEL_NOTE: Running in standalone telemetry mode.`,
                  ...prev.slice(0, 8)
                ]);
              });
          });
      }, []);

      // Frame Rate Counter
      useEffect(() => {
        let frameCount = 0;
        let lastTime = performance.now();
        let animId;

        const updateFps = (now) => {
          frameCount++;
          if (now - lastTime >= 1000) {
            setFps(Math.round((frameCount * 1000) / (now - lastTime)));
            frameCount = 0;
            lastTime = now;
          }
          animId = requestAnimationFrame(updateFps);
        };

        animId = requestAnimationFrame(updateFps);
        return () => cancelAnimationFrame(animId);
      }, []);

      const activeModuleMeta = MODULE_LIST.find(m => m.id === activeMod) || MODULE_LIST[0];

      return (
        <div className="hud-container">
          {/* Top Aerospace Defense Header */}
          <header className="hud-header">
            {/* Top Security Banner */}
            <div className="hud-header-banner">
              <div>
                <span className="hud-badge">[RESTRICTED // AEROSPACE DEFENSE PROPULSION TESTBED]</span>
                <span style={{ marginLeft: "12px", letterSpacing: "1px", fontWeight: 700 }}>
                  SYS-ID: AEGIS-GT-MK4 // TELEMETRY HUD
                </span>
              </div>
              <div style={{ display: "flex", gap: "16px", alignItems: "center" }}>
                <span>FRAME RATE: <strong style={{ color: "#ffffff" }}>{fps} FPS</strong></span>
                <span>LATENCY: <strong style={{ color: "#ffffff" }}>1.2 ms</strong></span>
                <span>STATUS: <strong style={{ color: "#ffffff" }}>[{apiStatus}]</strong></span>
                <span style={{ letterSpacing: "1px" }}>{utcTime || "UTC CLOCK SYNCING..."}</span>
              </div>
            </div>

            {/* Tactical Module Selector Dropdown & Quick Strip */}
            <div className="hud-nav-bar">
              <div style={{ display: "flex", alignItems: "center", gap: "12px", flexWrap: "wrap", width: "100%", justifyContent: "space-between" }}>
                {/* Military Module Dropdown */}
                <div style={{ display: "flex", alignItems: "center", gap: "10px", minWidth: "420px" }}>
                  <span style={{ fontSize: "11px", fontWeight: 700, whiteSpace: "nowrap", color: "rgba(255, 255, 255, 0.7)" }}>
                    ACTIVE MODULE:
                  </span>
                  <select
                    className="hud-module-select"
                    value={activeMod}
                    onChange={e => {
                      const mod = e.target.value;
                      setActiveMod(mod);
                      setLogs(prev => [
                        `[${new Date().toISOString().substring(11, 19)} UTC] MODULE_SWITCH: Activated [${mod.toUpperCase()}] propulsion kernel.`,
                        ...prev.slice(0, 8)
                      ]);
                    }}
                  >
                    {MODULE_LIST.map(m => (
                      <option key={m.id} value={m.id}>
                        [{m.num}] {m.title}
                      </option>
                    ))}
                  </select>
                </div>

                {/* HUD Graphical Layer Overlay Toggles */}
                <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
                  <button
                    className={`hud-btn ${showPatent ? "hud-btn-primary" : ""}`}
                    onClick={() => setShowPatent(!showPatent)}
                    title="Toggle orthographic patent cutaway background"
                  >
                    PATENT SCHEMATIC: {showPatent ? "ON" : "OFF"}
                  </button>
                  <button
                    className={`hud-btn ${showRotor ? "hud-btn-primary" : ""}`}
                    onClick={() => setShowRotor(!showRotor)}
                    title="Toggle 60 FPS 3D wireframe rotor subsystem"
                  >
                    3D ROTOR: {showRotor ? "ON" : "OFF"}
                  </button>
                  <button
                    className={`hud-btn ${showHarmonics ? "hud-btn-primary" : ""}`}
                    onClick={() => setShowHarmonics(!showHarmonics)}
                    title="Toggle acoustic harmonic waveform telemetry"
                  >
                    ACOUSTICS: {showHarmonics ? "ON" : "OFF"}
                  </button>
                  <button
                    className={`hud-btn ${showFEA ? "hud-btn-primary" : ""}`}
                    onClick={() => setShowFEA(!showFEA)}
                    title="Inspect structural stress FEA telemetry"
                  >
                    FEA STRESS: {showFEA ? "OPEN" : "INSPECT"}
                  </button>
                </div>
              </div>

              {/* Module Quick Strip Buttons */}
              <div className="hud-quick-strip">
                {MODULE_LIST.map(m => (
                  <button
                    key={m.id}
                    className={`hud-strip-btn ${activeMod === m.id ? "active" : ""}`}
                    onClick={() => {
                      setActiveMod(m.id);
                      setLogs(prev => [
                        `[${new Date().toISOString().substring(11, 19)} UTC] MODULE_SWITCH: Switched to [${m.num}] via tactical strip.`,
                        ...prev.slice(0, 8)
                      ]);
                    }}
                  >
                    <span className="strip-num">{m.num}</span>
                    <span className="strip-title">{m.id.toUpperCase().replace("_", " ")}</span>
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Active Module Title Callout */}
          <div className="hud-module-banner">
            <div style={{ display: "flex", alignItems: "baseline", gap: "12px" }}>
              <span className="hud-module-badge">{activeModuleMeta.num}</span>
              <span className="hud-module-title">{activeModuleMeta.title}</span>
              <span className="hud-module-sub">// {activeModuleMeta.sub}</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
              <span className="hud-status-dot"></span>
              <span style={{ fontSize: "10px", letterSpacing: "1px", color: "rgba(255, 255, 255, 0.8)" }}>
                REALTIME RIGOROUS COMPUTATION ACTIVE
              </span>
            </div>
          </div>

          {/* Primary Viewport Area with Background Layers */}
          <main className="hud-main-viewport">
            {/* Background Layer 1: Orthographic Patent Engine Schematic */}
            <div className={`hud-bg-schematic ${showPatent ? "visible" : "hidden"}`}>
              <OrthographicPatentEngine />
            </div>

            {/* Background Layer 2: 3D Wireframe Rotor Subsystem */}
            {showRotor && (
              <div className="hud-bg-rotor">
                <WireframeRotorCanvas />
              </div>
            )}

            {/* Background Layer 3: Acoustic Harmonics Waveform */}
            {showHarmonics && (
              <div className="hud-bg-harmonics">
                <HarmonicsOscilloscope />
              </div>
            )}

            {/* Structural Stress FEA Modal / Panel */}
            {showFEA && (
              <FEAStressPanel onClose={() => setShowFEA(false)} />
            )}

            {/* Foreground Content: Active Module Component */}
            <div className="hud-foreground-content">
              {activeMod === "turbojet" && <TurbojetPanel />}
              {activeMod === "physics_turbofan" && <PhysicsTurbofanPanel />}
              {activeMod === "turbofan" && <TurbofanPanel />}
              {activeMod === "off_design" && <OffDesignPanel />}
              {activeMod === "meanline" && <MeanLinePanel />}
              {activeMod === "turboprop" && <TurbopropPanel />}
              {activeMod === "mission" && <MissionPanel />}
              {activeMod === "surrogate" && <SurrogatePanel />}
              {activeMod === "hybrid" && <HybridPanel />}
            </div>
          </main>

          {/* Bottom Tactical Diagnostic Footer */}
          <footer className="hud-footer">
            <div className="hud-log-stream">
              <div className="hud-log-title">// TELEMETRY LOG STREAM:</div>
              <div className="hud-log-entries">
                {logs.slice(0, 3).map((l, i) => (
                  <div key={i} className="hud-log-line">{l}</div>
                ))}
              </div>
            </div>

            <div className="hud-footer-stats">
              <span>SOLVER: <strong>CANTERA + NUMPY KERNELS</strong></span>
              <span>ATMOSPHERE: <strong>1976 ICAO STANDARD</strong></span>
              <span>CALCULATIONS: <strong>RIGOROUS / ZERO MOCKS</strong></span>
              <span>STYLE: <strong>PURE MONOCHROMATIC HUD</strong></span>
            </div>
          </footer>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       REACT APPLICATION MOUNT
       ════════════════════════════════════════════════════════════════════════ */
    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
