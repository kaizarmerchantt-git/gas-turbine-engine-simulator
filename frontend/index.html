<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>// SEC-DEF // AEROSPACE PROPULSION TELEMETRY &amp; TACTICAL FLIGHT DYNAMICS</title>

  <!-- Google Fonts: Technical Monospaced Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- React 18, Babel, Chart.js -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

  <style>
    /* ════════════════════════════════════════════════════════════════════════
       FUI / HUD MONOCHROMATIC DESIGN SYSTEM
       Strictly Monochromatic: Pure Black (#000000) & Pure White (#FFFFFF)
       Tiered Opacities: 15% (grid), 40% (secondary), 75% (primary), 100% (glow)
       ════════════════════════════════════════════════════════════════════════ */
    :root {
      --bg:        #000000;
      --op-15:     rgba(255, 255, 255, 0.15);
      --op-25:     rgba(255, 255, 255, 0.25);
      --op-40:     rgba(255, 255, 255, 0.40);
      --op-60:     rgba(255, 255, 255, 0.60);
      --op-75:     rgba(255, 255, 255, 0.75);
      --op-90:     rgba(255, 255, 255, 0.90);
      --op-100:    #ffffff;
      --font-mono: 'JetBrains Mono', 'Share Tech Mono', monospace;
      --font-tech: 'Share Tech Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg);
      color: var(--op-75);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.4;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Millimeter Blueprint Background Grid */
    body {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.09) 1px, transparent 1px);
      background-size: 10px 10px, 10px 10px, 50px 50px, 50px 50px;
      background-position: -1px -1px, -1px -1px, -1px -1px, -1px -1px;
    }

    /* Monochromatic Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
      border: 1px solid var(--op-15);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--op-40);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--op-75);
    }

    /* Top Military Classification Banner */
    .fui-header {
      background: #000000;
      border-bottom: 1px solid var(--op-40);
      padding: 6px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 500;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.95);
    }
    .fui-classification {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--op-60);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .fui-classification strong {
      color: #ffffff;
      padding: 2px 6px;
      border: 1px solid var(--op-75);
      background: rgba(255, 255, 255, 0.05);
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
    }

    .fui-nav-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fui-select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      border: 1px solid var(--op-40);
      background: #000000;
      padding: 0 8px;
      transition: all 0.2s;
    }
    .fui-select-wrapper:hover, .fui-select-wrapper:focus-within {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
    }
    .fui-select-wrapper select {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 24px 6px 4px;
      cursor: pointer;
      outline: none;
      min-width: 420px;
      letter-spacing: 0.05em;
    }
    .fui-select-wrapper select option, .fui-select-wrapper select optgroup {
      background: #000000;
      color: #ffffff;
      font-family: var(--font-mono);
    }
    .fui-select-arrow {
      position: absolute;
      right: 8px;
      pointer-events: none;
      font-size: 10px;
      color: var(--op-75);
    }

    .fui-telemetry-pill {
      font-size: 11px;
      color: var(--op-75);
      border: 1px solid var(--op-40);
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.06em;
    }
    .fui-pulse-dot {
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffffff;
      animation: pulseGlow 1.5s infinite alternate;
    }
    @keyframes pulseGlow {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1.0; transform: scale(1.2); }
    }

    /* Master Layout */
    .fui-shell {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 44px);
    }
    .fui-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      flex: 1;
      min-height: 0;
    }
    .fui-sidebar {
      border-right: 1px solid var(--op-40);
      background: rgba(0, 0, 0, 0.90);
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .fui-content {
      padding: 14px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Modular Tactical HUD Card / Frame */
    .hud-card {
      border: 1px solid var(--op-40);
      background: rgba(0, 0, 0, 0.75);
      position: relative;
    }
    .hud-card::before, .hud-card::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      border-color: #ffffff;
      pointer-events: none;
    }
    .hud-card::before {
      top: -1px;
      left: -1px;
      border-top: 1.5px solid #ffffff;
      border-left: 1.5px solid #ffffff;
    }
    .hud-card::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 1.5px solid #ffffff;
      border-right: 1.5px solid #ffffff;
    }

    .hud-hd {
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid var(--op-40);
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hud-hd-tag {
      font-size: 9px;
      color: var(--op-40);
      font-family: var(--font-tech);
    }
    .hud-bd {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Monochromatic KPI Strips */
    .hud-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }
    .hud-kpi {
      border: 1px solid var(--op-40);
      background: rgba(255, 255, 255, 0.02);
      padding: 7px 9px;
      position: relative;
    }
    .hud-kpi::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--op-40);
    }
    .hud-kpi.active::before {
      background: #ffffff;
      box-shadow: 0 0 6px #ffffff;
    }
    .hud-kpi-lbl {
      font-size: 9px;
      color: var(--op-60);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }
    .hud-kpi-val {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.02em;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.5);
    }
    .hud-kpi-unit {
      font-size: 9px;
      color: var(--op-60);
      margin-left: 2px;
    }

    /* Monochromatic Controls */
    .hud-slider-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .hud-slider-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }
    .hud-slider-lbl {
      color: var(--op-75);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .hud-slider-val {
      color: #ffffff;
      font-weight: 700;
      font-family: var(--font-tech);
    }
    .hud-slider-input {
      -webkit-appearance: none;
      width: 100%;
      height: 2px;
      background: var(--op-25);
      outline: none;
      cursor: pointer;
    }
    .hud-slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: #ffffff;
      border: 1px solid #000000;
      cursor: pointer;
      box-shadow: 0 0 5px #ffffff;
    }
    .hud-slider-input::-moz-range-thumb {
      width: 10px;
      height: 10px;
      background: #ffffff;
      border: 1px solid #000000;
      cursor: pointer;
      box-shadow: 0 0 5px #ffffff;
    }

    .hud-num-input {
      background: #000000;
      border: 1px solid var(--op-40);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 6px;
      outline: none;
      width: 100%;
    }
    .hud-num-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
    }

    .hud-mode-tog {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      border: 1px solid var(--op-40);
      background: #000000;
    }
    .hud-mode-btn {
      padding: 5px 8px;
      background: transparent;
      border: none;
      border-right: 1px solid var(--op-40);
      color: var(--op-60);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.15s;
    }
    .hud-mode-btn:last-child {
      border-right: none;
    }
    .hud-mode-btn.active {
      background: #ffffff;
      color: #000000;
      font-weight: 800;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
    }

    .hud-btn {
      padding: 7px 14px;
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
    }
    .hud-btn:hover:not(:disabled) {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
    }
    .hud-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .hud-btn-ghost {
      border-color: var(--op-40);
      color: var(--op-75);
    }
    .hud-btn-ghost:hover:not(:disabled) {
      background: var(--op-15);
      color: #ffffff;
      border-color: #ffffff;
    }

    /* Monochromatic Tables */
    .hud-table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--op-40);
    }
    .hud-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      background: #000000;
    }
    .hud-table th {
      background: rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid var(--op-40);
      padding: 6px 8px;
      text-align: left;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: var(--font-tech);
    }
    .hud-table td {
      padding: 5px 8px;
      border-bottom: 1px solid var(--op-15);
      color: var(--op-75);
      font-family: var(--font-mono);
    }
    .hud-table tr:hover td {
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
    }
    .hud-table td strong {
      color: #ffffff;
    }

    /* Monochromatic Alerts */
    .hud-alert {
      border: 1px solid var(--op-40);
      background: rgba(255, 255, 255, 0.03);
      padding: 7px 10px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--op-75);
    }
    .hud-alert.active {
      border-color: #ffffff;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }
    .hud-alert.warn {
      border-style: dashed;
      border-color: #ffffff;
      color: #ffffff;
      animation: pulseGlow 2s infinite alternate;
    }

    .hud-chart-card {
      background: #000000;
      border: 1px solid var(--op-40);
      padding: 10px;
      margin-top: 6px;
    }
    .hud-chart-title {
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    /* Spinner */
    .hud-spin {
      display: inline-block;
      width: 9px;
      height: 9px;
      border: 1.5px solid var(--op-40);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Tactical Telemetry Log at Bottom */
    .hud-log-stream {
      background: #000000;
      border-top: 1px solid var(--op-40);
      padding: 4px 18px;
      font-size: 10px;
      font-family: var(--font-tech);
      color: var(--op-60);
      display: flex;
      justify-content: space-between;
      letter-spacing: 0.05em;
    }
    .hud-log-stream strong {
      color: #ffffff;
    }

    /* ════════════════════════════════════════════════════════════════════════
       AEROSPACE DEFENSE FUI / HUD LAYOUT & VIEWPORT RULES
       ════════════════════════════════════════════════════════════════════════ */
    .hud-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #000000;
      position: relative;
      overflow-x: hidden;
    }

    .hud-header {
      background: #000000;
      border-bottom: 1px solid var(--op-40);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .hud-header-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--op-15);
      font-size: 11px;
      font-family: var(--font-tech);
      color: var(--op-75);
    }
    .hud-badge {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid #ffffff;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .hud-nav-bar {
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #000000;
    }
    .hud-module-select {
      flex: 1;
      background: #000000;
      border: 1px solid #ffffff;
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
    }
    .hud-module-select option {
      background: #000000;
      color: #ffffff;
    }

    .hud-quick-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .hud-strip-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--op-40);
      color: var(--op-60);
      font-family: var(--font-mono);
      padding: 4px 8px;
      font-size: 9px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      gap: 5px;
      align-items: center;
      transition: all 0.15s;
    }
    .hud-strip-btn:hover {
      border-color: #ffffff;
      color: #ffffff;
    }
    .hud-strip-btn.active {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
      font-weight: 700;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }
    .hud-strip-btn .strip-num {
      font-weight: 700;
    }

    .hud-module-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid var(--op-25);
      background: rgba(255, 255, 255, 0.02);
    }
    .hud-module-badge {
      border: 1px solid #ffffff;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
    }
    .hud-module-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
    }
    .hud-module-sub {
      font-size: 10px;
      color: var(--op-60);
      font-family: var(--font-tech);
    }
    .hud-status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px #ffffff;
      animation: pulseGlow 1.5s infinite alternate;
    }

    .hud-main-viewport {
      flex: 1;
      position: relative;
      min-height: calc(100vh - 160px);
      padding: 16px;
    }

    .hud-bg-schematic {
      position: fixed;
      top: 130px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 170px);
      pointer-events: none;
      z-index: 1;
      opacity: 0.18;
      transition: opacity 0.3s;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hud-bg-schematic.hidden {
      display: none;
    }
    .hud-bg-schematic.visible {
      display: flex;
    }

    .hud-bg-rotor {
      position: fixed;
      bottom: 50px;
      right: 20px;
      width: 320px;
      height: 320px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.65;
    }

    .hud-bg-harmonics {
      position: fixed;
      bottom: 50px;
      left: 20px;
      width: 280px;
      height: 120px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.70;
    }

    .hud-foreground-content {
      position: relative;
      z-index: 10;
    }

    .hud-panel-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1100px) {
      .hud-panel-grid {
        grid-template-columns: 1fr;
      }
    }
    .hud-sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hud-main-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .hud-card-hd {
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid var(--op-40);
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hud-card-bd {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-btn-primary {
      background: #ffffff !important;
      color: #000000 !important;
      font-weight: 800 !important;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6) !important;
    }
    .hud-btn-primary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.85) !important;
    }

    .hud-label {
      font-size: 9px;
      color: var(--op-60);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 3px;
      display: block;
    }
    .hud-select {
      width: 100%;
      background: #000000;
      border: 1px solid var(--op-40);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 8px;
      outline: none;
    }
    .hud-select:focus {
      border-color: #ffffff;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
    }

    .hud-table-container {
      overflow-x: auto;
      border: 1px solid var(--op-40);
    }
    .hud-th {
      background: rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid var(--op-40);
      padding: 6px 8px;
      text-align: left;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: var(--font-tech);
      font-size: 10px;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const API = "";  // Relative path connects seamlessly to active backend

    const fmt = (n, d = 2) => {
      if (n == null || isNaN(n)) return "---";
      return Number(n).toFixed(d);
    };

    const downloadCSV = (text, filename) => {
      const blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    };

    /* ════════════════════════════════════════════════════════════════════════
       3D ROTATING WIREFRAME ROTOR SUBSYSTEM (J.A.R.V.I.S. HUD DYNAMICS)
       60 FPS 3D perspective projection rendered via Canvas
       ════════════════════════════════════════════════════════════════════════ */
    function WireframeRotorCanvas({ rpm = 12000, label = "HPT ROTOR BLISK // STA 41" }) {
      const canvasRef = useRef(null);
      const angleRef = useRef(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let animId;

        // Generate 3D points for an axial bladed rotor disk
        const nBlades = 14;
        const hubR = 26;
        const tipR = 64;
        const depth = 16;
        const points = [];
        const edges = [];

        // Hub ring vertices (front and back)
        for (let i = 0; i < nBlades; i++) {
          const a = (i / nBlades) * Math.PI * 2;
          const cos = Math.cos(a), sin = Math.sin(a);
          // Front hub vertex
          points.push({ x: cos * hubR, y: sin * hubR, z: -depth / 2 });
          // Back hub vertex
          points.push({ x: cos * hubR, y: sin * hubR, z: depth / 2 });
          // Hub circumference edges
          const next = (i + 1) % nBlades;
          edges.push([i * 2, next * 2]);
          edges.push([i * 2 + 1, next * 2 + 1]);
          edges.push([i * 2, i * 2 + 1]);

          // Blade tip vertices
          const twist = 0.25;
          const tipIdx1 = points.length;
          points.push({ x: Math.cos(a - twist) * tipR, y: Math.sin(a - twist) * tipR, z: -depth / 2 });
          const tipIdx2 = points.length;
          points.push({ x: Math.cos(a + twist) * tipR, y: Math.sin(a + twist) * tipR, z: depth / 2 });

          // Blade edges from hub to tip
          edges.push([i * 2, tipIdx1]);
          edges.push([i * 2 + 1, tipIdx2]);
          edges.push([tipIdx1, tipIdx2]);
        }

        const render = () => {
          const w = canvas.width;
          const h = canvas.height;
          ctx.clearRect(0, 0, w, h);

          // Speed based on RPM
          const speed = Math.max(0.015, Math.min(0.06, (rpm / 16000) * 0.04));
          angleRef.current += speed;
          const theta = angleRef.current;
          const phi = 0.38; // Tilted downward for isometric/perspective view

          const cx = w / 2;
          const cy = h / 2;
          const fov = 180;

          // Project points
          const proj = points.map(p => {
            // Y rotation
            const x1 = p.x * Math.cos(theta) + p.z * Math.sin(theta);
            const z1 = -p.x * Math.sin(theta) + p.z * Math.cos(theta);
            // X rotation tilt
            const y2 = p.y * Math.cos(phi) - z1 * Math.sin(phi);
            const z2 = p.y * Math.sin(phi) + z1 * Math.cos(phi);

            const scale = fov / (fov + z2 + 90);
            return {
              x: cx + x1 * scale,
              y: cy + y2 * scale,
              z: z2,
              scale
            };
          });

          // Draw outer HUD tracking ring
          ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx, cy, 74, 0, Math.PI * 2);
          ctx.stroke();

          // Reticle tick lines
          ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
          ctx.beginPath();
          ctx.moveTo(cx - 78, cy); ctx.lineTo(cx - 68, cy);
          ctx.moveTo(cx + 68, cy); ctx.lineTo(cx + 78, cy);
          ctx.moveTo(cx, cy - 78); ctx.lineTo(cx, cy - 78 + 10);
          ctx.moveTo(cx, cy + 68); ctx.lineTo(cx, cy + 78);
          ctx.stroke();

          // Draw 3D wireframe edges
          edges.forEach(([i1, i2]) => {
            const p1 = proj[i1], p2 = proj[i2];
            const avgZ = (p1.z + p2.z) / 2;
            const alpha = Math.max(0.18, Math.min(0.95, 0.65 - avgZ * 0.007));
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
            ctx.lineWidth = alpha > 0.6 ? 1.4 : 0.9;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          });

          animId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animId);
      }, [rpm]);

      return (
        <div className="hud-card" style={{margin:0}}>
          <div className="hud-hd">
            <span>[3D-ROT] {label}</span>
            <span className="hud-hd-tag">60.0 FPS</span>
          </div>
          <div style={{position:"relative", background:"#000000", display:"flex", justifyContent:"center", alignItems:"center", padding:4}}>
            <canvas ref={canvasRef} width={220} height={165} style={{width:220, height:165}} />
            <div style={{position:"absolute", bottom:4, left:8, fontSize:9, color:"var(--op-60)", fontFamily:"var(--font-tech)"}}>
              SPD: <strong style={{color:"#ffffff"}}>{fmt(rpm,0)} RPM</strong> // AZ: 360° CONT
            </div>
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       HARMONIC FREQUENCY OSCILLOSCOPE (ACOUSTIC / TURBULENCE TELEMETRY)
       ════════════════════════════════════════════════════════════════════════ */
    function HarmonicOscilloscopeCanvas({ freq = 420.0, label = "ACOUSTIC COMBUSTION HARMONICS" }) {
      const canvasRef = useRef(null);
      const timeRef = useRef(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let animId;

        const render = () => {
          const w = canvas.width;
          const h = canvas.height;
          ctx.clearRect(0, 0, w, h);

          timeRef.current += 0.04;
          const t = timeRef.current;
          const midY = h / 2;

          // Millimeter grid
          ctx.strokeStyle = "rgba(255, 255, 255, 0.10)";
          ctx.lineWidth = 1;
          for (let x = 0; x < w; x += 20) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
          }
          for (let y = 0; y < h; y += 15) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
          }

          // Centerline
          ctx.strokeStyle = "rgba(255, 255, 255, 0.30)";
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(w, midY); ctx.stroke();
          ctx.setLineDash([]);

          // Sine Waveform
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (let x = 0; x < w; x++) {
            const k1 = 0.05, k2 = 0.12;
            const y = midY + Math.sin(x * k1 + t * 4) * 18 + Math.sin(x * k2 - t * 2.5) * 8;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          animId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animId);
      }, [freq]);

      return (
        <div className="hud-card" style={{margin:0}}>
          <div className="hud-hd">
            <span>[WAV-01] {label}</span>
            <span className="hud-hd-tag">{fmt(freq, 1)} HZ</span>
          </div>
          <div style={{background:"#000000", padding:4}}>
            <canvas ref={canvasRef} width={220} height={70} style={{width:"100%", height:70}} />
          </div>
        </div>
      );
    }

                <div style={{fontFamily:"var(--font-tech)", fontSize:15, fontWeight:700, color:"#ffffff"}}>
                  {fmt(vonMises, 1)} MPa
                </div>
              </div>
              <div>
                <div style={{color:"var(--op-60)", fontSize:9}}>THERMAL GRADIENT (∇T)</div>
                <div style={{fontFamily:"var(--font-tech)", fontSize:15, fontWeight:700, color:"#ffffff"}}>
                  {fmt(thermGrad, 1)} K/mm
                </div>
              </div>

            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, borderTop:"1px solid var(--op-15)", paddingTop:6}}>
              <div>
                <div style={{color:"var(--op-60)", fontSize:9}}>CREEP LIFE MARGIN</div>
                <div style={{fontFamily:"var(--font-tech)", fontSize:13, fontWeight:700, color:"#ffffff"}}>
                  {fmt(creepLife, 1)}% [TBC PASS]
                </div>

    }

    /* ════════════════════════════════════════════════════════════════════════
       REUSABLE MONOCHROME CHART.JS HOOK
       Strict monochromatic styling: Pure black background, white lines
       ════════════════════════════════════════════════════════════════════════ */
    function useMonochromeChart(canvasRef, type, chartData, options) {
      const chartInst = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !chartData) return;
        if (chartInst.current) chartInst.current.destroy();

        const defaultOpts = {
          animation: false,
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              display: true,
              labels: {
                color: "rgba(255, 255, 255, 0.75)",
                font: { family: "'JetBrains Mono', monospace", size: 10 },
                boxWidth: 10
              }
            },
            tooltip: {
              backgroundColor: "#000000",
              borderColor: "rgba(255, 255, 255, 0.75)",
              borderWidth: 1,
              titleFont: { family: "'JetBrains Mono', monospace", size: 10 },
              bodyFont: { family: "'JetBrains Mono', monospace", size: 10 },
              titleColor: "#ffffff",
              bodyColor: "#ffffff",
              cornerRadius: 0
            }
          },
          scales: {
            x: {
              type: "linear",
              ticks: { color: "rgba(255, 255, 255, 0.60)", font: { family: "'Share Tech Mono', monospace", size: 9 } },
              grid: { color: "rgba(255, 255, 255, 0.12)" },
              border: { color: "rgba(255, 255, 255, 0.40)" }
            },
            y: {
              ticks: { color: "rgba(255, 255, 255, 0.60)", font: { family: "'Share Tech Mono', monospace", size: 9 } },
              grid: { color: "rgba(255, 255, 255, 0.12)" },
              border: { color: "rgba(255, 255, 255, 0.40)" }
            }
          }
        };

        const mergedOpts = { ...defaultOpts, ...options, plugins: { ...defaultOpts.plugins, ...options?.plugins }, scales: { ...defaultOpts.scales, ...options?.scales } };

        chartInst.current = new Chart(canvasRef.current, {
          type,
          data: chartData,
          options: mergedOpts
        });

        return () => {
          if (chartInst.current) chartInst.current.destroy();
        };
      }, [canvasRef, chartData, type]);
    }

    /* ════════════════════════════════════════════════════════════════════════
       STATION THERMODYNAMICS MATRIX (ARP 755A COMPLIANT)
       ════════════════════════════════════════════════════════════════════════ */
    function StationTable({ stations }) {
      if (!stations) return null;
      const ORDER = ["0", "a", "1", "2", "13", "21", "25", "3", "4", "41", "45", "5", "8", "9", "18", "19"];
      return (
        <div className="hud-table-wrapper">
          <table className="hud-table">
            <thead>
              <tr>
                <th>STN</th>
                <th>DESIGNATION</th>
                <th>MACH</th>
                <th>VEL [M/S]</th>
                <th>T₀ [K]</th>
                <th>Ts [K]</th>
                <th>P₀ [KPA]</th>
                <th>Ps [KPA]</th>
                <th>s [J/KG·K]</th>
              </tr>
            </thead>
            <tbody>
              {ORDER.filter(id => stations[id]).map(id => {
                const s = stations[id];
                const mach = s.Mach != null ? s.Mach : (s.M != null ? s.M : null);
                const t0 = s.T_K != null ? s.T_K : (s.T_total_K != null ? s.T_total_K : null);
                const p0 = s.p_kPa != null ? s.p_kPa : (s.P_total_kPa != null ? s.P_total_kPa : (s.P_atm != null ? s.P_atm * 101.325 : null));
                const ts = s.Ts_K != null ? s.Ts_K : (s.T_static_K != null ? s.T_static_K : (t0 != null && mach != null ? t0 / (1.0 + 0.2 * mach * mach) : null));
                const ps = s.ps_kPa != null ? s.ps_kPa : (s.P_static_kPa != null ? s.P_static_kPa : (p0 != null && mach != null ? p0 / Math.pow(1.0 + 0.2 * mach * mach, 3.5) : null));
                const v = s.V_ms != null ? s.V_ms : (mach != null && ts != null ? mach * Math.sqrt(1.4 * 287.05 * Math.max(10, ts)) : null);
                const ent = s.s_JkgK != null ? s.s_JkgK : null;

                return (
                  <React.Fragment key={id}>
                    <tr>
                      <td><strong>[{id}]</strong></td>
                      <td>{s.label}</td>
                      <td>{mach != null ? fmt(mach, 3) : "---"}</td>
                      <td>{v != null ? fmt(v, 1) : "---"}</td>
                      <td><strong style={{color:"#ffffff"}}>{t0 != null ? fmt(t0, 1) : "---"}</strong></td>
                      <td>{ts != null ? fmt(ts, 1) : "---"}</td>
                      <td>{p0 != null ? fmt(p0, 1) : "---"}</td>
                      <td>{ps != null ? fmt(ps, 1) : "---"}</td>
                      <td>{ent != null ? fmt(ent, 0) : "---"}</td>
                    </tr>
                    {s.combustion_metrics && (
                      <tr style={{background: "rgba(255,255,255,0.03)"}}>
                        <td colSpan="9" style={{padding: "6px 12px", borderBottom: "1px solid var(--op-40)"}}>
                          <div style={{display:"flex", gap:16, fontSize:10, color:"var(--op-75)"}}>
                            <span>STATE: <strong style={{color:"#ffffff"}}>{s.combustion_metrics.burn_state}</strong> (Φ = {Number(s.combustion_metrics.equivalence_ratio).toFixed(3)})</span>
                            <span>FAR: <strong style={{color:"#ffffff"}}>{Number(s.combustion_metrics.fuel_air_ratio).toFixed(4)}</strong></span>
                            <span>EI NOx: <strong style={{color:"#ffffff"}}>{Number(s.combustion_metrics.emissions_EI?.NOx ?? 0).toFixed(1)} g/kg</strong></span>
                            <span>EI CO: <strong style={{color:"#ffffff"}}>{Number(s.combustion_metrics.emissions_EI?.CO ?? 0).toFixed(1)} g/kg</strong></span>
                            <span>EI CO₂: <strong style={{color:"#ffffff"}}>{Number(s.combustion_metrics.emissions_EI?.CO2 ?? 0).toFixed(1)} g/kg</strong></span>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MONOCHROMATIC BRAYTON T-s DIAGRAM
       ════════════════════════════════════════════════════════════════════════ */
    function TsDiagram({ tsData, stations }) {
      const ref = useRef(null);
      let pts = tsData?.points;
      if ((!pts || pts.length === 0) && stations) {
        const ORDER = ["0", "a", "1", "2", "13", "21", "25", "3", "4", "41", "45", "5", "8", "9", "18", "19"];
        pts = [];
        for (const sid of ORDER) {
          if (stations[sid]) {
            const s = stations[sid];
            pts.push({
              station: sid,
              label: s.label || `Sta ${sid}`,
              T_K: s.T_K ?? s.T_total_K ?? 300,
              s_JkgK: s.s_JkgK ?? 1000,
              P_atm: s.P_atm ?? (s.p_kPa ? s.p_kPa / 101.325 : 1.0),
              stream: (sid === "13" || sid === "18" || sid === "19") ? "bypass" : "core"
            });
          }
        }
      }
      pts = pts ?? [];

      const hasBypass = pts.some(p => p.stream === "bypass");
      const corePts = hasBypass ? pts.filter(p => p.stream !== "bypass") : pts;
      const bypPts = hasBypass ? pts.filter(p => p.stream === "bypass") : [];
      const st2 = pts.find(p => p.station === "2");
      const bypLine = (hasBypass && st2) ? [st2, ...bypPts] : bypPts;

      const datasets = [];
      if (corePts.length > 0) {
        datasets.push({
          label: "CORE BRAYTON CYCLE",
          data: corePts.map(p => ({ x: p.s_JkgK, y: p.T_K })),
          borderColor: "#ffffff",
          backgroundColor: "rgba(255, 255, 255, 0.08)",
          fill: false,
          showLine: true,
          tension: 0.15,
          pointRadius: 4,
          pointBackgroundColor: "#ffffff",
          borderWidth: 1.8
        });
      }
      if (bypLine.length > 0) {
        datasets.push({
          label: "BYPASS DUCT EXPANSION",
          data: bypLine.map(p => ({ x: p.s_JkgK, y: p.T_K })),
          borderColor: "rgba(255, 255, 255, 0.60)",
          borderDash: [5, 4],
          fill: false,
          showLine: true,
          tension: 0.15,
          pointRadius: 4,
          pointBackgroundColor: "rgba(255, 255, 255, 0.60)",
          borderWidth: 1.4
        });
      }

      const chartData = datasets.length > 0 ? { datasets } : null;
      const opts = {
        scales: {
          x: { type: "linear", title: { display: true, text: "SPECIFIC ENTROPY s [J/(kg·K)]", color: "rgba(255,255,255,0.75)" } },
          y: { title: { display: true, text: "TOTAL TEMPERATURE T [K]", color: "rgba(255,255,255,0.75)" } }
        }
      };

      useMonochromeChart(ref, "line", chartData, opts);
      if (!pts.length) return null;

      return (
        <div className="hud-chart-card">
          <div className="hud-chart-title">
            <span>[DIAG-TS] BRAYTON CYCLE T–s ENTROPY-TEMPERATURE PROJECTION</span>
            <span>STA: 0 → 8</span>
          </div>
          <canvas ref={ref} />
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       MONOCHROMATIC COMPRESSOR MAP (OFF-DESIGN SURGE MARGIN)

    /* ════════════════════════════════════════════════════════════════════════
       MONOCHROMATIC DYNAMIC VELOCITY TRIANGLES (MEAN-LINE KINEMATICS)
       Euler Turbomachinery Equation: Δh₀ = U · ΔC_θ
       Dynamically updates on angle slider moves!
       ════════════════════════════════════════════════════════════════════════ */
    function VelocityTrianglesSvg({ inlet, exit, type = "compressor" }) {
      if (!inlet || !exit) return null;
      const U = inlet.U || exit.U || 350;
      const Ca1 = inlet.C_a ?? inlet.Ca ?? 180;
      const Ctheta1 = inlet.C_theta ?? inlet.Ctheta ?? 0;
      const Ca2 = exit.C_a ?? exit.Ca ?? 175;
      const Ctheta2 = exit.C_theta ?? exit.Ctheta ?? 120;

      const allVals = [
        U, Ca1, Ca2,
        Math.abs(Ctheta1), Math.abs(Ctheta2),
        Math.abs(inlet.C || 0), Math.abs(exit.C || 0),
        Math.abs(inlet.W || 0), Math.abs(exit.W || 0),
        Math.abs(inlet.W_theta || 0), Math.abs(exit.W_theta || 0)
      ];
      const maxVel = Math.max(...allVals, 100);
      const scale = 115 / maxVel;

      const y0 = 195;
      const x1_start = 85;
      const u1_len = U * scale;
      const ca1_len = Ca1 * scale;
      const ct1_len = Ctheta1 * scale;

      const x2_start = 390;
      const u2_len = U * scale;
      const ca2_len = Ca2 * scale;
      const ct2_len = Ctheta2 * scale;

      const isTurb = type === "turbine";
      const st1Label = isTurb ? "STATION 2: STATOR EXIT (NGV)" : "STATION 1: ROTOR INLET";
      const st2Label = isTurb ? "STATION 3: ROTOR EXIT" : "STATION 2: ROTOR EXIT";
      const c1Text = isTurb ? `C₂=${fmt(inlet.C,0)} (α₂=${fmt(inlet.alpha_deg,1)}°)` : `C₁=${fmt(inlet.C,0)} (α₁=${fmt(inlet.alpha_deg,1)}°)`;
      const w1Text = isTurb ? `W₂=${fmt(inlet.W,0)} (β₂=${fmt(inlet.beta_deg,1)}°)` : `W₁=${fmt(inlet.W,0)} (β₁=${fmt(inlet.beta_deg,1)}°)`;
      const c2Text = isTurb ? `C₃=${fmt(exit.C,0)} (α₃=${fmt(exit.alpha_deg,1)}°)` : `C₂=${fmt(exit.C,0)} (α₂=${fmt(exit.alpha_deg,1)}°)`;
      const w2Text = isTurb ? `W₃=${fmt(exit.W,0)} (β₃=${fmt(exit.beta_deg,1)}°)` : `W₂=${fmt(exit.W,0)} (β₂=${fmt(exit.beta_deg,1)}°)`;

      return (
        <div className="hud-card" style={{marginTop: 8}}>
          <div className="hud-hd">
            <span>[AERO-VEC] MEAN-LINE VELOCITY TRIANGLES (EULER TURBOMACHINERY)</span>
            <span className="hud-hd-tag">Δh₀ = U · (Cθ₂ - Cθ₁)</span>
          </div>
          <div style={{background: "#000000", padding: 10}}>
            <svg viewBox="0 0 680 230" style={{width: "100%", maxHeight: 230}}>
              <defs>
                <marker id="arr-u" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M0,0 L6,3 L0,6 Z" fill="#ffffff" />
                </marker>
                <marker id="arr-c" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M0,0 L6,3 L0,6 Z" fill="rgba(255,255,255,0.75)" />
                </marker>
                <marker id="arr-w" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M0,0 L6,3 L0,6 Z" fill="rgba(255,255,255,0.45)" />
                </marker>
              </defs>

              {/* Legend */}
              <g transform="translate(20, 16)">
                <line x1="0" y1="0" x2="25" y2="0" stroke="#ffffff" strokeWidth="2.5" markerEnd="url(#arr-u)"/>
                <text x="32" y="4" fill="#ffffff" fontSize="10" fontFamily="var(--font-mono)">U (BLADE SPEED)</text>
                <line x1="160" y1="0" x2="185" y2="0" stroke="rgba(255,255,255,0.75)" strokeWidth="2" markerEnd="url(#arr-c)"/>
                <text x="192" y="4" fill="rgba(255,255,255,0.75)" fontSize="10" fontFamily="var(--font-mono)">C (ABSOLUTE VEL)</text>
                <line x1="330" y1="0" x2="355" y2="0" stroke="rgba(255,255,255,0.45)" strokeWidth="1.8" strokeDasharray="3,2" markerEnd="url(#arr-w)"/>
                <text x="362" y="4" fill="rgba(255,255,255,0.45)" fontSize="10" fontFamily="var(--font-mono)">W (RELATIVE VEL)</text>
              </g>

              {/* Station 1 */}
              <text x={x1_start} y="50" fill="rgba(255,255,255,0.5)" fontSize="10" fontWeight="700">{st1Label}</text>
              <line x1={x1_start} y1={y0} x2={x1_start + u1_len} y2={y0} stroke="#ffffff" strokeWidth="2.5" markerEnd="url(#arr-u)"/>
              <text x={x1_start + u1_len/2 - 12} y={y0 + 16} fill="#ffffff" fontSize="10" fontFamily="var(--font-tech)">U={fmt(U,0)}</text>
              <line x1={x1_start} y1={y0} x2={x1_start + ct1_len} y2={y0 - ca1_len} stroke="rgba(255,255,255,0.75)" strokeWidth="2" markerEnd="url(#arr-c)"/>
              <text x={x1_start + ct1_len/2 - 20} y={y0 - ca1_len/2} fill="rgba(255,255,255,0.9)" fontSize="10" fontFamily="var(--font-tech)">{c1Text}</text>
              <line x1={x1_start + u1_len} y1={y0} x2={x1_start + ct1_len} y2={y0 - ca1_len} stroke="rgba(255,255,255,0.45)" strokeWidth="1.8" strokeDasharray="3,2" markerEnd="url(#arr-w)"/>
              <text x={x1_start + u1_len/2 + 8} y={y0 - ca1_len/2} fill="rgba(255,255,255,0.6)" fontSize="10" fontFamily="var(--font-tech)">{w1Text}</text>

              {/* Station 2 */}
              <text x={x2_start} y="50" fill="rgba(255,255,255,0.5)" fontSize="10" fontWeight="700">{st2Label}</text>
              <line x1={x2_start} y1={y0} x2={x2_start + u2_len} y2={y0} stroke="#ffffff" strokeWidth="2.5" markerEnd="url(#arr-u)"/>
              <text x={x2_start + u2_len/2 - 12} y={y0 + 16} fill="#ffffff" fontSize="10" fontFamily="var(--font-tech)">U={fmt(U,0)}</text>
              <line x1={x2_start} y1={y0} x2={x2_start + ct2_len} y2={y0 - ca2_len} stroke="rgba(255,255,255,0.75)" strokeWidth="2" markerEnd="url(#arr-c)"/>
              <text x={x2_start + ct2_len/2 - 25} y={y0 - ca2_len/2 - 8} fill="rgba(255,255,255,0.9)" fontSize="10" fontFamily="var(--font-tech)">{c2Text}</text>
              <line x1={x2_start + u2_len} y1={y0} x2={x2_start + ct2_len} y2={y0 - ca2_len} stroke="rgba(255,255,255,0.45)" strokeWidth="1.8" strokeDasharray="3,2" markerEnd="url(#arr-w)"/>
              <text x={x2_start + u2_len/2 + 15} y={y0 - ca2_len/2} fill="rgba(255,255,255,0.6)" fontSize="10" fontFamily="var(--font-tech)">{w2Text}</text>
            </svg>
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════════════
       ANNULUS CASING TAPERING FLOWPATH SVG
       ════════════════════════════════════════════════════════════════════════ */
    function AnnulusSvg({ stages }) {
      if (!stages || !stages.length) return null;
      const n = stages.length;
      const w = 620, h = 160;
      const xStart = 50, xEnd = 570;
      const dx = n > 1 ? (xEnd - xStart) / (n - 1) : 0;

      const getTip = s => s.tip_radius_mm ?? s.geometry?.r_tip_out_mm ?? s.geometry?.r_tip_in_mm ?? 320;
      const getHub = s => s.hub_radius_mm ?? s.geometry?.r_hub_out_mm ?? s.geometry?.r_hub_in_mm ?? 220;
      const getBladeH = s => s.blade_height_mm ?? s.geometry?.blade_height_out_mm ?? (getTip(s) - getHub(s));

      const maxTip = Math.max(...stages.map(getTip));
      const minHub = Math.min(...stages.map(getHub));
      const toY = r => h - 25 - ((r - minHub) / Math.max(10, maxTip - minHub + 30)) * (h - 50);

      const tipCoords = stages.map((s, i) => [xStart + i * dx, toY(getTip(s))]);
      const hubCoords = stages.map((s, i) => [xStart + i * dx, toY(getHub(s))]);
      const tipPts = tipCoords.map(p => `${p[0]},${p[1]}`).join(" ");
      const hubPtsRev = [...hubCoords].reverse().map(p => `${p[0]},${p[1]}`).join(" ");
      const polygonPts = `${tipPts} ${hubPtsRev}`;

      return (
        <div className="hud-card" style={{marginTop: 8}}>
          <div className="hud-hd">
            <span>[CASING-ANN] MULTI-STAGE ANNULUS CASING CONVERGENCE</span>
            <span className="hud-hd-tag">A = ṁ / (ρ · Ca)</span>
          </div>
          <div style={{background: "#000000", padding: 8}}>
            <svg viewBox={`0 0 ${w} ${h}`} style={{width: "100%", maxHeight: 160}}>
              <polygon points={polygonPts} fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.4)" strokeWidth="1" />
              <polyline points={tipPts} fill="none" stroke="#ffffff" strokeWidth="1.8" />
              <polyline points={hubCoords.map(p => `${p[0]},${p[1]}`).join(" ")} fill="none" stroke="rgba(255, 255, 255, 0.6)" strokeWidth="1.8" strokeDasharray="4,2"/>
              {stages.map((s, i) => {
                const x = xStart + i * dx;
                const yTip = toY(getTip(s));
                const yHub = toY(getHub(s));
                return (
                  <g key={i}>
                    <line x1={x} y1={yTip} x2={x} y2={yHub} stroke="rgba(255,255,255,0.2)" strokeDasharray="2,2" />
                    <circle cx={x} cy={yTip} r="2.5" fill="#ffffff" />
                    <circle cx={x} cy={yHub} r="2.5" fill="rgba(255,255,255,0.6)" />
                    <text x={x} y={h - 6} fill="rgba(255,255,255,0.6)" fontSize="8" textAnchor="middle" fontFamily="var(--font-tech)">
                      S{s.stage_num}:{fmt(getBladeH(s),0)}mm
                    </text>
                  </g>
                );
              })}
              <text x="20" y="20" fill="#ffffff" fontSize="9" fontFamily="var(--font-tech)">── TIP (OUTER CASING)</text>
              <text x="170" y="20" fill="rgba(255,255,255,0.6)" fontSize="9" fontFamily="var(--font-tech)">- - HUB CONTOUR</text>
            </svg>
          </div>
        </div>
      );

       TURBOPROP MONOCHROMATIC SWEEP CHARTS
       ════════════════════════════════════════════════════════════════════════ */
    function TurbopropSweepCharts({ sweepData, param }) {
      const r1 = useRef(null), r2 = useRef(null), r3 = useRef(null), r4 = useRef(null);
      const pts = sweepData?.points || [];

      const xLabel = param === "mach" ? "FLIGHT MACH"
                   : param === "altitude" ? "ALTITUDE [M]"
                   : param === "pi_c" ? "COMPRESSOR PR (π_c)"
                   : "TIT [K]";

      const getX = p => p.sweep_val ?? p.Mach ?? p.mach ?? p.altitude_m ?? p.pi_c ?? p.T04;
      const pwrPts = pts.map(p => ({ x: getX(p), y: p.P_shaft_shp ?? p.SHP }));
      const psfcPts = pts.map(p => ({ x: getX(p), y: p.PSFC_kg_kWh }));
      const thrustPts = pts.map(p => ({ x: getX(p), y: p.total_thrust_kN ?? (p.total_thrust_N ? p.total_thrust_N / 1000 : 0) }));
      const effPts = pts.map(p => ({ x: getX(p), y: (p.propeller_efficiency ?? p.eta_prop ?? 0) * 100 }));

      const mkData = (label, data) => ({
        datasets: [{
          label, data, borderColor: "#ffffff", backgroundColor: "rgba(255,255,255,0.06)", fill: true, tension: 0.2, pointRadius: 3
        }]
      });

      useMonochromeChart(r1, "line", pwrPts.length ? mkData("SHAFT POWER [SHP]", pwrPts) : null, { scales: { x: { title: { display: true, text: xLabel, color: "rgba(255,255,255,0.75)" } }, y: { title: { display: true, text: "SHP", color: "rgba(255,255,255,0.75)" } } } });
      useMonochromeChart(r2, "line", psfcPts.length ? mkData("PSFC [KG/(KW·H)]", psfcPts) : null, { scales: { x: { title: { display: true, text: xLabel, color: "rgba(255,255,255,0.75)" } }, y: { title: { display: true, text: "PSFC", color: "rgba(255,255,255,0.75)" } } } });
      useMonochromeChart(r3, "line", thrustPts.length ? mkData("TOTAL THRUST [KN]", thrustPts) : null, { scales: { x: { title: { display: true, text: xLabel, color: "rgba(255,255,255,0.75)" } }, y: { title: { display: true, text: "THRUST [KN]", color: "rgba(255,255,255,0.75)" } } } });
      useMonochromeChart(r4, "line", effPts.length ? mkData("PROP EFFICIENCY [%]", effPts) : null, { scales: { x: { title: { display: true, text: xLabel, color: "rgba(255,255,255,0.75)" } }, y: { title: { display: true, text: "η_prop [%]", color: "rgba(255,255,255,0.75)" } } } });

      return (
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginTop:8}}>
          <div className="hud-chart-card"><div className="hud-chart-title"><span>[SWP-01] SHAFT POWER</span><span>SHP</span></div><canvas ref={r1}/></div>
          <div className="hud-chart-card"><div className="hud-chart-title"><span>[SWP-02] FUEL CONSUMPTION</span><span>PSFC</span></div><canvas ref={r2}/></div>
          <div className="hud-chart-card"><div className="hud-chart-title"><span>[SWP-03] COMBINED THRUST</span><span>TOTAL F</span></div><canvas ref={r3}/></div>
          <div className="hud-chart-card"><div className="hud-chart-title"><span>[SWP-04] PROPELLER DYNAMICS</span><span>η_p</span></div><canvas ref={r4}/></div>
        </div>
      );
    }

      const data = [{ x: 0, y: 0 }, ...pts];
      const chartData = pts.length ? {

          label: "FLIGHT ALTITUDE TRAJECTORY [M]",
          data, borderColor: "#ffffff", backgroundColor: "rgba(255,255,255,0.06)", fill: true, tension: 0.2, pointRadius: 3
        }]

      useMonochromeChart(ref, "line", chartData, {
        scales: {
          x: { title: { display: true, text: "MISSION DISTANCE [KM]", color: "rgba(255,255,255,0.75)" } },
          y: { title: { display: true, text: "GEOPOTENTIAL ALTITUDE [M]", color: "rgba(255,255,255,0.75)" } }
        }
      });

      return (
        <div className="hud-chart-card">
          <div className="hud-chart-title"><span>[FLT-TRK] MISSION PROFILE FLIGHT TRAJECTORY</span><span>6 PHASES</span></div>

      useMonochromeChart(ref, "line", datasets.length ? { datasets } : null, {
        scales: {
          x: { title: { display: true, text: "MISSION RANGE [KM]", color: "rgba(255,255,255,0.75)" } },

          <canvas ref={ref} />

    }

    /* ════════════════════════════════════════════════════════════════════════
       MODULE 01: TURBOJET (BRAYTON CHEMICAL EQUILIBRIUM)
       ════════════════════════════════════════════════════════════════════════ */
    const TJ_DEF = {
      alt: 35000, mach: 0.8, throttle: 1.0,
      A1: 0.8, A2: 0.5, compStages: 8, turbStages: 2, A8: 0.3,
      etaI: 0.98, CPR: 12.0, etaC: 0.85, etaB: 0.99, dpP: 0.04,
      maxF: 0.25, minF: 0.125, Vnom: 40, Tmax: 1600,
      etaT: 0.88, mechLoss: 0.99, etaNoz: 0.98
    };

    function TurbojetPanel() {
      const [p, setP] = useState(TJ_DEF);
      const [mode, setMode] = useState("single");
      const [sw, setSw] = useState({ param: "altitude", altStart: 0, altEnd: 50000, machStart: 0.1, machEnd: 0.9, thrStart: 0.5, thrEnd: 1.0, nSteps: 15, fixedAlt: 35000, fixedMach: 0.8 });
      const [result, setResult] = useState(null);
      const [tsData, setTsData] = useState(null);
      const [sweepData, setSweepData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const set = (k, v) => setP(prev => ({ ...prev, [k]: v }));
      const setSW = (k, v) => setSw(prev => ({ ...prev, [k]: v }));

      const makeBody = () => ({
        eng_param: { A1: p.A1, A2: p.A2, comp_n_stages: p.compStages, turb_n_stages: p.turbStages, A8: p.A8 },
        eng_perf: { eta_i: p.etaI, CPR: p.CPR, eta_c: p.etaC, eta_b: p.etaB, dp_over_p: p.dpP, max_f: p.maxF, min_f: p.minF, V_nominal: p.Vnom, T_max: p.Tmax, eta_t: p.etaT, mech_loss: p.mechLoss, eta_noz: p.etaNoz },
        throttle_pos: p.throttle, alt: p.alt, M_i: p.mach, mdot_guess: 20
      });

      const runSingle = async () => {
        setLoading(true); setError(null);
        try {
          const res = await fetch(`${API}/api/turbojet/single`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(makeBody())
          });
          if (!res.ok) throw new Error((await res.json()).detail || "Execution failed");
          const data = await res.json();
          setResult(data);
          try {
            const tsRes = await fetch(`${API}/api/turbojet/ts_diagram`, {
              method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(makeBody())
            });
            if (tsRes.ok) setTsData(await tsRes.json());
          } catch (_) {}
        } catch (e) { setError(e.message); }
        setLoading(false);
      };

      const runSweep = async () => {
        setLoading(true); setError(null); setSweepData(null);
        try {
          const body = {
            ...makeBody(),
            sweep_param: sw.param,
            alt_start: sw.altStart, alt_end: sw.altEnd,
            mach_start: sw.machStart, mach_end: sw.machEnd,
            throttle_start: sw.thrStart, throttle_end: sw.thrEnd,
            n_steps: sw.nSteps, fixed_alt: sw.fixedAlt, fixed_mach: sw.fixedMach
          };
          const res = await fetch(`${API}/api/turbojet/sweep`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
          });
          if (!res.ok) throw new Error((await res.json()).detail || "Sweep failed");
          setSweepData(await res.json());
        } catch (e) { setError(e.message); }
        setLoading(false);
      };

      useEffect(() => {
        runSingle();
      }, []);

      return (
        <div className="fui-grid">
          <div className="fui-sidebar">
            <div className="hud-mode-tog">
              <button className={`hud-mode-btn ${mode==="single"?"active":""}`} onClick={()=>setMode("single")}>[DES-PT]</button>
              <button className={`hud-mode-btn ${mode==="sweep"?"active":""}`} onClick={()=>setMode("sweep")}>[SWEEP]</button>
            </div>

            <div className="hud-card">
              <div className="hud-hd"><span>[FLT-ENV] FLIGHT PARAMETERS</span><span className="hud-hd-tag">ICAO-ISA</span></div>
              <div className="hud-bd">
                <HudSlider label="ALTITUDE" unit="FT" value={p.alt} min={0} max={50000} step={500} onChange={v=>set("alt",v)} dp={0}/>
                <HudSlider label="FLIGHT MACH" unit="" value={p.mach} min={0} max={0.95} step={0.01} onChange={v=>set("mach",v)} dp={2}/>
                <HudSlider label="THROTTLE" unit="" value={p.throttle} min={0.5} max={1.0} step={0.01} onChange={v=>set("throttle",v)} dp={2}/>
              </div>
            </div>

            <div className="hud-card">
              <div className="hud-hd"><span>[COMP-01] COMPRESSOR TRAIN</span><span className="hud-hd-tag">AXIAL</span></div>
              <div className="hud-bd">
                <HudSlider label="PRESSURE RATIO (CPR)" unit="" value={p.CPR} min={2} max={38} step={0.5} onChange={v=>set("CPR",v)} dp={1}/>
                <HudSlider label="EFFICIENCY (η_c)" unit="" value={p.etaC} min={0.70} max={0.95} step={0.01} onChange={v=>set("etaC",v)} dp={2}/>
              </div>
            </div>

            <div className="hud-card">
              <div className="hud-hd"><span>[COMB-01] COMBUSTOR &amp; TIT</span><span className="hud-hd-tag">CANTERA HP</span></div>
              <div className="hud-bd">
                <HudSlider label="TIT LIMIT (T_max)" unit="K" value={p.Tmax} min={1000} max={1900} step={10} onChange={v=>set("Tmax",v)} dp={0}/>
                <HudSlider label="BURNER EFF (η_b)" unit="" value={p.etaB} min={0.85} max={1.0} step={0.01} onChange={v=>set("etaB",v)} dp={2}/>
                <HudSlider label="PRESSURE DROP (Δp/p)" unit="" value={p.dpP} min={0.02} max={0.12} step={0.005} onChange={v=>set("dpP",v)} dp={3}/>
              </div>
            </div>

            <div className="hud-card">
              <div className="hud-hd"><span>[TURB-01] TURBINE &amp; EXHAUST</span><span className="hud-hd-tag">AXIAL</span></div>
              <div className="hud-bd">
                <HudSlider label="TURBINE EFF (η_t)" unit="" value={p.etaT} min={0.75} max={0.96} step={0.01} onChange={v=>set("etaT",v)} dp={2}/>
                <HudSlider label="MECH EFF (η_m)" unit="" value={p.mechLoss} min={0.92} max={1.0} step={0.005} onChange={v=>set("mechLoss",v)} dp={3}/>
                <HudSlider label="NOZZLE EFF (η_n)" unit="" value={p.etaNoz} min={0.85} max={1.0} step={0.01} onChange={v=>set("etaNoz",v)} dp={2}/>
              </div>
            </div>

            <button className="hud-btn" onClick={mode==="single"?runSingle:runSweep} disabled={loading}>
              {loading ? <><span className="hud-spin"/>COMPUTING EQUILIBRIUM...</> : mode==="single" ? "▶ EXECUTE BRAYTON CYCLE" : `▶ RUN SWEEP (${sw.nSteps} PTS)`}
            </button>
          </div>

          <div className="fui-content">
            {error && <div className="hud-alert warn"><strong>[ERROR-ALERT]</strong> {error}</div>}

            {result && (
              <>

    function MeanLinePanel() {
      const [mode, setMode] = useState("compressor"); // compressor, multistage, turbine

        r_mean: 0.32, mdot: 40.0, T0_in: 288.15, P0_in: 101325.0, eta_stage: 0.89

      const [turbParams, setTurbParams] = useState({
